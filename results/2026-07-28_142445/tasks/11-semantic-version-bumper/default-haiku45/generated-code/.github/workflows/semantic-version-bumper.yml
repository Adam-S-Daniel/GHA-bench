name: Semantic Version Bumper

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_major:
        description: Force major version bump
        required: false
        default: 'false'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Python
        run: |
          python3 --version
          python3 -m pip --version

      - name: Install pytest
        run: |
          python3 -m pip install --break-system-packages pytest

      - name: Run unit tests
        run: |
          python3 -m pytest test_version_bumper.py test_integration.py -v --tb=short

  version-bump:
    name: Bump Version (on main only)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Run version bump script
        id: bump
        run: |
          python3 bump-version.py --version-file package.json --changelog CHANGELOG.md --base-ref origin/main
        env:
          GIT_AUTHOR_NAME: GitHub Action
          GIT_AUTHOR_EMAIL: action@github.com
          GIT_COMMITTER_NAME: GitHub Action
          GIT_COMMITTER_EMAIL: action@github.com

      - name: Check if files changed
        id: changed
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push version bump
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          git add package.json CHANGELOG.md
          git commit -m "chore: bump version" || true
          git push

      - name: Output version
        run: |
          NEW_VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          echo "Version bumped to: $NEW_VERSION"
