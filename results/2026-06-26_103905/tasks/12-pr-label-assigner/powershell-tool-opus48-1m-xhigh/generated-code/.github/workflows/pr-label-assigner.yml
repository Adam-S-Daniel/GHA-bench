name: PR Label Assigner

# Trigger events:
#   push / pull_request : run on every change so labels stay in sync with the diff.
#   workflow_dispatch   : allow manual / programmatic runs from the Actions UI or API.
#   schedule            : a weekly safety-net re-run (e.g. after rule-config edits).
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

# Least-privilege permissions. The assigner only reads the repo; a real
# deployment that calls the GitHub API to apply labels needs pull-requests:write.
permissions:
  contents: read
  pull-requests: write

# Config + fixture locations, overridable per environment. The act test harness
# writes the per-case fixture (and an optional expected-labels assertion file)
# to these paths before invoking the workflow.
env:
  RULES_FILE: labeler-rules.json
  CHANGED_FILES_FILE: fixtures/changed-files.txt
  EXPECTED_LABELS_FILE: fixtures/expected-labels.txt

jobs:
  unit-tests:
    name: Unit tests (Pester)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          # Run ONLY the module's unit tests (not the act/structure suites, which
          # are not meant to run inside the CI container).
          $config = New-PesterConfiguration
          $config.Run.Path         = './tests/PRLabelAssigner.Tests.ps1'
          $config.Run.PassThru     = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failing test(s)."
          }
          if ($result.PassedCount -lt 1) {
            throw "Pester reported zero passing tests; refusing to claim success."
          }
          Write-Host "Pester OK: $($result.PassedCount) test(s) passed."

  assign-labels:
    name: Assign labels
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show changed-file fixture
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:CHANGED_FILES_FILE)) {
            throw "Changed-files fixture not found at '$env:CHANGED_FILES_FILE'."
          }
          Write-Host "::group::Changed files ($env:CHANGED_FILES_FILE)"
          Get-Content -LiteralPath $env:CHANGED_FILES_FILE | ForEach-Object { Write-Host $_ }
          Write-Host "::endgroup::"

      - name: Compute and assert labels
        id: labeler
        shell: pwsh
        run: |
          # Run the assigner and capture every emitted line so we can both echo
          # it to the log (for the harness to parse) and run an in-pipeline
          # assertion against the expected-labels fixture when present.
          $lines = & ./Invoke-PRLabelAssigner.ps1 `
                      -RulesPath        $env:RULES_FILE `
                      -ChangedFilesPath $env:CHANGED_FILES_FILE
          $lines | ForEach-Object { Write-Host $_ }

          # Extract the ordered label set from the LABELS_BEGIN/LABELS_END frame.
          $actual  = New-Object System.Collections.Generic.List[string]
          $inFrame = $false
          foreach ($line in $lines) {
            if ($line -ceq 'LABELS_END')   { $inFrame = $false; continue }
            if ($inFrame)                  { $actual.Add($line) }
            if ($line -ceq 'LABELS_BEGIN') { $inFrame = $true }
          }

          # Self-validate: if the harness supplied expected labels, assert an
          # exact, ordered match so the workflow itself fails any wrong case.
          if (Test-Path -LiteralPath $env:EXPECTED_LABELS_FILE) {
            $expected = @(
              Get-Content -LiteralPath $env:EXPECTED_LABELS_FILE |
                ForEach-Object { $_.Trim() } |
                Where-Object   { $_ -and -not $_.StartsWith('#') }
            )
            Write-Host "EXPECTED: [$($expected -join ', ')]"
            Write-Host "ACTUAL:   [$($actual -join ', ')]"
            if (($expected -join '|') -ne (($actual.ToArray()) -join '|')) {
              throw "Label mismatch. expected=[$($expected -join ', ')] actual=[$($actual -join ', ')]"
            }
            Write-Host "ASSERTION_PASSED labels match expected (exact, ordered)."
          }
          else {
            Write-Host "No expected-labels file at '$env:EXPECTED_LABELS_FILE'; skipping assertion."
          }
