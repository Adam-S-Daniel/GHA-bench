# =============================================================================
# Path -> label rules for the PR Label Assigner.
#
# Format (one rule per line):
#     <glob-pattern> | <comma-separated-labels> | <priority>
#
#   * '#' starts a comment; blank lines are ignored.
#   * Whitespace around fields is trimmed (so columns can be aligned).
#   * Glob semantics: '*' stays within a path segment, '**' crosses '/',
#     and a pattern with no '/' is matched against the file's basename.
#   * Priority is an integer; higher priorities sort first in the output.
#     When two rules assign the same label, the highest priority wins.
#   * A pattern beginning with '!' is an EXCLUSION rule: matching files do not
#     receive the listed labels ('*' = suppress every label for the file).
# =============================================================================

# --- Documentation -----------------------------------------------------------
docs/**           | documentation  | 10
*.md              | documentation  | 10

# --- Source code -------------------------------------------------------------
src/api/**        | api,backend     | 30
src/ui/**         | frontend        | 20
src/**            | source          | 5

# --- Tests -------------------------------------------------------------------
*.test.*          | tests           | 40
**/*.spec.*       | tests           | 40

# --- CI / configuration ------------------------------------------------------
**/*.yml          | ci              | 15
**/*.yaml         | ci              | 15

# --- Dependencies ------------------------------------------------------------
package.json      | dependencies    | 25

# --- Exclusions --------------------------------------------------------------
# Vendored / third-party code should never be labelled.
!**/vendor/**     | *               | 0
