name: PR Label Assigner

# Trigger on the events where label assignment is meaningful:
#  - pull_request: the real use case (label a PR from its changed files)
#  - push:         lets the pipeline (and `act push`) run end-to-end in CI
#  - workflow_dispatch: manual runs, optionally pointing at a different fixture
#  - schedule:     a weekly safety re-run
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      changed_files_path:
        description: Path to the changed-file list to label
        required: false
        default: fixtures/changed-files.txt

# Least-privilege token. `pull-requests: write` reflects the real-world action
# of applying labels; this demo computes them deterministically and prints them
# (no external API calls, so no secrets are required).
permissions:
  contents: read
  pull-requests: write

# Shared configuration consumed by the steps below.
env:
  CONFIG_PATH: config/labels.json
  CHANGED_FILES_PATH: fixtures/changed-files.txt

jobs:
  test:
    name: Unit tests (Pester)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          # Run only the module's unit tests here (never the act harness,
          # which would recursively invoke act inside the container).
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './PrLabelAssigner.Tests.ps1'
          $cfg.Run.Exit = $true          # non-zero exit on any failing test
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

  assign-labels:
    name: Assign labels
    runs-on: ubuntu-latest
    needs: test                          # only label if the unit tests pass
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve labels from the changed-file list
        id: labeler
        shell: pwsh
        env:
          # workflow_dispatch may override the fixture; fall back to the env default.
          CHANGED: ${{ github.event.inputs.changed_files_path || env.CHANGED_FILES_PATH }}
        run: |
          ./Invoke-PrLabelAssigner.ps1 -ChangedFilesPath $env:CHANGED -ConfigPath $env:CONFIG_PATH

      - name: Echo the resolved label set
        shell: pwsh
        run: |
          # Demonstrates that the step output is wired up for downstream consumers.
          $labels = '${{ steps.labeler.outputs.labels }}'
          Write-Host "STEP-OUTPUT-LABELS=$labels"
