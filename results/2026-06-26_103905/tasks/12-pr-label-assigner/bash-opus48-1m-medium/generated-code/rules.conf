# Path-to-label rules for the PR label assigner.
# Format:  <glob-pattern>|<label>|<priority>
#   * Lower priority number = stronger precedence (sorts first in output).
#   * A file may match many rules and thus receive many labels.
#   * Inside bash [[ ]] matching, "*" spans "/", so "docs/**" matches any
#     depth under docs/ and "*.test.*" matches test files anywhere.

# Tests get the strongest precedence so they surface first.
*.test.*|tests|5
**/*.spec.*|tests|5

# Documentation.
docs/**|documentation|10
*.md|documentation|10

# CI / workflow plumbing.
.github/**|ci|15

# API surface (more specific than generic backend, so a lower number).
src/api/**|api|20

# Generic backend source.
src/**|backend|50
