# label-rules.conf — path-to-label rules for the PR label assigner.
#
# Format (one rule per line):
#   <glob-pattern> -> <label>[,<label>...] [priority]
#
# Glob semantics (minimatch-style):
#   *   matches anything within a single path segment (does NOT cross "/")
#   **  matches anything across path segments (crosses "/")
#   ?   matches a single character (not "/")
#
# Priority (optional integer, default 0) controls output ordering when several
# rules contribute labels: higher priority sorts first; ties break by name.
# Blank lines and lines starting with '#' are ignored.

docs/**        -> documentation 50
**/*.md        -> documentation 50
src/api/**     -> api 80
src/**         -> backend 30
**/*.test.*    -> tests 90
.github/**     -> ci 40
package.json   -> dependencies 60
config/**      -> config,backend 25
