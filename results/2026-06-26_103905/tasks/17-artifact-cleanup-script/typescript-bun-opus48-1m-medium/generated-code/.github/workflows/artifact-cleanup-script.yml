name: Artifact Cleanup

# Triggers:
# - push / pull_request: validate the script + unit tests on every change
# - schedule: run the cleanup planner weekly (real-world retention sweep)
# - workflow_dispatch: allow a manual run with a custom fixture
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Mondays at 03:00 UTC — a typical maintenance window.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      fixture:
        description: 'Path to the artifact config JSON to evaluate'
        required: false
        default: 'fixtures/active.json'

# Least-privilege: the planner only needs to read the repository contents.
permissions:
  contents: read

# The default fixture; workflow_dispatch can override it. The act-based test
# harness writes the case-under-test to fixtures/active.json before each run.
env:
  FIXTURE_FILE: ${{ github.event.inputs.fixture || 'fixtures/active.json' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      # Only the pure-logic unit tests run here; the act harness is excluded so
      # the workflow does not try to launch Docker/act from inside the container.
      - name: Run unit tests
        run: bun test cleanup.test.ts

  cleanup-plan:
    name: Generate cleanup plan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Generate artifact cleanup plan
        run: |
          echo "Evaluating fixture: $FIXTURE_FILE"
          bun run cleanup.ts "$FIXTURE_FILE" | tee plan-output.txt

      - name: Publish plan to job summary
        run: |
          {
            echo "## Artifact Cleanup Plan"
            echo ""
            echo '```'
            cat plan-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
