name: Artifact Cleanup

# Triggers: run on pushes/PRs that touch the cleanup logic, on a weekly
# schedule (real-world maintenance use), and on demand via the UI.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 03:17 every Monday -- off-peak weekly artifact sweep.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only, do not execute deletions"
        type: boolean
        default: true

# Least privilege: we only need to read the repo contents here.
permissions:
  contents: read

env:
  # A fixed reference time keeps the demo deterministic in CI. In real use this
  # would be omitted so the script uses the current UTC clock.
  CLEANUP_NOW: "2026-06-26T12:00:00Z"
  ARTIFACTS_FILE: fixtures/artifacts.json
  POLICY_FILE: fixtures/policy.json

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify project files exist
        run: |
          test -f artifact_cleanup.py
          test -f "${ARTIFACTS_FILE}"
          test -f "${POLICY_FILE}"

      - name: Generate cleanup plan
        run: |
          python3 artifact_cleanup.py \
            --artifacts "${ARTIFACTS_FILE}" \
            --config "${POLICY_FILE}" \
            --now "${CLEANUP_NOW}" \
            --output plan.json \
            --dry-run | tee summary.txt

      - name: Publish summary to job log
        run: |
          {
            echo "## Artifact Cleanup Summary"
            echo '```'
            cat summary.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify plan artifact was produced
        run: |
          test -s plan.json
          echo "Deletion plan written to plan.json:"
          cat plan.json
