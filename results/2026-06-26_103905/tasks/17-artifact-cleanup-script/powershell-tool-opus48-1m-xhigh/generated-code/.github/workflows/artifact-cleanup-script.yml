name: Artifact Cleanup

# Real-world usage: validate the tooling on every push/PR, and run the cleanup
# plan on a weekly schedule. The plan can also be triggered manually, optionally
# pointing at a different scenario file or switching to execute mode.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 03:00 UTC every Monday.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      scenario_path:
        description: Path to the cleanup scenario JSON file.
        required: false
        default: fixtures/scenario.json
      execute:
        description: Run in execute (non-dry-run) mode.
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Least privilege: the tool only reads the checked-out repository. (A real
# implementation that called the GitHub API to delete artifacts would also need
# `actions: write`; this benchmark version operates on mock data only.)
permissions:
  contents: read

# Shared configuration. The scenario path comes from the manual input when
# present, otherwise the committed default.
env:
  CLEANUP_SCENARIO_PATH: ${{ github.event.inputs.scenario_path || 'fixtures/scenario.json' }}

jobs:
  unit-tests:
    name: Pester unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure Pester 5+ is available
        shell: pwsh
        run: |
          $pester = Get-Module -ListAvailable Pester |
            Where-Object { $_.Version.Major -ge 5 } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if ($pester) {
            Write-Host "Pester $($pester.Version) is already installed."
          }
          else {
            Write-Host "Installing Pester 5..."
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
            Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -ErrorAction Stop
          }

      - name: Run Pester test suite
        shell: pwsh
        run: |
          Import-Module Pester
          $result = Invoke-Pester -Path tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed."
          }
          Write-Host "All $($result.PassedCount) Pester tests passed."

  cleanup-plan:
    name: Generate cleanup plan
    runs-on: ubuntu-latest
    # Only generate the plan once the tooling is proven correct.
    needs: unit-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate artifact deletion plan
        shell: pwsh
        run: |
          Write-Host "Scenario file: $env:CLEANUP_SCENARIO_PATH"

          # Manual execute mode overrides the scenario's dryRun; otherwise the
          # scenario file decides (dry-run by default).
          if ('${{ github.event.inputs.execute }}' -eq 'true') {
            $report = ./Invoke-ArtifactCleanupCli.ps1 -Execute 2>&1 | Out-String
          }
          else {
            $report = ./Invoke-ArtifactCleanupCli.ps1 2>&1 | Out-String
          }
          $code = $LASTEXITCODE

          # Echo the plan to the build log (this is what the act harness parses).
          Write-Output $report

          # Publish the same plan to the GitHub job summary.
          if ($env:GITHUB_STEP_SUMMARY) {
            '## Artifact cleanup plan' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```text'                  | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $report                    | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```'                      | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          if ($code -ne 0) { throw "Cleanup CLI exited with code $code." }
