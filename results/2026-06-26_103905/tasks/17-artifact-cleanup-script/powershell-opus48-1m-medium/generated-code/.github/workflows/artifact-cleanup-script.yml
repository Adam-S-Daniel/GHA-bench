name: Artifact Cleanup

# Triggers: run on pushes/PRs that touch the cleanup tooling, on a daily schedule
# to simulate a real retention job, and on-demand via the Actions UI.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no deletions reported as performed)'
        required: false
        default: 'true'

# Least-privilege: the cleanup engine only reads repository contents.
permissions:
  contents: read

env:
  ARTIFACTS_FILE: fixtures/artifacts.json
  POLICY_FILE: fixtures/policy.json

jobs:
  test:
    name: Unit tests (Pester)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path tests/ArtifactCleanup.Tests.ps1 -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) {
            throw "Pester: $($result.FailedCount) test(s) failed."
          }
          Write-Host "Pester: $($result.PassedCount) test(s) passed."

  cleanup:
    name: Generate deletion plan
    runs-on: ubuntu-latest
    needs: test  # only build the plan once the engine is verified
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate artifact deletion plan
        shell: pwsh
        env:
          ARTIFACTS_FILE: ${{ env.ARTIFACTS_FILE }}
          POLICY_FILE: ${{ env.POLICY_FILE }}
        run: |
          ./Invoke-Cleanup.ps1 -ArtifactsPath $env:ARTIFACTS_FILE -PolicyPath $env:POLICY_FILE
