name: Artifact Cleanup

# Triggers:
#   push / pull_request -> validate the engine (unit tests) and produce a plan
#   schedule            -> nightly maintenance run that would prune old artifacts
#   workflow_dispatch   -> manual run with an optional dry-run toggle
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (report only, no deletions)'
        type: boolean
        default: true

# Least-privilege by default. `actions: write` is what a real deletion run
# would need to remove artifacts via the GitHub API; here data is mocked.
permissions:
  contents: read
  actions: write

# Path to the artifact metadata fixture the cleanup script consumes.
env:
  FIXTURE_PATH: fixtures/case.json

jobs:
  # ---------------------------------------------------------------------
  # Job 1: prove the retention engine is correct via the Pester unit tests.
  # ---------------------------------------------------------------------
  unit-tests:
    name: Unit tests (Pester)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PowerShell & Pester are available
        shell: pwsh
        run: |
          # pwsh + Pester ship with GitHub-hosted runners and the act image, so
          # this is effectively a no-op verification. We still install Pester if
          # it is somehow missing, to keep the workflow portable.
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Write-Host 'Pester not found; installing...'
            Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          }
          $v = (Get-Module -ListAvailable -Name Pester | Sort-Object Version -Descending | Select-Object -First 1).Version
          Write-Host "Pester $v"

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests/ArtifactCleanup.Tests.ps1'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $cfg
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) unit test(s) failed."
          }
          Write-Host "All $($result.PassedCount) unit tests passed."

  # ---------------------------------------------------------------------
  # Job 2: run the cleanup script against the fixture and publish the plan.
  # Depends on the unit tests passing first.
  # ---------------------------------------------------------------------
  cleanup-plan:
    name: Generate cleanup plan
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate artifact cleanup plan
        shell: pwsh
        env:
          # workflow_dispatch can override dry-run; other events use the fixture.
          DISPATCH_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          $dispatch = $env:DISPATCH_DRY_RUN
          if ($dispatch -eq 'true') {
            ./Invoke-ArtifactCleanup.ps1 -FixturePath $env:FIXTURE_PATH -DryRun | Tee-Object -FilePath plan-output.txt
          }
          elseif ($dispatch -eq 'false') {
            ./Invoke-ArtifactCleanup.ps1 -FixturePath $env:FIXTURE_PATH -DryRun:$false | Tee-Object -FilePath plan-output.txt
          }
          else {
            # push / pull_request / schedule: honour the dryRun value in the fixture.
            ./Invoke-ArtifactCleanup.ps1 -FixturePath $env:FIXTURE_PATH | Tee-Object -FilePath plan-output.txt
          }

      - name: Publish plan to the job summary
        if: always()
        shell: pwsh
        run: |
          if ($env:GITHUB_STEP_SUMMARY -and (Test-Path plan-output.txt)) {
            "## Artifact Cleanup Plan" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content plan-output.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
