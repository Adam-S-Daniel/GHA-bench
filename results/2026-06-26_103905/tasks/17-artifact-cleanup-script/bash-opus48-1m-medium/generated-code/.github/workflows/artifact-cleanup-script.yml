name: Artifact Cleanup

# Trigger on code changes, on a weekly schedule (artifact retention is a
# housekeeping task that naturally runs periodically), and on demand. The
# workflow_dispatch inputs let an operator override the retention policy when
# running manually; scheduled/push runs fall back to fixtures/policy.env.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 3 * * 0' # Sundays at 03:00 UTC
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Delete artifacts older than N days (blank = disabled)'
        required: false
        default: ''
      keep_latest:
        description: 'Keep N newest artifacts per workflow run (blank = disabled)'
        required: false
        default: ''
      max_total_size:
        description: 'Cap total retained size in bytes (blank = disabled)'
        required: false
        default: ''
      dry_run:
        description: 'Run in dry-run mode'
        type: boolean
        required: false
        default: true

# Least-privilege: the script only reads metadata and prints a plan.
permissions:
  contents: read

# Pin a deterministic "now" so the max-age policy is reproducible in CI.
env:
  DEFAULT_NOW: '1782432000'

jobs:
  # Job 1: static validation of the script (syntax + shellcheck).
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Validate bash syntax
        run: bash -n artifact-cleanup.sh

      - name: Run shellcheck
        run: shellcheck artifact-cleanup.sh

  # Job 2: run the bats test suite. Depends on validation passing first.
  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats

      - name: Run bats test suite
        run: bats tests/cleanup.bats

  # Job 3: execute the script against the committed fixture and print the
  # deletion plan. This is the step the act harness inspects for exact values.
  plan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate cleanup plan
        env:
          # workflow_dispatch inputs override the fixture file when present.
          IN_MAX_AGE: ${{ github.event.inputs.max_age_days }}
          IN_KEEP_LATEST: ${{ github.event.inputs.keep_latest }}
          IN_MAX_TOTAL: ${{ github.event.inputs.max_total_size }}
          IN_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          # Load the policy from the committed fixture (the act harness writes
          # this per test case). Defaults keep every value blank/disabled.
          MAX_AGE_DAYS=''
          KEEP_LATEST=''
          MAX_TOTAL_SIZE=''
          NOW="${DEFAULT_NOW}"
          DRY_RUN=0
          if [ -f fixtures/policy.env ]; then
            # shellcheck disable=SC1091
            . ./fixtures/policy.env
          fi

          # Manual-dispatch inputs take precedence when provided.
          [ -n "${IN_MAX_AGE:-}" ]    && MAX_AGE_DAYS="${IN_MAX_AGE}"
          [ -n "${IN_KEEP_LATEST:-}" ] && KEEP_LATEST="${IN_KEEP_LATEST}"
          [ -n "${IN_MAX_TOTAL:-}" ]  && MAX_TOTAL_SIZE="${IN_MAX_TOTAL}"
          [ "${IN_DRY_RUN:-}" = "true" ] && DRY_RUN=1

          # Build the argument list from the resolved policy.
          args=(--input fixtures/artifacts.tsv --now "${NOW}")
          [ -n "${MAX_AGE_DAYS}" ]   && args+=(--max-age-days "${MAX_AGE_DAYS}")
          [ -n "${KEEP_LATEST}" ]    && args+=(--keep-latest "${KEEP_LATEST}")
          [ -n "${MAX_TOTAL_SIZE}" ] && args+=(--max-total-size "${MAX_TOTAL_SIZE}")
          [ "${DRY_RUN}" = "1" ]     && args+=(--dry-run)

          echo "Running: artifact-cleanup.sh ${args[*]}"
          echo "----------------------------------------------------------------"
          bash artifact-cleanup.sh "${args[@]}"
