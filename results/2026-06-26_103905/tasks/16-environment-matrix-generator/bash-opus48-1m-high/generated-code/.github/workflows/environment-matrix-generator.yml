name: Environment Matrix Generator

# Triggers: validate on every push / PR, allow manual runs, and a weekly
# scheduled smoke-test to catch environment drift.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

# Least-privilege: the pipeline only needs to read the checked-out repository.
permissions:
  contents: read

env:
  # Centralised paths so steps and the generated outputs stay in sync.
  GENERATOR: ./generate-matrix.sh
  CONFIG: tests/fixtures/strategy.json

jobs:
  # Job 1: run the generator across every fixture and assert exact values.
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      total: ${{ steps.gen.outputs.total }}
      cases: ${{ steps.cases.outputs.count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          jq --version

      - name: Validate script syntax
        run: bash -n "$GENERATOR" && bash -n tests/run-cases.sh

      - name: Generate matrix from the default config
        id: gen
        run: |
          echo "Using config: $CONFIG"
          matrix_json="$("$GENERATOR" "$CONFIG")"
          echo "$matrix_json"
          total="$(echo "$matrix_json" | jq '.total')"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          # Expose the include list as a compact line for downstream inspection.
          echo "MATRIX=$(echo "$matrix_json" | jq -c '.matrix')"

      - name: Run all fixture cases through the generator
        id: cases
        run: |
          # Drives every fixture and asserts against tests/expected.json.
          # Exits non-zero (failing the job) on any mismatch.
          ./tests/run-cases.sh
          count="$(jq 'length' tests/expected.json)"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  # Job 2: depends on job 1; reports a summary using its outputs.
  summary:
    runs-on: ubuntu-latest
    needs: generate-matrix
    steps:
      - name: Print summary
        run: |
          echo "Default config produced ${{ needs.generate-matrix.outputs.total }} matrix combinations."
          echo "Validated ${{ needs.generate-matrix.outputs.cases }} fixture cases successfully."
