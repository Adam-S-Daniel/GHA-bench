name: Environment Matrix Generator

# Triggers: validate on every push / PR, allow manual runs (with an optional
# custom config path), and re-check weekly so config drift is caught even when
# nothing changed.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to the matrix config JSON
        required: false
        default: matrix-config.json
  schedule:
    - cron: '0 6 * * 1'

# Least privilege: this pipeline only reads the checked-out repository.
permissions:
  contents: read

# Default config path; workflow_dispatch may override it via its input.
env:
  MATRIX_CONFIG_PATH: matrix-config.json

jobs:
  # 1) Run the Pester test suite (logic + CLI) so the generator is proven
  #    correct before any matrix is produced.
  test:
    name: Unit tests (Pester)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep child processes from polluting this step's real output file;
          # the dedicated GITHUB_OUTPUT test sets its own temp target.
          $env:GITHUB_OUTPUT = ''
          Import-Module Pester -MinimumVersion 5.0.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path       = @('./tests/MatrixGenerator.Tests.ps1', './tests/Generate-Matrix.Tests.ps1')
          $cfg.Run.PassThru   = $true
          $cfg.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $cfg
          Write-Output "PESTER-RESULT passed=$($result.PassedCount) failed=$($result.FailedCount)"
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failing test(s)."
          }

  # 2) Generate the build matrix from the configured JSON and publish it as
  #    job outputs for the downstream build job to consume.
  generate:
    name: Generate matrix
    needs: test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
      maxParallel: ${{ steps.gen.outputs.maxParallel }}
      failFast: ${{ steps.gen.outputs.failFast }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build matrix
        id: gen
        shell: pwsh
        env:
          # workflow_dispatch input wins; otherwise fall back to the env default.
          CONFIG_PATH: ${{ inputs.config_path || env.MATRIX_CONFIG_PATH }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./Generate-Matrix.ps1 -ConfigPath $env:CONFIG_PATH

      - name: Summarise generated matrix
        shell: pwsh
        env:
          COUNT: ${{ steps.gen.outputs.count }}
          MAXP: ${{ steps.gen.outputs.maxParallel }}
          FF: ${{ steps.gen.outputs.failFast }}
        run: |
          Write-Output "Generated matrix has $env:COUNT combination(s)."
          Write-Output "strategy: max-parallel=$env:MAXP fail-fast=$env:FF"

  # 3) Consume the generated matrix exactly the way a real pipeline would:
  #    fromJSON() fans the {include:[...]} list into one build job per
  #    combination. runs-on is fixed to ubuntu-latest (the only runner image
  #    available under act) and matrix.os is treated as build *data*.
  build:
    name: Build
    needs: generate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    steps:
      - name: Show this job's combination
        shell: pwsh
        env:
          COMBO: ${{ toJSON(matrix) }}
        run: |
          Write-Output "BUILD-COMBO $($env:COMBO -replace '\s+', ' ')"

  # 4) Final gate: confirm the build fan-out completed successfully.
  report:
    name: Report
    needs: [generate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Report success
        shell: pwsh
        env:
          COUNT: ${{ needs.generate.outputs.count }}
        run: |
          Write-Output "ALL-DONE matrix-count=$env:COUNT build=success"
