name: Test Results Aggregator

# Trigger on pushes/PRs, a weekly schedule (catch flaky regressions), and manual runs.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

# Least-privilege: the aggregator only reads checked-out files and writes the job summary.
permissions:
  contents: read

# Directory holding the test result files to aggregate (a matrix build's artifacts).
env:
  TEST_RESULTS_DIR: fixtures

jobs:
  # Job 1 — run the module's Pester unit tests. Gates the aggregate job below.
  test:
    name: Unit Tests (Pester)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PowerShell and Pester are available
        shell: bash
        run: |
          # PowerShell + Pester are pre-installed on GitHub-hosted runners and in the
          # benchmark act container, so this is a near-instant portability no-op. It only
          # does real work on a vanilla image that lacks them.
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "pwsh not found; installing PowerShell"
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
          pwsh -NoProfile -Command "if (-not (Get-Module -ListAvailable Pester)) { Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck }"

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/TestResultsAggregator.Tests.ps1'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failing test(s)."
          }
          Write-Host "All $($result.PassedCount) unit tests passed."

  # Job 2 — aggregate the matrix test results and publish the job summary. Runs only
  # after the unit tests pass (job dependency via `needs`).
  aggregate:
    name: Aggregate Test Results
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PowerShell is available
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "pwsh not found; installing PowerShell"
            sudo apt-get update
            sudo apt-get install -y powershell
          fi

      - name: Aggregate results and write job summary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Invoke-Aggregator.ps1 -Path $env:TEST_RESULTS_DIR -ShowSummary
