name: Test Results Aggregator

# Run on pushes and PRs that might change the tool or its fixtures, on a daily
# schedule (a good fit for surfacing flaky tests over time), and on demand.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 06:00 UTC every day.
    - cron: '0 6 * * *'
  workflow_dispatch:

# Least-privilege: the workflow only reads the repository contents.
permissions:
  contents: read

# Directory the aggregator scans for JUnit XML / JSON reports.
env:
  AGG_INPUT_DIR: fixtures

jobs:
  # Job 1: drive the module's Pester unit tests. The aggregation job depends on
  # this passing, so a broken parser never produces a misleading summary.
  unit-tests:
    name: Pester unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          # Run ONLY the module unit tests here (not the act-driven workflow
          # harness, which would otherwise try to launch act inside the runner).
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/TestResultsAggregator.Tests.ps1'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          "Pester: $($result.PassedCount) passed, $($result.FailedCount) failed"
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failing unit test(s)."
          }

  # Job 2: aggregate the test reports and publish the GitHub job summary.
  aggregate:
    name: Aggregate test results
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Aggregate results and write job summary
        shell: pwsh
        env:
          # GitHub provides GITHUB_STEP_SUMMARY automatically; the script
          # defaults to it, so the Markdown lands on the job summary page.
          AGG_INPUT_DIR: ${{ env.AGG_INPUT_DIR }}
        run: |
          ./Invoke-Aggregator.ps1 -Path $env:AGG_INPUT_DIR
