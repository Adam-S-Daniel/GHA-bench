name: Dependency License Checker

# Run on pushes and PRs that might change dependencies, on a weekly schedule to
# catch newly-flagged licenses, and on manual dispatch.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:

# Principle of least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

# Shared configuration. Paths are relative to the repository root. A test
# harness can overwrite the files under fixtures/ to drive different cases.
env:
  MANIFEST_DIR: fixtures
  CONFIG_PATH: config/license-config.json
  LICENSE_DB: fixtures/license-db.json

jobs:
  license-check:
    name: Check dependency licenses
    runs-on: ubuntu-latest
    # Expose the parsed compliance result so dependent jobs can consume it.
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
      summary: ${{ steps.check.outputs.summary }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show PowerShell / Pester versions
        shell: pwsh
        run: |
          "PowerShell $($PSVersionTable.PSVersion)" | Write-Host
          $pester = (Get-Module -ListAvailable Pester | Select-Object -First 1).Version
          "Pester $pester" | Write-Host

      - name: Run unit tests (Pester)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Invoke-Pester -Path tests/ -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failing test(s)"
          }

      - name: Run dependency license compliance check
        id: check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Run the checker in report mode (exit 0) and capture its output.
          $report = ./Invoke-LicenseCheck.ps1 `
            -ManifestPath $env:MANIFEST_DIR `
            -ConfigPath   $env:CONFIG_PATH `
            -LicenseDbPath $env:LICENSE_DB

          $report | Write-Host
          $report | Set-Content -Path compliance-report.txt

          # Publish a readable report to the job summary (when running on GitHub).
          if ($env:GITHUB_STEP_SUMMARY) {
            "## Dependency License Compliance Report" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            '```'                                     | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            $report                                   | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            '```'                                     | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

          # Parse the deterministic SUMMARY / RESULT lines into job outputs.
          $lines       = $report -split "`r?`n"
          $summaryLine = $lines | Where-Object { $_ -like 'SUMMARY:*' } | Select-Object -First 1
          $resultLine  = $lines | Where-Object { $_ -like 'RESULT:*' }  | Select-Object -First 1
          if (-not $summaryLine) { throw 'Report did not contain a SUMMARY line' }

          $verdict = ($resultLine -replace '^RESULT:\s*', '').Trim()
          if ($env:GITHUB_OUTPUT) {
            "verdict=$verdict"     | Add-Content -Path $env:GITHUB_OUTPUT
            "summary=$summaryLine" | Add-Content -Path $env:GITHUB_OUTPUT
          }
          "Compliance verdict: $verdict" | Write-Host

  gate:
    name: Evaluate compliance gate
    needs: license-check
    runs-on: ubuntu-latest
    steps:
      - name: Report upstream compliance result
        shell: pwsh
        env:
          VERDICT: ${{ needs.license-check.outputs.verdict }}
          SUMMARY: ${{ needs.license-check.outputs.summary }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:VERDICT)) {
            throw 'No verdict was received from the license-check job'
          }
          "Gate received verdict: $env:VERDICT" | Write-Host
          "Gate received summary: $env:SUMMARY" | Write-Host
          # This gate runs in advisory (report) mode and always succeeds; flip the
          # checker to -FailOnViolation in the job above to hard-fail on denials.
          "Compliance gate evaluation complete." | Write-Host
