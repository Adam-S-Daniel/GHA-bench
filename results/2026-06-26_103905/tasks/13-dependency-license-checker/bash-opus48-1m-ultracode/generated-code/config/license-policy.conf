# License compliance policy
# --------------------------
# Licenses are matched case-insensitively. Values may be comma- or whitespace-
# separated, and both allow/deny may appear on multiple lines (entries
# accumulate). Anything looked up that is not on either list - or that cannot
# be determined - is reported as UNKNOWN. A license appearing on the deny list
# is rejected even if it also appears on the allow list (deny wins).

# Permissive licenses we accept.
allow = MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense, Zlib

# Copyleft / source-available licenses we reject.
deny = GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0, SSPL-1.0, BUSL-1.1
