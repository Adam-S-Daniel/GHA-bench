name: Dependency License Checker

# Run on code changes, PRs, a weekly schedule (catch newly-flagged licenses),
# and on-demand via the Actions UI.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least-privilege: the checker only needs to read the repository contents.
permissions:
  contents: read

env:
  # Set to 'true' to make the compliance job fail when a denied license is
  # found. Kept 'false' here so the pipeline reports without breaking CI.
  FAIL_ON_DENIED: 'false'

jobs:
  # --- Stage 1: run the Pester unit tests (TDD suite, mocked license lookup) ---
  unit-tests:
    name: Unit tests (Pester)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Pester version: $((Get-Module -ListAvailable Pester | Select-Object -First 1).Version)"
          $config = New-PesterConfiguration
          $config.Run.Path = './LicenseChecker.Tests.ps1'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failing test(s)."
          }
          Write-Host "All $($result.PassedCount) unit tests passed."

  # --- Stage 2: run the actual compliance check against the repo manifest ---
  compliance-report:
    name: License compliance report
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run license compliance check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Invoke-LicenseCheck.ps1 -ProjectDir .
