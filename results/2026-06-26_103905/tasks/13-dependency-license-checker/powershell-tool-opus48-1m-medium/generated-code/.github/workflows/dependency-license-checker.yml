name: Dependency License Checker

# Trigger on pushes and PRs (gate merges), a weekly schedule (catch newly
# published license changes), and manual dispatch (ad-hoc audits).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      manifest_path:
        description: 'Path to the dependency manifest to audit'
        required: false
        default: 'fixtures/package.json'

# Least-privilege: the checker only needs to read the repository contents.
permissions:
  contents: read

# Config and license-database paths are constant. The manifest path is resolved
# inside the job step so it can be overridden by the workflow_dispatch input or
# by act via `--env MANIFEST_PATH=...`, falling back to the demo fixture.
env:
  CONFIG_PATH: config/license-config.json
  DATABASE_PATH: config/license-db.json
  DISPATCH_MANIFEST: ${{ github.event.inputs.manifest_path }}

jobs:
  unit-tests:
    name: Pester unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/DependencyLicenseChecker.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  license-check:
    name: License compliance check
    runs-on: ubuntu-latest
    # Only run the audit once the unit tests have proven the logic is sound.
    needs: unit-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate compliance report
        id: report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Precedence: container env (act --env) > workflow_dispatch input > default.
          $manifest = $env:MANIFEST_PATH
          if ([string]::IsNullOrWhiteSpace($manifest)) { $manifest = $env:DISPATCH_MANIFEST }
          if ([string]::IsNullOrWhiteSpace($manifest)) { $manifest = 'fixtures/package.json' }
          Write-Host "Auditing manifest: $manifest"
          ./Invoke-LicenseCheck.ps1 `
            -ManifestPath $manifest `
            -ConfigPath $env:CONFIG_PATH `
            -DatabasePath $env:DATABASE_PATH

      - name: Report status
        shell: pwsh
        run: |
          Write-Host "License compliance report generated successfully."
