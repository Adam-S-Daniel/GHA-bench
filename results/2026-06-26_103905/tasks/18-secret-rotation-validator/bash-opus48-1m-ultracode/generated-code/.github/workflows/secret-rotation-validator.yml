name: Secret Rotation Validator

# Triggers:
#   - push / pull_request: validate the script and surface a rotation report on
#     every change.
#   - schedule: run weekly so the report reflects the passage of time even when
#     nothing changes in the repo (rotation status is time-dependent).
#   - workflow_dispatch: let a human run it on demand and tweak the warning
#     window.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:
    inputs:
      warn_days:
        description: "Warning window in days"
        required: false
        default: "14"

# Least-privilege: this workflow only reads the repository.
permissions:
  contents: read

# Shared configuration. REFERENCE_DATE is pinned so the report is deterministic
# in CI (and in `act` runs); in a real deployment you would drop it to use the
# current date. WARN_DAYS honors the workflow_dispatch input when present.
env:
  CONFIG_FILE: "fixtures/secrets.json"
  REFERENCE_DATE: "2026-06-28"
  WARN_DAYS: ${{ github.event.inputs.warn_days || '14' }}

jobs:
  lint-and-test:
    name: Lint and unit-test the validator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure test tooling is installed
        # bats/shellcheck are pre-installed on GitHub-hosted runners but not in
        # the act container image; install only what is actually missing.
        run: |
          set -euo pipefail
          need=()
          for t in bats shellcheck jq; do
            command -v "$t" >/dev/null 2>&1 || need+=("$t")
          done
          if [ "${#need[@]}" -gt 0 ]; then
            echo "Installing: ${need[*]}"
            apt-get update
            apt-get install -y --no-install-recommends "${need[@]}"
          fi

      - name: Validate bash syntax
        run: bash -n secret-rotation-validator.sh

      - name: Shellcheck
        run: shellcheck secret-rotation-validator.sh

      - name: Run bats unit tests
        run: bats tests/validator.bats

  rotation-report:
    name: Generate rotation report
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare secrets config
        # The test harness drops a per-case fixture at $CONFIG_FILE. If none is
        # present (e.g. a plain push), fall back to the bundled sample so the
        # job still produces a meaningful report.
        run: |
          set -euo pipefail
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "No $CONFIG_FILE found; falling back to fixtures/mixed.json"
            mkdir -p "$(dirname "$CONFIG_FILE")"
            cp fixtures/mixed.json "$CONFIG_FILE"
          fi
          echo "Using config: $CONFIG_FILE"

      - name: Generate Markdown report
        run: |
          set -euo pipefail
          ./secret-rotation-validator.sh \
            --now "$REFERENCE_DATE" \
            --warn-days "$WARN_DAYS" \
            "$CONFIG_FILE" | tee report.md
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate JSON report and machine-readable summary
        run: |
          set -euo pipefail
          ./secret-rotation-validator.sh \
            --now "$REFERENCE_DATE" \
            --warn-days "$WARN_DAYS" \
            --format json \
            "$CONFIG_FILE" > report.json
          cat report.json
          expired=$(jq -r '.summary.expired' report.json)
          warning=$(jq -r '.summary.warning' report.json)
          ok=$(jq -r '.summary.ok' report.json)
          total=$(jq -r '.summary.total' report.json)
          # Single, easy-to-assert line consumed by the act test harness.
          echo "ROTATION-SUMMARY expired=${expired} warning=${warning} ok=${ok} total=${total}"

      - name: Show generated report files
        # Artifacts are intentionally not uploaded: actions/upload-artifact needs
        # the GitHub artifact service, which is not available under `act`. The
        # reports above already go to stdout and the job summary; here we just
        # confirm the files exist on disk.
        run: |
          set -euo pipefail
          ls -l report.md report.json
          echo "Reports generated successfully."
