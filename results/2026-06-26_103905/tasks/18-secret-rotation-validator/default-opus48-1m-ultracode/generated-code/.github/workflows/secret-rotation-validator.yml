name: Secret Rotation Validator

# Triggers:
#  - push / pull_request: validate rotation status as part of CI.
#  - schedule: a weekly proactive sweep that surfaces expiring secrets.
#  - workflow_dispatch: run on demand with a custom config / window / format.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'  # Mondays at 09:00 UTC
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Path to the secrets config JSON file'
        required: false
        default: 'fixtures/secrets.json'
      warning_days:
        description: 'Days before expiry to warn (overrides the config value)'
        required: false
        default: ''
      format:
        description: 'Output format'
        required: false
        default: 'markdown'
        type: choice
        options:
          - markdown
          - json
          - summary

# Least privilege: the validator only reads the checked-out repository.
permissions:
  contents: read

# Defaults shared by both jobs. workflow_dispatch inputs override them; on other
# events github.event.inputs.* is null, so we fall back to the config file.
env:
  CONFIG_FILE: ${{ github.event.inputs.config_file || 'fixtures/secrets.json' }}
  WARNING_DAYS: ${{ github.event.inputs.warning_days || '' }}
  REPORT_FORMAT: ${{ github.event.inputs.format || '' }}

jobs:
  # Job 1: run the script's unit-test suite inside the pipeline. Every unit test
  # case therefore executes "through" the workflow.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Python version
        run: python3 --version

      - name: Install test dependencies
        # --break-system-packages: the runner's Python is PEP-668 externally
        # managed; pytest is the only dependency (the script itself is stdlib).
        run: python3 -m pip install --quiet --break-system-packages pytest

      - name: Run unit tests
        run: python3 -m pytest tests/unit -v

  # Job 2: generate the rotation report. Depends on the tests passing.
  rotation-report:
    name: Rotation report
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify config file exists
        run: test -f "$CONFIG_FILE"

      - name: Generate rotation report
        run: |
          set -euo pipefail
          args=(--config "$CONFIG_FILE")
          if [ -n "$WARNING_DAYS" ]; then args+=(--warning-days "$WARNING_DAYS"); fi
          if [ -n "$REPORT_FORMAT" ]; then args+=(--format "$REPORT_FORMAT"); fi
          report="$(python3 secret_rotation_validator.py "${args[@]}")"
          echo "$report"
          # Mirror the report into the GitHub Actions job summary when available.
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Emit machine-readable summary marker
        run: |
          set -euo pipefail
          args=(--config "$CONFIG_FILE" --format summary)
          if [ -n "$WARNING_DAYS" ]; then args+=(--warning-days "$WARNING_DAYS"); fi
          summary="$(python3 secret_rotation_validator.py "${args[@]}")"
          echo "ROTATION_SUMMARY $summary"

      # The artifact steps are skipped under act (which sets ACT=true) because
      # act's artifact server is not needed for local validation.
      - name: Write JSON report to disk
        if: ${{ env.ACT != 'true' }}
        run: |
          python3 secret_rotation_validator.py --config "$CONFIG_FILE" \
            --format json > rotation-report.json

      - name: Upload JSON report artifact
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rotation-report
          path: rotation-report.json
          if-no-files-found: error
