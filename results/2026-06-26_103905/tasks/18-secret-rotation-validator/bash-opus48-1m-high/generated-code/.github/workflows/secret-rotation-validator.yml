name: Secret Rotation Validator

# Trigger on code changes (to validate the script + fixtures), on a daily
# schedule (to surface newly-expired secrets), and on demand. Defaults are
# provided for every input so the workflow runs without any configuration.
on:
  push:
  pull_request:
  schedule:
    # 07:00 UTC every day.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      warning_days:
        description: 'Warning window in days'
        required: false
        default: '14'
      reference_date:
        description: 'Reference "now" date (YYYY-MM-DD); blank means today'
        required: false
        default: '2024-04-01'

# Least-privilege: the validator only needs to read the checked-out repo.
permissions:
  contents: read

# Workflow-wide defaults shared by the jobs. The reference date is pinned so
# CI output is deterministic; remove ROTATION_NOW to evaluate against "today".
env:
  CONFIG_FILE: fixtures/secrets.json
  WARNING_DAYS: ${{ github.event.inputs.warning_days || '14' }}
  ROTATION_NOW: ${{ github.event.inputs.reference_date || '2024-04-01' }}

jobs:
  validate:
    name: Validate secret rotation
    runs-on: ubuntu-latest
    outputs:
      expired: ${{ steps.report.outputs.expired }}
      warning: ${{ steps.report.outputs.warning }}
      ok: ${{ steps.report.outputs.ok }}
      total: ${{ steps.report.outputs.total }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install jq
        # jq is preinstalled on GitHub-hosted runners; install it defensively
        # so the workflow is portable to minimal containers as well.
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi
          jq --version

      - name: Make validator executable
        run: chmod +x ./secret-rotation-validator.sh

      - name: Generate Markdown rotation report
        run: |
          ./secret-rotation-validator.sh \
            --config "$CONFIG_FILE" \
            --warning-days "$WARNING_DAYS" \
            --format markdown | tee report.md

      - name: Generate JSON report and export summary
        id: report
        run: |
          ./secret-rotation-validator.sh \
            --config "$CONFIG_FILE" \
            --warning-days "$WARNING_DAYS" \
            --format json > report.json

          expired=$(jq -r '.summary.expired' report.json)
          warning=$(jq -r '.summary.warning' report.json)
          ok=$(jq -r '.summary.ok' report.json)
          total=$(jq -r '.summary.total' report.json)

          {
            echo "expired=$expired"
            echo "warning=$warning"
            echo "ok=$ok"
            echo "total=$total"
          } >> "$GITHUB_OUTPUT"

          # Machine-parseable line for the act-based test harness to assert on.
          echo "SUMMARY expired=$expired warning=$warning ok=$ok total=$total"

  summarize:
    name: Summarize rotation status
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Print summary from the validate job
        env:
          EXPIRED: ${{ needs.validate.outputs.expired }}
          WARNING: ${{ needs.validate.outputs.warning }}
          OK: ${{ needs.validate.outputs.ok }}
          TOTAL: ${{ needs.validate.outputs.total }}
        run: |
          echo "ROTATION SUMMARY (from validate job)"
          echo "  expired = $EXPIRED"
          echo "  warning = $WARNING"
          echo "  ok      = $OK"
          echo "  total   = $TOTAL"
          echo "RESULT expired=$EXPIRED warning=$WARNING ok=$OK total=$TOTAL"

          # Fail the pipeline only when secrets are actually expired so the
          # schedule trigger turns red when action is required.
          if [ "${EXPIRED:-0}" -gt 0 ]; then
            echo "::warning::$EXPIRED secret(s) require immediate rotation"
          fi
