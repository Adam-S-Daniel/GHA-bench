name: Secret Rotation Validator

# Runs the secret-rotation validator in CI:
#   - on every push / PR so config changes are checked,
#   - on a daily schedule to catch secrets that age into the warning window,
#   - manually via workflow_dispatch with overridable inputs.
on:
  push:
  pull_request:
  schedule:
    # 07:00 UTC every day — surface freshly-expiring secrets each morning.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      config_file:
        description: "Path to the secrets config JSON"
        required: false
        default: "fixtures/secrets.json"
      report_date:
        description: "Reference date (YYYY-MM-DD) used as 'today'"
        required: false
        default: "2026-06-27"
      warning_window:
        description: "Days before expiry that should raise a warning"
        required: false
        default: "14"

# Least-privilege: the validator only needs to read the checked-out repo.
permissions:
  contents: read

# Defaults make the workflow deterministic under `act` (fixed config + date)
# while still allowing workflow_dispatch inputs to override them.
env:
  CONFIG_FILE: ${{ github.event.inputs.config_file || 'fixtures/secrets.json' }}
  REPORT_DATE: ${{ github.event.inputs.report_date || '2026-06-27' }}
  WARNING_WINDOW: ${{ github.event.inputs.warning_window || '14' }}

jobs:
  validate:
    name: Validate secret rotation
    runs-on: ubuntu-latest
    outputs:
      expired: ${{ steps.report.outputs.expired }}
      warning: ${{ steps.report.outputs.warning }}
      ok: ${{ steps.report.outputs.ok }}
      total: ${{ steps.report.outputs.total }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run unit tests
        run: bun test tests/validator.test.ts tests/report.test.ts tests/cli.test.ts

      - name: Generate rotation report (markdown -> job summary)
        run: |
          bun run validate.ts \
            --config "$CONFIG_FILE" \
            --now "$REPORT_DATE" \
            --warning-window "$WARNING_WINDOW" \
            --format markdown \
            --output report.md
          {
            echo "## Secret Rotation Report"
            cat report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate rotation report (JSON) and export counts
        id: report
        run: |
          bun run validate.ts \
            --config "$CONFIG_FILE" \
            --now "$REPORT_DATE" \
            --warning-window "$WARNING_WINDOW" \
            --format json \
            --output report.json
          # Emit a single stable marker line for downstream tooling/tests.
          bun -e 'const s=(await Bun.file("report.json").json()).summary; console.log("ROTATION_SUMMARY expired="+s.expired+" warning="+s.warning+" ok="+s.ok+" total="+s.total)'
          # Export per-urgency counts as step outputs for the notify job.
          bun -e 'const s=(await Bun.file("report.json").json()).summary; const fs=await import("fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "expired="+s.expired+"\nwarning="+s.warning+"\nok="+s.ok+"\ntotal="+s.total+"\n")'

      - name: Upload report artifacts
        # Skipped under `act` (no artifact server); runs on GitHub-hosted runners.
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: rotation-report
          path: |
            report.md
            report.json
          if-no-files-found: error

  notify:
    name: Emit grouped notifications
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Print notifications grouped by urgency
        env:
          EXPIRED: ${{ needs.validate.outputs.expired || '0' }}
          WARNING: ${{ needs.validate.outputs.warning || '0' }}
          OK: ${{ needs.validate.outputs.ok || '0' }}
          TOTAL: ${{ needs.validate.outputs.total || '0' }}
        run: |
          echo "NOTIFY expired=$EXPIRED warning=$WARNING ok=$OK total=$TOTAL"
          if [ "$EXPIRED" -gt 0 ]; then
            echo "::error::$EXPIRED secret(s) are EXPIRED and must be rotated immediately"
          fi
          if [ "$WARNING" -gt 0 ]; then
            echo "::warning::$WARNING secret(s) are expiring within the warning window"
          fi
          echo "$OK secret(s) are OK"
