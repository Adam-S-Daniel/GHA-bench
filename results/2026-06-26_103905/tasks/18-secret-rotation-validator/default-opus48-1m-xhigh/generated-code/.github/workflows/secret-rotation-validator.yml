name: Secret Rotation Validator

# Triggers:
#  * push / pull_request -> validate on every change
#  * schedule           -> weekly proactive check (secrets expire over time)
#  * workflow_dispatch   -> manual run with a tunable warning window
on:
  push:
  pull_request:
  schedule:
    - cron: "0 8 * * 1"  # every Monday 08:00 UTC
  workflow_dispatch:
    inputs:
      warning_days:
        description: "Warning window in days"
        required: false
        default: "14"
        type: string

# Least-privilege: the validator only reads repository contents.
permissions:
  contents: read

# Constant configuration shared by all jobs. WARNING_DAYS / REFERENCE_DATE are
# intentionally NOT declared here so they can be supplied at runtime (act --env,
# or the workflow_dispatch input) without being shadowed by a workflow-level env.
env:
  PYTHONUNBUFFERED: "1"
  CONFIG_FILE: "fixtures/secrets.json"
  REPORT_MARKER: "__ROTATION_REPORT_JSON__"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Python version
        run: python3 --version

      - name: Run unit tests (stdlib unittest, no install needed)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  report:
    name: Rotation report
    needs: test          # job dependency: only report once the tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve runtime parameters
        run: |
          # Precedence: runtime env (act --env / CI) > workflow_dispatch input > default.
          DAYS="${WARNING_DAYS:-${{ github.event.inputs.warning_days || '14' }}}"
          REF="${REFERENCE_DATE:-}"
          echo "RESOLVED_WARNING_DAYS=$DAYS" >> "$GITHUB_ENV"
          echo "RESOLVED_REFERENCE_DATE=$REF" >> "$GITHUB_ENV"
          echo "Resolved warning window: $DAYS day(s); reference date: ${REF:-today}"

      - name: Generate markdown report
        run: |
          NOW_ARG=()
          if [ -n "$RESOLVED_REFERENCE_DATE" ]; then
            NOW_ARG=(--now "$RESOLVED_REFERENCE_DATE")
          fi
          python3 secret_rotation_validator.py \
            --config "$CONFIG_FILE" \
            --warning-days "$RESOLVED_WARNING_DAYS" \
            "${NOW_ARG[@]}" \
            --format markdown | tee report.md

      - name: Generate JSON report and emit machine-readable marker
        run: |
          NOW_ARG=()
          if [ -n "$RESOLVED_REFERENCE_DATE" ]; then
            NOW_ARG=(--now "$RESOLVED_REFERENCE_DATE")
          fi
          python3 secret_rotation_validator.py \
            --config "$CONFIG_FILE" \
            --warning-days "$RESOLVED_WARNING_DAYS" \
            "${NOW_ARG[@]}" \
            --format json --compact > report.json
          # Single-line marker that survives act's log prefixing, for assertions.
          echo "${REPORT_MARKER}$(cat report.json)"

      - name: Print urgency summary
        run: |
          python3 -c 'import json; s=json.load(open("report.json"))["summary"]; print("SUMMARY expired=%d warning=%d ok=%d total=%d" % (s["expired"], s["warning"], s["ok"], s["total"]))'
