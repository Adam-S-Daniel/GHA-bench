name: Secret Rotation Validator

# Trigger on pushes and PRs (to catch config changes), on a daily schedule
# (so expiring secrets are surfaced proactively), and manually on demand.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 07:00 UTC every day.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      warning_days:
        description: 'Warning window in days'
        required: false
        default: '14'
      output_format:
        description: 'Output format (markdown or json)'
        required: false
        default: 'markdown'

# Least-privilege: the validator only reads the repo.
permissions:
  contents: read

# Environment variables drive the validator. The act test harness overrides
# these (via the workflow file it writes / the env block) to exercise each
# test case deterministically. Sensible defaults keep the workflow runnable
# with no external services or secrets.
env:
  CONFIG_PATH: fixtures/secrets.json
  WARNING_DAYS: '14'
  OUTPUT_FORMAT: markdown
  # Fixed reference date so scheduled/CI runs are deterministic against the
  # committed fixtures. Override in real deployments to use the current date.
  REFERENCE_DATE: '2026-06-26'

jobs:
  validate:
    name: Validate secret rotation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Pester is available
        shell: pwsh
        run: |
          $module = Get-Module -ListAvailable Pester |
            Sort-Object Version -Descending | Select-Object -First 1
          if (-not $module) {
            Write-Error 'Pester is not installed in this environment.'
            exit 1
          }
          Write-Host "Using Pester $($module.Version)"

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './SecretRotation.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Generate rotation report
        id: report
        shell: pwsh
        run: |
          Write-Host "::group::Rotation report ($env:OUTPUT_FORMAT)"
          # Run the validator. It exits 2 (expired) / 1 (warning) / 0 (ok);
          # capture that separately so the step can still surface the report
          # without failing the whole job purely because secrets need rotating.
          #
          # Invoke it as a CHILD pwsh process (not the call operator `&`): the
          # validator ends with `exit <code>`, and an in-process `&` invocation
          # would propagate that exit and terminate this step. A child process
          # isolates the exit code into $LASTEXITCODE instead.
          $output = pwsh -NoProfile -File ./Invoke-RotationValidator.ps1 `
            -ConfigPath $env:CONFIG_PATH `
            -WarningDays ([int]$env:WARNING_DAYS) `
            -Format $env:OUTPUT_FORMAT `
            -ReferenceDate $env:REFERENCE_DATE
          $code = $LASTEXITCODE
          $output | Write-Host
          Write-Host "::endgroup::"
          Write-Host "ROTATION_EXIT_CODE=$code"

          # Surface the report in the job summary when running on real GitHub.
          if ($env:GITHUB_STEP_SUMMARY -and (Test-Path $env:GITHUB_STEP_SUMMARY)) {
            $output | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

          if ($code -eq 3) {
            Write-Error 'Validator encountered an error.'
            exit 1
          }
          Write-Host 'Secret rotation report generated successfully.'
          # The child pwsh left its rotation exit code (2/1/0) in $LASTEXITCODE.
          # Those are informational urgency signals, not step failures, so reset
          # and exit cleanly - otherwise the pwsh shell wrapper would propagate
          # the non-zero code and fail the job.
          exit 0
