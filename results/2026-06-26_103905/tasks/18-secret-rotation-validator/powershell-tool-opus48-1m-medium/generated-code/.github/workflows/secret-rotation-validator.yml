name: Secret Rotation Validator

# Trigger on code changes, PRs, a daily schedule (to catch newly-expired
# secrets), and manual dispatch with tunable inputs.
on:
  push:
  pull_request:
  schedule:
    # Run every day at 06:00 UTC to surface secrets that expired overnight.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      reference_date:
        description: 'Evaluation date (yyyy-MM-dd). Defaults to today.'
        required: false
        default: ''
      warning_window_days:
        description: 'Days before due date to flag as a warning.'
        required: false
        default: '14'
      output_format:
        description: 'Report format: markdown or json.'
        required: false
        default: 'markdown'

# Least-privilege: the validator only reads repository contents.
permissions:
  contents: read

env:
  CONFIG_PATH: fixtures/secrets.json

jobs:
  unit-tests:
    name: Pester unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/SecretRotationValidator.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  validate-rotation:
    name: Validate secret rotation
    runs-on: ubuntu-latest
    # Only validate once the unit tests have confirmed the module is healthy.
    needs: unit-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate rotation report
        shell: pwsh
        env:
          # workflow_dispatch inputs are surfaced under INPUT_* so they do not
          # shadow the REFERENCE_DATE/WARNING_WINDOW_DAYS/OUTPUT_FORMAT container
          # env vars that the local `act` test harness injects via --env.
          INPUT_REFERENCE_DATE: ${{ github.event.inputs.reference_date }}
          INPUT_WARNING_WINDOW_DAYS: ${{ github.event.inputs.warning_window_days }}
          INPUT_OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Precedence for each setting: dispatch input -> injected env -> default.
          $refDate = if ($env:INPUT_REFERENCE_DATE) { $env:INPUT_REFERENCE_DATE }
                     elseif ($env:REFERENCE_DATE) { $env:REFERENCE_DATE }
                     else { (Get-Date -Format 'yyyy-MM-dd') }
          $window  = if ($env:INPUT_WARNING_WINDOW_DAYS) { [int]$env:INPUT_WARNING_WINDOW_DAYS }
                     elseif ($env:WARNING_WINDOW_DAYS) { [int]$env:WARNING_WINDOW_DAYS }
                     else { 14 }
          $format  = if ($env:INPUT_OUTPUT_FORMAT) { $env:INPUT_OUTPUT_FORMAT }
                     elseif ($env:OUTPUT_FORMAT) { $env:OUTPUT_FORMAT }
                     else { 'markdown' }
          $config  = $env:CONFIG_PATH

          Write-Host "Validating '$config' as of $refDate (window=$window days, format=$format)"

          ./Invoke-SecretRotationValidator.ps1 `
            -ConfigPath $config `
            -ReferenceDate $refDate `
            -WarningWindowDays $window `
            -Format $format
