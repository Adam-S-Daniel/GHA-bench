name: Secret Rotation Validator

# Triggers:
#   * push / pull_request  -> validate rotation status on every change
#   * schedule             -> daily drift check (secrets expire over calendar time)
#   * workflow_dispatch     -> on-demand manual runs
on:
  push:
  pull_request:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      warning_days:
        description: 'Warning window in days'
        required: false
        default: '7'

# Least-privilege: the validator only reads the repository contents.
permissions:
  contents: read

# Shared configuration. REFERENCE_DATE is pinned so report output is
# deterministic in CI (and assertable by the act test harness). In a real
# deployment you would drop REFERENCE_DATE so the script uses the current date.
env:
  CONFIG_PATH: secrets.json
  WARNING_DAYS: '7'
  REFERENCE_DATE: '2026-06-26'

jobs:
  # Job 1: red/green unit tests must pass before we trust the validator's output.
  test:
    name: Unit tests (Pester)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./SecretRotationValidator.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) unit test(s) failed."
          }
          Write-Host "All $($result.PassedCount) unit tests passed."

  # Job 2: generate the rotation report. Depends on the unit tests passing.
  report:
    name: Generate rotation report
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate secrets configuration exists
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:CONFIG_PATH)) {
            throw "Config file '$env:CONFIG_PATH' not found in repository."
          }
          Write-Host "Using config: $env:CONFIG_PATH"

      - name: Generate rotation report (Markdown)
        shell: pwsh
        run: |
          ./SecretRotationValidator.ps1 `
            -ConfigPath $env:CONFIG_PATH `
            -WarningDays ([int]$env:WARNING_DAYS) `
            -ReferenceDate $env:REFERENCE_DATE `
            -Format Markdown

      - name: Generate rotation report (JSON)
        shell: pwsh
        run: |
          $json = ./SecretRotationValidator.ps1 `
            -ConfigPath $env:CONFIG_PATH `
            -WarningDays ([int]$env:WARNING_DAYS) `
            -ReferenceDate $env:REFERENCE_DATE `
            -Format Json
          # Emit a single deterministic summary line the harness can assert on.
          $report = $json | ConvertFrom-Json
          Write-Host "ROTATION_SUMMARY expired=$($report.Summary.Expired) warning=$($report.Summary.Warning) ok=$($report.Summary.Ok) total=$($report.Summary.Total)"
