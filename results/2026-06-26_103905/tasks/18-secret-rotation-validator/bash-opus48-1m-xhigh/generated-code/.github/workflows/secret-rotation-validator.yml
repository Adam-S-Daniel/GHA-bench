name: Secret Rotation Validator

# Trigger on code changes, PRs, a weekly scheduled audit, and on demand.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly rotation audit: Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      warning_days:
        description: 'Warning window in days for the rotation report'
        required: false
        default: '14'

# Principle of least privilege: the pipeline only needs to read the repo.
permissions:
  contents: read

env:
  # Pin "today" so the report (and its assertions) are deterministic in CI.
  # In a real deployment you would remove this and let the script use the
  # live UTC date.
  SRV_NOW: '2026-06-28'
  # Path to the secrets configuration the audit runs against.
  CONFIG_FILE: 'fixtures/ci-secrets.json'

jobs:
  # 1) Static analysis gate: syntax + shellcheck. Nothing else runs until the
  #    script is known to be syntactically sound and lint-clean.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq shellcheck

      - name: Bash syntax check (bash -n)
        run: bash -n secret-rotation-validator.sh

      - name: ShellCheck lint
        run: shellcheck secret-rotation-validator.sh

  # 2) Run the bats unit test suite. Depends on a clean lint.
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bats

      - name: Verify dependencies are present
        run: |
          bats --version
          jq --version

      - name: Run unit tests (bats)
        # --tap gives stable, machine-parseable output ("1..N", "ok i ...").
        run: bats --tap test/unit/

  # 3) Generate the rotation report from the configured secrets file. Depends
  #    on green tests. Produces both markdown (job summary) and JSON output.
  report:
    needs: test
    runs-on: ubuntu-latest
    env:
      # workflow_dispatch may override the window; default to 14 otherwise.
      WARNING_DAYS: ${{ inputs.warning_days || '14' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate markdown rotation report
        run: |
          echo "Auditing '$CONFIG_FILE' with a ${WARNING_DAYS}-day warning window (as of $SRV_NOW)"
          bash secret-rotation-validator.sh \
            --config "$CONFIG_FILE" \
            --warning-days "$WARNING_DAYS" \
            --format markdown | tee report.md
          {
            echo '## Rotation report (markdown)';
            cat report.md;
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate JSON rotation report and surface key metrics
        run: |
          bash secret-rotation-validator.sh \
            --config "$CONFIG_FILE" \
            --warning-days "$WARNING_DAYS" \
            --format json | tee report.json
          echo "REPORT_EXPIRED=$(jq -r '.summary.expired' report.json)"
          echo "REPORT_WARNING=$(jq -r '.summary.warning' report.json)"
          echo "REPORT_OK=$(jq -r '.summary.ok' report.json)"
