name: Secret Rotation Validator

# Trigger on code changes (so the validator's own tests gate merges), on a
# weekly schedule (an unattended rotation audit), and on demand via the Actions
# UI with overridable inputs.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 08:00 UTC every Monday — weekly secret-rotation audit.
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      config_path:
        description: 'Path to the secrets configuration JSON.'
        required: false
        default: 'fixtures/config.json'
      warning_window_days:
        description: 'Days before expiry to flag as warning (overrides the config file).'
        required: false
        default: ''
      format:
        description: 'Rendered report format: markdown or json.'
        required: false
        default: 'markdown'

# Least privilege: the validator only reads repository contents.
permissions:
  contents: read

# Workflow-level environment. Inputs (when present, i.e. workflow_dispatch)
# take precedence; otherwise sensible defaults keep push/PR/schedule runs green
# with no external configuration.
env:
  CONFIG_PATH: ${{ github.event.inputs.config_path || 'fixtures/config.json' }}
  REPORT_FORMAT: ${{ github.event.inputs.format || 'markdown' }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — prove the validator itself is correct via its Pester unit suite.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Pester unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure Pester 5 is available
        shell: pwsh
        run: |
          # The act container ships Pester 5; on a vanilla runner, install it.
          $have = Get-Module -ListAvailable Pester |
            Where-Object { $_.Version -ge [version]'5.0.0' }
          if (-not $have) {
            Write-Host 'Pester 5 not found — installing from PSGallery...'
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          $v = (Get-Module -ListAvailable Pester |
            Sort-Object Version -Descending | Select-Object -First 1).Version
          Write-Host "Using Pester $v"

      - name: Run unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Run ONLY the unit suite (the act acceptance suite must never run
          # inside the container — that would be act-in-act recursion).
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './SecretRotationValidator.Tests.ps1'
          $cfg.Run.Exit = $true            # non-zero exit -> fail the job
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

  # ---------------------------------------------------------------------------
  # Job 2 — run the validator against the configured inventory and publish a
  # rotation report. Depends on the unit tests passing first.
  # ---------------------------------------------------------------------------
  rotation-report:
    name: Generate rotation report
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate secrets and emit rotation report
        shell: pwsh
        env:
          # Empty unless supplied via workflow_dispatch; the script then falls
          # back to the per-config warning window.
          WARNING_WINDOW_DAYS: ${{ github.event.inputs.warning_window_days || '' }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Dot-source to load the functions without triggering the CLI guard.
          . ./SecretRotationValidator.ps1

          $invokeArgs = @{
            ConfigPath    = $env:CONFIG_PATH
            Format        = $env:REPORT_FORMAT
            FailOnExpired = $true            # evaluate the guardrail (non-fatal here)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WARNING_WINDOW_DAYS)) {
            $invokeArgs.WarningWindowDays = [int]$env:WARNING_WINDOW_DAYS
          }

          $result = Invoke-SecretRotationValidator @invokeArgs

          # --- Rendered report (configured format) --------------------------
          Write-Host '----- RENDERED REPORT -----'
          Write-Host $result.Output
          Write-Host '----- END REPORT -----'

          # --- JSON view (always, to demonstrate the second format) ---------
          Write-Host '----- JSON REPORT -----'
          Write-Host (Format-RotationReport -Report $result.Report -Format json)
          Write-Host '----- END JSON -----'

          # --- Machine-readable markers for downstream assertions -----------
          # Emitted by a unit-tested, StrictMode-safe helper.
          Write-Host (Get-RotationSummaryMarkers -Report $result.Report)
          # The guardrail exit code is reported but intentionally NOT propagated,
          # so the audit job stays green while still surfacing the verdict.
          Write-Host "POLICY_EXIT_CODE=$($result.ExitCode)"

          # --- Human-readable report -> GitHub job summary ------------------
          # Cosmetic only; never let it fail the job (the summary file may be
          # absent or read-only under some runners/act configurations).
          try {
            if ($env:GITHUB_STEP_SUMMARY) {
              $md = Format-RotationReport -Report $result.Report -Format markdown
              $md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
          }
          catch {
            Write-Host "Job summary skipped: $($_.Exception.Message)"
          }
