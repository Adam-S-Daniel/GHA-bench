name: Secret Rotation Validator

# Triggers:
#   push / pull_request : validate secret rotation on every change
#   schedule            : daily drift check so secrets don't silently expire
#   workflow_dispatch   : allow on-demand manual runs (with overridable inputs)
on:
  push:
  pull_request:
  schedule:
    # 07:00 UTC every day.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      warning_days:
        description: 'Warning window in days'
        required: false
        default: '14'
      output_format:
        description: 'Report format (markdown or json)'
        required: false
        default: 'markdown'

# Least privilege: the validator only needs to read the checked-out repo.
permissions:
  contents: read

# Pin the reference date so fixture-driven output is deterministic in CI/act.
# warning_days/output_format honour workflow_dispatch inputs, falling back to
# sensible defaults for push/pull_request/schedule runs.
env:
  REFERENCE_DATE: '2026-06-27'
  WARNING_DAYS: ${{ github.event.inputs.warning_days || '14' }}
  OUTPUT_FORMAT: ${{ github.event.inputs.output_format || 'markdown' }}
  SECRETS_CONFIG: fixtures/secrets.json

jobs:
  # Job 1: run the Pester unit-test suite (red/green TDD tests).
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure Pester is available
        shell: pwsh
        run: |
          # Pester is pre-installed in the act container; install on the fly
          # if running somewhere it is not, so the job is self-contained.
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0.0
          }
          Get-Module -ListAvailable -Name Pester | Select-Object -First 1 Name, Version

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './SecretRotationValidator.Tests.ps1'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

  # Job 2: run the validator against the fixture and publish the report.
  # Depends on unit-tests so we only report when the logic is verified green.
  validate:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show effective configuration
        shell: pwsh
        run: |
          Write-Host "Reference date : $env:REFERENCE_DATE"
          Write-Host "Warning days   : $env:WARNING_DAYS"
          Write-Host "Output format  : $env:OUTPUT_FORMAT"
          Write-Host "Secrets config : $env:SECRETS_CONFIG"

      - name: Generate rotation report (markdown)
        shell: pwsh
        run: |
          # Markdown report for human consumption + step summary.
          $report = ./Invoke-Validator.ps1 `
            -ConfigPath $env:SECRETS_CONFIG `
            -ReferenceDate $env:REFERENCE_DATE `
            -WarningDays ([int]$env:WARNING_DAYS) `
            -Format markdown
          $report | ForEach-Object { Write-Host $_ }
          # Also publish to the GitHub step summary when available.
          if ($env:GITHUB_STEP_SUMMARY) {
            $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Generate rotation report (json)
        shell: pwsh
        run: |
          # JSON report for machine consumption / downstream tooling.
          $json = ./Invoke-Validator.ps1 `
            -ConfigPath $env:SECRETS_CONFIG `
            -ReferenceDate $env:REFERENCE_DATE `
            -WarningDays ([int]$env:WARNING_DAYS) `
            -Format json
          $json | ForEach-Object { Write-Host $_ }

      - name: Evaluate rotation gate (report-only)
        shell: pwsh
        run: |
          # Exercise the -FailOnExpired code path and surface a single, stable
          # status line the harness asserts on. This step is report-only: it
          # does NOT fail the job, so the pipeline always completes and the
          # gate outcome is observable per fixture (PASSED vs FAILED).
          ./Invoke-Validator.ps1 `
            -ConfigPath $env:SECRETS_CONFIG `
            -ReferenceDate $env:REFERENCE_DATE `
            -WarningDays ([int]$env:WARNING_DAYS) `
            -Format markdown `
            -FailOnExpired | Out-Null
          $code = $LASTEXITCODE
          # Note: Write-Host does not reset $LASTEXITCODE, so we must exit
          # explicitly — otherwise the validator's exit 2 leaks through the
          # pwsh step wrapper and fails this report-only step.
          switch ($code) {
            2       { Write-Host "ROTATION_GATE=FAILED"; exit 0 }
            0       { Write-Host "ROTATION_GATE=PASSED"; exit 0 }
            default { Write-Host "ROTATION_GATE=ERROR"; exit $code }
          }
