name: Secret Rotation Validator

# Trigger on code changes (so the validator is exercised in CI), on demand via
# the Actions tab, and on a weekly schedule so a rotating fleet of secrets is
# checked even when nobody pushes.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      warning_days:
        description: "Days before expiry to start warning"
        required: false
        default: "14"
  schedule:
    # Every Monday at 08:00 UTC.
    - cron: "0 8 * * 1"

# Least privilege: the validator only needs to read the checked-out repo.
permissions:
  contents: read

# Defaults consumed by the run steps. NOW_DATE is intentionally NOT declared
# here: a workflow-level `env:` value would override anything injected via
# `act --env`, and the test harness must pin the reference date for
# determinism. It is therefore supplied purely through the process environment
# (with an empty -> "today" shell default below).
env:
  CONFIG_FILE: fixtures/default.json
  WARNING_DAYS: "14"

jobs:
  validate:
    name: Validate secret rotation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Python is available
        run: |
          set -euo pipefail
          python3 --version

      - name: Run secret rotation validator
        id: validate
        run: |
          set -euo pipefail
          config="${CONFIG_FILE:-fixtures/default.json}"
          warning="${WARNING_DAYS:-14}"
          now="${NOW_DATE:-}"

          if [ ! -f "$config" ]; then
            echo "Error: config file '$config' not found" >&2
            exit 1
          fi

          # Build the optional --now flag only when a date is provided.
          now_args=()
          if [ -n "$now" ]; then
            now_args=(--now "$now")
          fi

          echo "::group::Markdown report"
          python3 secret_rotation_validator.py \
            --config "$config" --warning-days "$warning" "${now_args[@]}" \
            --format markdown | tee report.md
          echo "::endgroup::"

          # Append the markdown report to the GitHub Actions job summary.
          cat report.md >> "$GITHUB_STEP_SUMMARY"

          # Save a JSON report as a build artifact-friendly file.
          python3 secret_rotation_validator.py \
            --config "$config" --warning-days "$warning" "${now_args[@]}" \
            --format json > report.json

          # Emit the compact, grep-able summary line (asserted on by the harness).
          summary=$(python3 secret_rotation_validator.py \
            --config "$config" --warning-days "$warning" "${now_args[@]}" \
            --format summary)
          echo "$summary"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Report status
        run: |
          set -euo pipefail
          echo "Validator finished: ${{ steps.validate.outputs.summary }}"
