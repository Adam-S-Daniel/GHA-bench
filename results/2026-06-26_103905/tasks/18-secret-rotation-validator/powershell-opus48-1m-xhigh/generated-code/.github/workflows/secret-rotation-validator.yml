# Secret Rotation Validator
#
# Runs the PowerShell validator against each committed secrets fixture, in an
# isolated Docker container, and produces a rotation report grouped by urgency.
#
# - validate: matrix job, one leg per fixture. Renders the markdown report AND a
#   JSON report (demonstrating both output formats), writes the human report to
#   the job summary, and prints a stable `RESULT ...` line per fixture.
# - report:   depends on validate; emits a final aggregate note once every
#   fixture has been validated.
#
# Determinism: each fixture embeds its own "asOf" date, so results never depend
# on the wall clock and are reproducible in CI / act.
name: Secret Rotation Validator

on:
  push:
  pull_request:
  # Periodic audit so rotation drift is caught even without code changes.
  schedule:
    - cron: '0 8 * * 1'  # every Monday 08:00 UTC
  workflow_dispatch:
    inputs:
      warning_window:
        description: 'Override warning window in days (empty = use each config value)'
        required: false
        default: ''
      format:
        description: 'Output format for the per-fixture report'
        required: false
        default: 'markdown'
        type: choice
        options:
          - markdown
          - json

# Least-privilege: the workflow only needs to read the checked-out repo.
permissions:
  contents: read

# Workflow-level environment: single source of truth for the script path.
env:
  VALIDATOR_SCRIPT: ./Invoke-SecretRotationValidator.ps1

jobs:
  validate:
    name: Validate (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - healthy
          - mixed
          - all-expired
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PowerShell is pre-installed on GitHub-hosted runners and in the act
      # container, so this is a near-instant verification (no-op install).
      - name: Ensure PowerShell is available
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "PowerShell not found; installing..."
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
          pwsh --version

      - name: Validate secret rotation (markdown report)
        shell: pwsh
        env:
          FIXTURE: ${{ matrix.fixture }}
          WARNING_WINDOW: ${{ github.event.inputs.warning_window }}
        run: |
          $configPath = "fixtures/$($env:FIXTURE).json"
          if (-not (Test-Path $configPath)) {
              throw "Fixture not found: $configPath"
          }

          # Build CLI arguments; only override the warning window when supplied
          # (workflow_dispatch only). Otherwise each config's value is used.
          $cliArgs = @{ ConfigPath = $configPath; Format = 'markdown' }
          if (-not [string]::IsNullOrWhiteSpace($env:WARNING_WINDOW)) {
              $cliArgs.WarningWindowDays = [int]$env:WARNING_WINDOW
          }

          # Capture output so we can both echo it (for CI logs) and append it to
          # the GitHub job summary. The script returns naturally on success.
          $output = & $env:VALIDATOR_SCRIPT @cliArgs
          $output | ForEach-Object { Write-Host $_ }

          if ($env:GITHUB_STEP_SUMMARY) {
              "## Rotation report: $($env:FIXTURE)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              ""                                    | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              $output | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Emit JSON report (machine-readable format)
        shell: pwsh
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          $configPath = "fixtures/$($env:FIXTURE).json"
          $json = & $env:VALIDATOR_SCRIPT -ConfigPath $configPath -Format json |
              Where-Object { $_ -notmatch '^RESULT ' }

          # Prove the JSON is well-formed and machine-consumable.
          $parsed = ($json -join "`n") | ConvertFrom-Json
          Write-Host ("JSON OK for {0}: expired={1} warning={2} ok={3} total={4}" -f `
              $env:FIXTURE, $parsed.summary.expired, $parsed.summary.warning, `
              $parsed.summary.ok, $parsed.summary.total)

  report:
    name: Aggregate report
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Summarize
        shell: pwsh
        run: |
          $msg = "All secret-rotation fixtures validated successfully."
          Write-Host $msg
          if ($env:GITHUB_STEP_SUMMARY) {
              "## Secret Rotation Validator" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              $msg                           | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
