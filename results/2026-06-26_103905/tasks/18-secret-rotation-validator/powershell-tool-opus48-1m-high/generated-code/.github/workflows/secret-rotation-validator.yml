name: Secret Rotation Validator

# Trigger on code changes, on a weekly schedule (so rotation drift is caught even
# without commits), and on manual dispatch with tunable inputs.
on:
  push:
  pull_request:
  schedule:
    # 07:00 UTC every Monday - a routine rotation health check.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      warning_days:
        description: 'Warning window in days (secrets expiring within this many days are flagged)'
        required: false
        default: '14'
      report_format:
        description: 'Report output format'
        required: false
        default: 'markdown'
        type: choice
        options:
          - markdown
          - json

# Least-privilege: the validator only needs to read the checked-out repo.
permissions:
  contents: read

# Workflow-wide defaults. workflow_dispatch inputs override WARNING_DAYS / REPORT_FORMAT
# at the step level via `inputs.* || env.*`.
env:
  CONFIG_PATH: fixtures/secrets.json
  WARNING_DAYS: '14'
  REPORT_FORMAT: markdown

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: prove the validator library is correct via its Pester unit suite.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests (Pester)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          # pwsh and Pester are pre-installed in the container.
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/SecretRotationValidator.Tests.ps1'
          $config.Run.Exit = $true          # non-zero exit on any failure -> fails the job
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  # ---------------------------------------------------------------------------
  # Stage 2: run the validator against the fixture and publish a rotation report.
  # Depends on unit-tests so a broken library never produces a "valid" report.
  # ---------------------------------------------------------------------------
  rotation-report:
    name: Generate rotation report
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render markdown report
        shell: pwsh
        env:
          # Resolve dispatch inputs, falling back to workflow env defaults.
          EFFECTIVE_WARNING_DAYS: ${{ github.event.inputs.warning_days || env.WARNING_DAYS }}
          EFFECTIVE_FORMAT: ${{ github.event.inputs.report_format || env.REPORT_FORMAT }}
        run: |
          Write-Host "Validating '$env:CONFIG_PATH' with a $env:EFFECTIVE_WARNING_DAYS-day warning window."
          ./Invoke-SecretRotationValidator.ps1 `
            -ConfigPath $env:CONFIG_PATH `
            -WarningDays ([int]$env:EFFECTIVE_WARNING_DAYS) `
            -Format $env:EFFECTIVE_FORMAT

      - name: Emit machine-readable summary
        shell: pwsh
        env:
          EFFECTIVE_WARNING_DAYS: ${{ github.event.inputs.warning_days || env.WARNING_DAYS }}
        run: |
          # Produce a stable JSON report and distil it into grep-friendly marker
          # lines that CI / downstream tooling can assert on exactly.
          $json = ./Invoke-SecretRotationValidator.ps1 `
            -ConfigPath $env:CONFIG_PATH `
            -WarningDays ([int]$env:EFFECTIVE_WARNING_DAYS) `
            -Format json
          $report = $json | ConvertFrom-Json

          $c = $report.counts
          Write-Host "ROTATION_SUMMARY expired=$($c.expired) warning=$($c.warning) ok=$($c.ok) total=$($c.total)"

          $expiredNames = @($report.groups.expired | ForEach-Object { $_.name }) -join ','
          $warningNames = @($report.groups.warning | ForEach-Object { $_.name }) -join ','
          Write-Host "EXPIRED_NAMES=$expiredNames"
          Write-Host "WARNING_NAMES=$warningNames"

          # Mirror the report into the GitHub Step Summary for human reviewers.
          if ($env:GITHUB_STEP_SUMMARY) {
            ./Invoke-SecretRotationValidator.ps1 -ConfigPath $env:CONFIG_PATH `
              -WarningDays ([int]$env:EFFECTIVE_WARNING_DAYS) -Format markdown |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
