name: Secret Rotation Validator

# Trigger on code changes, on PRs, on a weekly schedule (so rotation drift is
# caught even without a push), and on manual dispatch with an optional override.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Every Monday at 06:00 UTC — a weekly rotation health check.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      warning_days:
        description: 'Override the warning window, in days (blank = use config value)'
        required: false
        default: ''

# Least-privilege: the validator only reads repository contents.
permissions:
  contents: read

# Workflow-wide defaults. The config path is centralised here so every job and
# the test harness can point at the same file.
env:
  SECRETS_CONFIG_PATH: secrets.json

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: run the Pester unit tests for the validator logic. Acts as a quality
  # gate — the report job only runs if the logic is verified.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PowerShell
        shell: bash
        run: |
          # pwsh is pre-installed on GitHub-hosted runners and the benchmark act
          # container, so this is normally a no-op. Install only as a fallback.
          if command -v pwsh >/dev/null 2>&1; then
            echo "PowerShell already available: $(pwsh --version)"
          else
            echo "PowerShell not found; installing as a portability fallback..."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends powershell
          fi

      - name: Ensure Pester is available
        shell: pwsh
        run: |
          # Pester 5 is pre-installed in the target environments; install only if
          # missing so this step never needs the network on the benchmark runner.
          $pester = Get-Module -ListAvailable -Name Pester |
            Where-Object { $_.Version -ge [version]'5.0.0' }
          if (-not $pester) {
            Write-Output 'Pester 5 not found; installing from the PowerShell Gallery...'
            Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          $version = (Get-Module -ListAvailable -Name Pester |
            Sort-Object Version -Descending | Select-Object -First 1).Version
          Write-Output "Using Pester $version"

      - name: Run unit tests
        shell: pwsh
        run: |
          # Run only the pure-logic suite here (the workflow/act suites need tools
          # that aren't present inside the container).
          $result = Invoke-Pester -Path ./tests/SecretRotationValidator.Tests.ps1 `
            -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) unit test(s) failed."
          }
          Write-Output "All $($result.PassedCount) unit tests passed."

  # ---------------------------------------------------------------------------
  # Job 2: generate the rotation report from the configured secrets file. Depends
  # on the test job so reports are only produced from verified logic.
  # ---------------------------------------------------------------------------
  report:
    name: Rotation report
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Empty on push/PR/schedule (so each config's own warningDays is honoured);
      # set only when a human supplies it via workflow_dispatch.
      WARNING_DAYS_OVERRIDE: ${{ github.event.inputs.warning_days }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PowerShell
        shell: bash
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            echo "PowerShell already available: $(pwsh --version)"
          else
            echo "PowerShell not found; installing as a portability fallback..."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends powershell
          fi

      - name: Show configuration under validation
        shell: bash
        run: |
          echo "Validating secrets config: ${SECRETS_CONFIG_PATH}"
          cat "${SECRETS_CONFIG_PATH}"

      - name: Generate rotation reports
        shell: pwsh
        run: |
          # Build a common argument set. Only pass -WarningDays when a dispatch
          # override was supplied, otherwise the config file's window is used.
          $common = @{ ConfigPath = $env:SECRETS_CONFIG_PATH }
          if (-not [string]::IsNullOrWhiteSpace($env:WARNING_DAYS_OVERRIDE)) {
            $common['WarningDays'] = [int]$env:WARNING_DAYS_OVERRIDE
          }
          $script = './secret-rotation-validator.ps1'

          # 1) Machine-readable summary (the CI assertion contract).
          Write-Output '----- ROTATION SUMMARY -----'
          & $script @common -Format Summary

          # 2) Human-readable Markdown -> stdout and the GitHub job summary.
          Write-Output '----- ROTATION REPORT (Markdown) -----'
          $markdown = & $script @common -Format Markdown
          $markdown
          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
            $markdown | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

          # 3) Structured JSON -> stdout and a file (for the artifact upload).
          Write-Output '----- ROTATION REPORT (JSON) -----'
          $json = & $script @common -Format Json
          $json | Out-File -FilePath rotation-report.json -Encoding utf8
          $json

      - name: Upload JSON rotation report
        # Skipped under act (no artifact server); runs on real GitHub-hosted runners.
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: rotation-report
          path: rotation-report.json
          if-no-files-found: error
