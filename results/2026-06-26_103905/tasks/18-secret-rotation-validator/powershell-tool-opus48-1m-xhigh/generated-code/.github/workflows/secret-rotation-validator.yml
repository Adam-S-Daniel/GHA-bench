name: Secret Rotation Validator

# Triggers:
#   - push / pull_request: validate on every change
#   - schedule: a weekly proactive sweep so rotations are caught even with no commits
#   - workflow_dispatch: on-demand runs with overridable inputs
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays at 06:00 UTC
  workflow_dispatch:
    inputs:
      warning_days:
        description: 'Warning window in days'
        required: false
        default: '14'
      config_path:
        description: 'Path to the secrets configuration JSON'
        required: false
        default: 'fixtures/secrets.json'
      fail_on_expired:
        description: 'Fail the build when expired secrets are found'
        required: false
        default: false
        type: boolean

# Least-privilege: this workflow only needs to read repository contents.
permissions:
  contents: read

# Avoid redundant concurrent runs for the same ref.
concurrency:
  group: secret-rotation-${{ github.ref }}
  cancel-in-progress: true

# Deterministic default shared by all jobs. REFERENCE_DATE pins "now" so the
# report is reproducible in CI and so the test harness can assert exact values.
env:
  REFERENCE_DATE: '2026-06-28'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: run the Pester unit test suite (red/green TDD output) in CI.
  # ---------------------------------------------------------------------------
  test:
    name: Pester unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./tests -PassThru -Output Detailed
          # Deterministic, easily-grepped result line for the CI test harness.
          Write-Output "PESTER_RESULT passed=$($result.PassedCount) failed=$($result.FailedCount)"
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed."
          }

  # ---------------------------------------------------------------------------
  # Job 2: run the validator against the configured secrets and report.
  # Depends on the test job so we never report from un-tested code.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate secret rotation
    runs-on: ubuntu-latest
    needs: test
    env:
      # workflow_dispatch inputs win when present; otherwise fall back to defaults.
      WARNING_DAYS: ${{ github.event.inputs.warning_days || '14' }}
      SECRETS_CONFIG: ${{ github.event.inputs.config_path || 'fixtures/secrets.json' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show resolved configuration
        shell: pwsh
        run: |
          Write-Host "Config:        $env:SECRETS_CONFIG"
          Write-Host "Warning days:  $env:WARNING_DAYS"
          Write-Host "Reference date: $env:REFERENCE_DATE"

      - name: Validate secret rotation (markdown report)
        shell: pwsh
        run: |
          ./Invoke-SecretRotationValidator.ps1 `
            -ConfigPath $env:SECRETS_CONFIG `
            -WarningDays ([int]$env:WARNING_DAYS) `
            -ReferenceDate $env:REFERENCE_DATE `
            -Format markdown `
            -OutFile report.md

      - name: Validate secret rotation (json report)
        shell: pwsh
        run: |
          ./Invoke-SecretRotationValidator.ps1 `
            -ConfigPath $env:SECRETS_CONFIG `
            -WarningDays ([int]$env:WARNING_DAYS) `
            -ReferenceDate $env:REFERENCE_DATE `
            -Format json `
            -OutFile report.json

      # Optional gate for real-world use: only on a manual run that opts in.
      # Never fires for push/schedule, so routine runs stay green and reporting.
      - name: Gate on expired secrets (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_on_expired }}
        shell: pwsh
        run: |
          ./Invoke-SecretRotationValidator.ps1 `
            -ConfigPath $env:SECRETS_CONFIG `
            -WarningDays ([int]$env:WARNING_DAYS) `
            -ReferenceDate $env:REFERENCE_DATE `
            -Format markdown `
            -FailOnExpired
