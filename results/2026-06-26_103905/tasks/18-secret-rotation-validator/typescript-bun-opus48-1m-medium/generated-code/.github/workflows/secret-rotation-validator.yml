name: Secret Rotation Validator

# Run on code changes, on a weekly schedule (so rotation drift is caught even
# without commits), and on manual dispatch.
on:
  push:
  pull_request:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      warning_window:
        description: "Days ahead to warn before a secret is due"
        required: false
        default: "14"

# Read-only: this job only checks out the repo and inspects mock config.
permissions:
  contents: read

# Pin the reference date and warning window so the report is deterministic.
# REPORT_NOW keeps `act` output reproducible regardless of the wall clock.
env:
  REPORT_NOW: "2026-06-27"
  WARNING_WINDOW: ${{ github.event.inputs.warning_window || '14' }}
  CONFIG_PATH: "fixtures/secrets.json"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run unit tests
        run: bun test

  validate:
    name: Validate secret rotation
    runs-on: ubuntu-latest
    # Only validate after the unit tests pass.
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Generate markdown rotation report
        run: |
          echo "===== MARKDOWN REPORT START ====="
          set +e
          bun run src/cli.ts \
            --config "$CONFIG_PATH" \
            --format markdown \
            --warning-window "$WARNING_WINDOW" \
            --now "$REPORT_NOW" | tee report.md
          echo "VALIDATOR_EXIT_CODE=${PIPESTATUS[0]}"
          set -e
          echo "===== MARKDOWN REPORT END ====="

      - name: Generate JSON rotation report
        run: |
          echo "===== JSON REPORT START ====="
          set +e
          bun run src/cli.ts \
            --config "$CONFIG_PATH" \
            --format json \
            --warning-window "$WARNING_WINDOW" \
            --now "$REPORT_NOW" | tee report.json
          echo "JSON_EXIT_CODE=${PIPESTATUS[0]}"
          set -e
          echo "===== JSON REPORT END ====="

      - name: Publish report to job summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"
