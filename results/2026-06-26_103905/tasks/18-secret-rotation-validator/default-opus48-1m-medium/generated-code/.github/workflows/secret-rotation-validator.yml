name: Secret Rotation Validator

# Triggers: run on pushes/PRs that may touch the config, on a weekly schedule
# (so rotation drift is caught even with no commits), and on demand.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Every Monday at 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      warning_days:
        description: "Warning window in days"
        required: false
        default: "14"

# Least privilege: the validator only needs to read the repository.
permissions:
  contents: read

env:
  # Pinned reference date keeps CI output deterministic for the bundled
  # fixture. In a real deployment you would drop NOW_DATE to use today's date.
  NOW_DATE: "2026-06-27"
  WARNING_DAYS: ${{ github.event.inputs.warning_days || '14' }}
  CONFIG_PATH: fixtures/secrets.json

jobs:
  validate:
    name: Validate secret rotation
    runs-on: ubuntu-latest
    outputs:
      expired: ${{ steps.report.outputs.expired }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate rotation report (markdown)
        id: report
        run: |
          set -euo pipefail
          echo "## Secret Rotation Report" >> "$GITHUB_STEP_SUMMARY"
          python3 secret_rotation_validator.py \
            --config "$CONFIG_PATH" \
            --now "$NOW_DATE" \
            --warning-days "$WARNING_DAYS" \
            --format markdown | tee -a "$GITHUB_STEP_SUMMARY" report.md

          # Also produce JSON and surface the per-urgency counts as step outputs.
          python3 secret_rotation_validator.py \
            --config "$CONFIG_PATH" \
            --now "$NOW_DATE" \
            --warning-days "$WARNING_DAYS" \
            --format json > report.json

          expired=$(jq '.summary.expired' report.json)
          warning=$(jq '.summary.warning' report.json)
          ok=$(jq '.summary.ok' report.json)
          echo "expired=$expired" >> "$GITHUB_OUTPUT"
          echo "Counts -> expired=$expired warning=$warning ok=$ok"

      - name: Upload reports
        # Skipped under nektos/act (no artifact server / ACTIONS_RUNTIME_TOKEN);
        # runs normally on GitHub-hosted runners.
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: rotation-reports
          path: |
            report.md
            report.json

  gate:
    name: Fail if secrets are expired
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report expired count from previous job
        run: |
          echo "Validate job reported expired=${{ needs.validate.outputs.expired }}"

      - name: Enforce rotation policy (non-blocking demo)
        # The bundled fixture intentionally contains one expired secret to
        # exercise the gate. We run in report-only mode (|| true) so the demo
        # pipeline still succeeds; flip to a hard failure in production by
        # removing the trailing "|| true".
        run: |
          set -uo pipefail
          python3 secret_rotation_validator.py \
            --config "$CONFIG_PATH" \
            --now "$NOW_DATE" \
            --warning-days "$WARNING_DAYS" \
            --fail-on-expired || echo "Rotation gate would fail in production"
