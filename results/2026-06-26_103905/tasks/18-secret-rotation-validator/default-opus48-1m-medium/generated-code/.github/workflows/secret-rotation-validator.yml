name: Secret Rotation Validator

# Trigger on code changes, PRs, a weekly schedule (so rotation drift is caught
# even without commits), and manual runs with tunable inputs.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Every Monday at 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to the secrets config JSON
        required: false
        default: tests/fixtures/mixed.json
      warning_window_days:
        description: Days before due date to start warning
        required: false
        default: '7'
      format:
        description: Output format (markdown or json)
        required: false
        default: markdown

# Least privilege: the validator only needs to read the checked-out repo.
permissions:
  contents: read

# Workflow-level defaults. The act harness overrides the un-prefixed vars
# (CONFIG_PATH, WARNING_WINDOW_DAYS, AS_OF, REPORT_FORMAT) via `act --env-file`;
# when they are unset the DEFAULT_* values below are used as fallbacks.
env:
  DEFAULT_CONFIG_PATH: tests/fixtures/mixed.json
  DEFAULT_WARNING_WINDOW_DAYS: '7'
  DEFAULT_FORMAT: markdown

jobs:
  # Job 1: run the Pester unit tests (red/green TDD suite) inside the pipeline.
  test:
    name: Unit tests (Pester)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project files exist
        shell: pwsh
        run: |
          foreach ($f in 'SecretRotation.ps1', 'Validate-SecretRotation.ps1', 'tests/SecretRotation.Tests.ps1') {
            if (-not (Test-Path $f)) { throw "Missing required file: $f" }
            Write-Host "Found $f"
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path tests/SecretRotation.Tests.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed"
          }
          Write-Host "All $($result.PassedCount) Pester tests passed"

  # Job 2: generate the rotation report. Depends on the tests passing.
  report:
    name: Generate rotation report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run secret rotation validator
        shell: pwsh
        run: |
          # Prefer harness-injected env vars; fall back to workflow DEFAULT_*.
          $configPath = if ($env:CONFIG_PATH) { $env:CONFIG_PATH } else { $env:DEFAULT_CONFIG_PATH }
          $window     = if ($env:WARNING_WINDOW_DAYS) { $env:WARNING_WINDOW_DAYS } else { $env:DEFAULT_WARNING_WINDOW_DAYS }
          $format     = if ($env:REPORT_FORMAT) { $env:REPORT_FORMAT } else { $env:DEFAULT_FORMAT }

          $params = @{
            ConfigPath        = $configPath
            WarningWindowDays = [int]$window
            Format            = $format
          }
          if ($env:AS_OF) { $params.AsOf = $env:AS_OF }

          Write-Host "::group::Validator parameters"
          Write-Host "config=$configPath window=$window format=$format asOf=$($env:AS_OF)"
          Write-Host "::endgroup::"

          Write-Host '----- REPORT BEGIN -----'
          ./Validate-SecretRotation.ps1 @params
          $code = $LASTEXITCODE
          Write-Host '----- REPORT END -----'
          if ($code -ne 0) { throw "Validator exited with code $code" }

          # Publish the report to the job summary when running on real GitHub.
          if ($env:GITHUB_STEP_SUMMARY) {
            ./Validate-SecretRotation.ps1 @params | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
