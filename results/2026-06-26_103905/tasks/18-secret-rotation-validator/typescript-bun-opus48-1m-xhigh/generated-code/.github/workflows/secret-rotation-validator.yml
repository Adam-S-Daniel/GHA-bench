name: Secret Rotation Validator

# Triggers:
#   - push / pull_request: validate on every change.
#   - schedule:            weekly audit (Mondays 06:00 UTC) so drift is caught
#                          even when nobody is touching the repo.
#   - workflow_dispatch:   manual run with optional overrides.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      warning_days:
        description: "Warning window in days (overrides the config file's value)."
        required: false
        type: string
        default: ""
      fail_on:
        description: "Fail the run when findings reach this level."
        required: false
        type: choice
        default: "none"
        options:
          - "none"
          - "warning"
          - "expired"

# Least privilege: the validator only needs to read the checked-out repo.
permissions:
  contents: read

# Workflow-wide defaults. SECRETS_CONFIG points at the secrets metadata file the
# validator reads; the fixture carries its own `now` + warning window so runs are
# fully deterministic in CI.
env:
  SECRETS_CONFIG: fixtures/secrets.json

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: classify every secret and expose per-urgency counts/names as outputs.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate secret rotation
    runs-on: ubuntu-latest
    outputs:
      total: ${{ steps.report.outputs.total }}
      expired_count: ${{ steps.report.outputs.expired_count }}
      warning_count: ${{ steps.report.outputs.warning_count }}
      ok_count: ${{ steps.report.outputs.ok_count }}
      expired_names: ${{ steps.report.outputs.expired_names }}
      warning_names: ${{ steps.report.outputs.warning_names }}
      ok_names: ${{ steps.report.outputs.ok_names }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Install Bun. In the benchmark act image Bun is absent, so this fetches
      # it; on a real GitHub runner it is a quick cached download.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show Bun version
        run: bun --version

      # Machine-readable outputs (key=value) -> $GITHUB_OUTPUT, consumed by the
      # notify job. No --fail-on here so outputs are always captured.
      - name: Compute rotation report outputs
        id: report
        env:
          WARNING_DAYS: ${{ inputs.warning_days }}
        run: |
          set -euo pipefail
          args=( --config "$SECRETS_CONFIG" --format github )
          if [ -n "${WARNING_DAYS}" ]; then
            args+=( --warning-days "${WARNING_DAYS}" )
          fi
          echo "Running: bun run secret-rotation-validator.ts ${args[*]}"
          bun run secret-rotation-validator.ts "${args[@]}" >> "$GITHUB_OUTPUT"

      # Human-readable markdown report -> the GitHub Actions job summary + log.
      - name: Write markdown job summary
        env:
          WARNING_DAYS: ${{ inputs.warning_days }}
        run: |
          set -euo pipefail
          args=( --config "$SECRETS_CONFIG" --format markdown )
          if [ -n "${WARNING_DAYS}" ]; then
            args+=( --warning-days "${WARNING_DAYS}" )
          fi
          bun run secret-rotation-validator.ts "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      # JSON report -> a file in the workspace + the log (verifiable artifact).
      - name: Write JSON report
        env:
          WARNING_DAYS: ${{ inputs.warning_days }}
        run: |
          set -euo pipefail
          args=( --config "$SECRETS_CONFIG" --format json )
          if [ -n "${WARNING_DAYS}" ]; then
            args+=( --warning-days "${WARNING_DAYS}" )
          fi
          bun run secret-rotation-validator.ts "${args[@]}" > rotation-report.json
          echo "----- rotation-report.json -----"
          cat rotation-report.json

      # Optional CI gate. Default fail_on=none => always exit 0 (report-only),
      # so push/PR/schedule runs are non-blocking. A manual run can set
      # fail_on=expired|warning to make rotation drift fail the pipeline.
      - name: Rotation gate
        env:
          FAIL_ON: ${{ inputs.fail_on || 'none' }}
          WARNING_DAYS: ${{ inputs.warning_days }}
        run: |
          set -euo pipefail
          args=( --config "$SECRETS_CONFIG" --format github --fail-on "${FAIL_ON}" )
          if [ -n "${WARNING_DAYS}" ]; then
            args+=( --warning-days "${WARNING_DAYS}" )
          fi
          echo "Gate threshold: fail-on=${FAIL_ON}"
          bun run secret-rotation-validator.ts "${args[@]}" > /dev/null
          echo "Rotation gate passed (threshold: ${FAIL_ON})."

  # ---------------------------------------------------------------------------
  # Job 2: emit urgency-grouped notifications from the validate job's outputs.
  # Demonstrates job dependency + output passing.
  # ---------------------------------------------------------------------------
  notify:
    name: Notify by urgency
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Print grouped notifications
        env:
          TOTAL: ${{ needs.validate.outputs.total }}
          EXPIRED_COUNT: ${{ needs.validate.outputs.expired_count }}
          WARNING_COUNT: ${{ needs.validate.outputs.warning_count }}
          OK_COUNT: ${{ needs.validate.outputs.ok_count }}
          EXPIRED_NAMES: ${{ needs.validate.outputs.expired_names }}
          WARNING_NAMES: ${{ needs.validate.outputs.warning_names }}
          OK_NAMES: ${{ needs.validate.outputs.ok_names }}
        run: |
          set -euo pipefail
          echo "=== Notifications by urgency ==="
          echo "TOTAL: ${TOTAL}"
          echo "EXPIRED (${EXPIRED_COUNT}): ${EXPIRED_NAMES}"
          echo "WARNING (${WARNING_COUNT}): ${WARNING_NAMES}"
          echo "OK (${OK_COUNT}): ${OK_NAMES}"
