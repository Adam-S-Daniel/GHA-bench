name: Semantic Version Bumper

# Run on pushes and PRs (so the version impact of a change is visible in CI),
# on a nightly schedule, and on manual dispatch for ad-hoc bumps.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Mondays at 03:00 UTC
  workflow_dispatch:
    inputs:
      version_file:
        description: "Path to the version file to bump"
        required: false
        default: "package.json"
      commits_file:
        description: "Path to the commit log fixture to analyse"
        required: false
        default: "commits.txt"

# Least-privilege: the job only needs to read the repository contents.
permissions:
  contents: read

# Sensible defaults so the workflow runs with no secrets/external services.
env:
  VERSION_FILE: ${{ github.event.inputs.version_file || 'package.json' }}
  COMMITS_FILE: ${{ github.event.inputs.commits_file || 'commits.txt' }}
  CHANGELOG_FILE: CHANGELOG.md

jobs:
  bump:
    name: Compute next semantic version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run unit tests
        run: bun test tests/

      - name: Bump version from conventional commits
        id: bump
        run: |
          bun run src/cli.ts \
            --version-file "$VERSION_FILE" \
            --commits-file "$COMMITS_FILE" \
            --changelog "$CHANGELOG_FILE" \
            --date "2026-06-26" | tee bump-output.txt

          # Re-export the parsed values as step outputs for downstream jobs.
          NEW_VERSION="$(grep '^NEW_VERSION=' bump-output.txt | cut -d= -f2)"
          BUMP="$(grep '^BUMP=' bump-output.txt | cut -d= -f2)"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"

      - name: Show resulting version
        run: |
          echo "Next version: ${{ steps.bump.outputs.new_version }}"
          echo "Bump type: ${{ steps.bump.outputs.bump }}"

  report:
    name: Report computed version
    runs-on: ubuntu-latest
    needs: bump
    steps:
      - name: Echo version from previous job
        run: |
          echo "RESULT_NEW_VERSION=${{ needs.bump.outputs.new_version }}"
          echo "RESULT_BUMP=${{ needs.bump.outputs.bump }}"
