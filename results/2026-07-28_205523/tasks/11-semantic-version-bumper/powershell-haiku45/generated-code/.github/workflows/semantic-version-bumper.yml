name: Semantic Version Bumper

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Semantic Version Bumper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          Set-Location ${{ github.workspace }}
          $results = Invoke-Pester -Path SemanticVersionBumper.Tests.ps1 -PassThru
          if ($results.FailedCount -gt 0) {
            exit 1
          }
          exit 0

  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Bump version (package.json)
        shell: pwsh
        if: hashFiles('package.json') != ''
        run: |
          Set-Location ${{ github.workspace }}
          . ./SemanticVersionBumper.ps1
          $newVersion = Invoke-SemanticVersionBump -VersionFile package.json -ChangelogFile CHANGELOG.md
          Write-Host "New version: $newVersion"
          echo "NEW_VERSION=$newVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bump version (version.txt)
        shell: pwsh
        if: hashFiles('version.txt') != '' && hashFiles('package.json') == ''
        run: |
          Set-Location ${{ github.workspace }}
          . ./SemanticVersionBumper.ps1
          $newVersion = Invoke-SemanticVersionBump -VersionFile version.txt -ChangelogFile CHANGELOG.md
          Write-Host "New version: $newVersion"
          echo "NEW_VERSION=$newVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Commit and push changes
        shell: bash
        if: env.NEW_VERSION != ''
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add -A
            git commit -m "chore: bump version to ${{ env.NEW_VERSION }}" || true
            if git remote get-url origin 2>/dev/null; then
              git push || echo "Warning: could not push to remote"
            else
              echo "No remote configured, skipping push"
            fi
            echo "Version bumped to ${{ env.NEW_VERSION }}"
          fi
