name: Secret Rotation Validator

# Runs on every push/PR (catch newly-expiring secrets before merge), on a
# weekly schedule (catch secrets that expire between pushes), and on demand.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:
    inputs:
      fixture:
        description: "Fixture file (under fixtures/) to validate"
        required: false
        default: "secrets-mixed.json"
        type: string
      format:
        description: "Report output format"
        required: false
        default: "markdown"
        type: choice
        options:
          - markdown
          - json
      warning-window:
        description: "Override the warning window, in days"
        required: false
        default: "14"
        type: string

permissions:
  contents: read

env:
  TZ: UTC
  DEFAULT_WARNING_WINDOW_DAYS: "14"
  # Fixed reference date so the mock fixture data classifies deterministically
  # regardless of which calendar day the pipeline actually runs on.
  VALIDATION_NOW: "2026-07-01"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: >
          bun test
          tests/dateUtils.test.ts
          tests/evaluate.test.ts
          tests/config.test.ts
          tests/report.test.ts
          tests/format.test.ts
          tests/cli.test.ts

  validate-secrets:
    name: Validate (${{ matrix.case.id }})
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - id: ok
            fixture: secrets-ok.json
            format: markdown
          - id: warning
            fixture: secrets-warning.json
            format: markdown
          - id: expired
            fixture: secrets-expired.json
            format: markdown
          - id: mixed
            fixture: secrets-mixed.json
            format: json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run rotation report for ${{ matrix.case.id }}
        id: report
        run: |
          echo "CASE_MARKER_BEGIN case=${{ matrix.case.id }}"
          bun run app.ts \
            --config "fixtures/${{ matrix.case.fixture }}" \
            --format "${{ matrix.case.format }}" \
            --warning-window "${{ github.event.inputs['warning-window'] || env.DEFAULT_WARNING_WINDOW_DAYS }}" \
            --now "$VALIDATION_NOW" | tee "report-${{ matrix.case.id }}.out"
          echo "CASE_MARKER_END case=${{ matrix.case.id }}"

      - name: Publish report to job summary
        run: |
          {
            echo "### Rotation report: ${{ matrix.case.id }}"
            echo '```'
            cat "report-${{ matrix.case.id }}.out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  validate-error-handling:
    name: Validate error handling
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run validator against an invalid config
        id: invalid_run
        run: |
          set +e
          bun run app.ts --config fixtures/secrets-invalid.json --now "$VALIDATION_NOW" \
            > invalid-run-stdout.txt 2> invalid-run-stderr.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Verify the invalid config was rejected with a meaningful error
        run: |
          echo "CASE_MARKER_BEGIN case=invalid"
          echo "captured exit code: ${{ steps.invalid_run.outputs.exit_code }}"
          if [ "${{ steps.invalid_run.outputs.exit_code }}" != "1" ]; then
            echo "expected exit code 1, got ${{ steps.invalid_run.outputs.exit_code }}" >&2
            exit 1
          fi
          if ! grep -q "rotationPolicyDays" invalid-run-stderr.txt; then
            echo "expected the error message to mention rotationPolicyDays" >&2
            cat invalid-run-stderr.txt >&2
            exit 1
          fi
          echo "error message: $(cat invalid-run-stderr.txt)"
          echo "CASE_MARKER_END case=invalid"

  summary:
    name: Summary
    needs: [validate-secrets, validate-error-handling]
    runs-on: ubuntu-latest
    steps:
      - name: All secret rotation checks passed
        run: echo "All rotation report cases and error-handling checks succeeded."
