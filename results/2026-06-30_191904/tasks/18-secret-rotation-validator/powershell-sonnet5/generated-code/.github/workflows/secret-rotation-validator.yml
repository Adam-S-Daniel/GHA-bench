name: Secret Rotation Validator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily health check of the secret inventory, independent of any code change.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      warning_days:
        description: 'Warning window (days) before a secret is due for rotation'
        required: false
        default: '14'

permissions:
  contents: read

env:
  WARNING_DAYS: ${{ github.event.inputs.warning_days || '14' }}
  CONFIG_PATH: secrets-config.json

jobs:
  unit-tests:
    name: Run Pester unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pester 5 is available
        shell: pwsh
        run: |
          $pester5 = Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0.0' }
          if (-not $pester5) {
            Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'test-results.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-test-results
          path: test-results.xml

  rotation-report:
    name: Generate rotation report
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Markdown report
        shell: pwsh
        run: |
          ./scripts/Invoke-RotationCheck.ps1 -ConfigPath $env:CONFIG_PATH -WarningDays ([int]$env:WARNING_DAYS) -OutputFormat Markdown -OutputPath rotation-report.md

      - name: Publish report to job summary
        shell: pwsh
        run: |
          Get-Content rotation-report.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Generate JSON report
        shell: pwsh
        run: |
          ./scripts/Invoke-RotationCheck.ps1 -ConfigPath $env:CONFIG_PATH -WarningDays ([int]$env:WARNING_DAYS) -OutputFormat Json -OutputPath rotation-report.json

      - name: Emit machine-readable summary
        shell: pwsh
        run: |
          Write-Output '<<<ROTATION_REPORT_JSON>>>'
          Get-Content rotation-report.json
          Write-Output '<<<END_ROTATION_REPORT_JSON>>>'

      - name: Upload rotation reports
        uses: actions/upload-artifact@v4
        with:
          name: rotation-reports
          path: |
            rotation-report.md
            rotation-report.json
