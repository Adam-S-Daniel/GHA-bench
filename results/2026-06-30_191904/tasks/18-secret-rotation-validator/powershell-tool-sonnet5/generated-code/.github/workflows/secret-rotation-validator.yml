name: Secret Rotation Validator

# Runs on every push/PR (fast feedback), on a weekly schedule (the actual
# security-audit cadence this tool exists for), and on-demand.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  WARNING_WINDOW_DAYS: 14

jobs:
  test:
    name: Run Pester unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Pester is installed
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.0.0 -Scope CurrentUser
          }

      - name: Run unit tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./Tests/SecretRotationValidator.Tests.ps1, ./Tests/SecretRotationValidatorScript.Tests.ps1 -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) unit test(s) failed"
          }

  validate-secrets:
    name: Validate secret rotation status
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check secrets nearing or past rotation deadline
        shell: pwsh
        run: |
          $output = ./SecretRotationValidator.ps1 `
            -ConfigPath ./Tests/fixtures/mixed-secrets.json `
            -OutputFormat Json `
            -AsOf '2026-01-15' `
            -WarningWindowDays $env:WARNING_WINDOW_DAYS
          Write-Output $output
          $report = $output | ConvertFrom-Json
          if ($report.Summary.ExpiredCount -ne 2) { throw "Expected 2 expired secrets, got $($report.Summary.ExpiredCount)" }
          if ($report.Summary.WarningCount -ne 3) { throw "Expected 3 warning secrets, got $($report.Summary.WarningCount)" }
          if ($report.Summary.OkCount -ne 1) { throw "Expected 1 ok secret, got $($report.Summary.OkCount)" }
          Write-Output 'Mixed fixture check passed: Expired=2 Warning=3 Ok=1'

      - name: Gate on a healthy secret set (FailOnExpired)
        shell: pwsh
        run: |
          $output = ./SecretRotationValidator.ps1 `
            -ConfigPath ./Tests/fixtures/all-healthy-secrets.json `
            -OutputFormat Markdown `
            -AsOf '2026-01-15' `
            -FailOnExpired
          Write-Output $output
          Write-Output 'Healthy fixture check passed: FailOnExpired gate did not trigger'
