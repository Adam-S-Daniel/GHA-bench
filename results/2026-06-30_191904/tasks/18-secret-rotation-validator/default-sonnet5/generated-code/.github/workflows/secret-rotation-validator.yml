name: Secret Rotation Validator

on:
  push:
  pull_request:
  schedule:
    # Weekly check so expiring secrets surface even without a code push.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      warning_days:
        description: 'Warning window in days before rotation is due'
        required: false
        default: '14'

permissions:
  contents: read

env:
  CONFIG_PATH: fixtures/secrets-config.json
  # Fixed reference date so rotation math is deterministic in CI, independent
  # of the wall-clock day the workflow happens to run on.
  REFERENCE_DATE: '2026-07-01'
  WARNING_DAYS: '14'

jobs:
  validate-secrets:
    name: Validate secret rotation status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate markdown rotation report
        run: |
          # Written to a file (not piped through `tee`) so the script's own
          # exit code -- not a downstream pipe command's -- decides whether
          # this step, and therefore the job, succeeds or fails.
          python3 secret_rotation_validator.py \
            --config "$CONFIG_PATH" \
            --warning-days "${{ github.event.inputs.warning_days || env.WARNING_DAYS }}" \
            --now "$REFERENCE_DATE" \
            --format markdown --output rotation-report.md
          cat rotation-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate JSON rotation report
        run: |
          python3 secret_rotation_validator.py \
            --config "$CONFIG_PATH" \
            --warning-days "${{ github.event.inputs.warning_days || env.WARNING_DAYS }}" \
            --now "$REFERENCE_DATE" \
            --format json --output rotation-report.json
