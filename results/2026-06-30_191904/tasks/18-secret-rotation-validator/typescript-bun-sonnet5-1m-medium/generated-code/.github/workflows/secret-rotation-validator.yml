name: Secret Rotation Validator

on:
  push:
  pull_request:
  schedule:
    # Weekly audit so long-lived secrets don't silently drift past their
    # rotation policy even without a code change.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Warning window (in days) applied when no per-run override is given.
  DEFAULT_WARNING_DAYS: "14"

jobs:
  test:
    name: Unit tests & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bun test

  validate-secrets:
    name: Validate secret rotation status
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate rotation report for mixed fixture (markdown)
        # --now pins the reference date so the demo fixture's expired/warning
        # classification is reproducible regardless of when this job runs.
        # This fixture deliberately contains an expired secret, so the CLI's
        # exit code (1) is captured and asserted below rather than allowed to
        # fail the step outright.
        id: mixed_markdown
        run: |
          set +e
          bun run cli.ts fixtures/mixed.json \
            --format markdown \
            --warning-days "${DEFAULT_WARNING_DAYS}" \
            --now 2026-07-01T00:00:00.000Z | tee -a "$GITHUB_STEP_SUMMARY"
          exit_code="${PIPESTATUS[0]}"
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Generate rotation report for mixed fixture (JSON)
        id: mixed_json
        run: |
          set +e
          output=$(bun run cli.ts fixtures/mixed.json \
            --format json \
            --warning-days "${DEFAULT_WARNING_DAYS}" \
            --now 2026-07-01T00:00:00.000Z)
          exit_code=$?
          echo "$output"
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          echo "expired_count=$(echo "$output" | grep -c '"urgency": "expired"')" >> "$GITHUB_OUTPUT"

      - name: Assert mixed fixture was classified correctly
        # The mixed fixture is fixed test data: exactly one expired secret
        # (db-password), so the CLI must exit 1 and report exactly one
        # "expired" entry. Any deviation means the detection logic regressed.
        run: |
          if [ "${{ steps.mixed_markdown.outputs.exit_code }}" != "1" ]; then
            echo "Expected exit code 1 for mixed fixture (expired secret present), got ${{ steps.mixed_markdown.outputs.exit_code }}"
            exit 1
          fi
          if [ "${{ steps.mixed_json.outputs.expired_count }}" != "1" ]; then
            echo "Expected exactly 1 expired secret in mixed fixture, got ${{ steps.mixed_json.outputs.expired_count }}"
            exit 1
          fi
          echo "Mixed fixture correctly classified: 1 expired secret, exit code 1."

      - name: Enforce rotation policy on production secrets
        # This fixture represents the "real" secrets fleet and is expected to
        # be fully compliant; the job fails if any of these secrets expire.
        run: |
          bun run cli.ts fixtures/all-ok.json \
            --format markdown \
            --warning-days "${DEFAULT_WARNING_DAYS}" \
            --now 2026-07-01T00:00:00.000Z | tee -a "$GITHUB_STEP_SUMMARY"
