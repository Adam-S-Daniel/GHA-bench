name: Secret Rotation Validator

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      warning-days:
        description: 'Days before expiry to flag as Warning'
        required: false
        default: '14'
  schedule:
    # Daily rotation check.
    - cron: '0 6 * * *'

permissions:
  contents: read

env:
  WARNING_DAYS: 14

jobs:
  test:
    name: Run Pester tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          # Act.Pipeline.Tests.ps1 and Workflow.Structure.Tests.ps1 are meta-tests
          # that shell out to `act` and `actionlint` respectively -- tools that
          # validate the pipeline itself from the outside. They are run by the
          # developer/agent on the host, not from inside the pipeline they test
          # (no Docker-in-Docker / actionlint binary in this container).
          $files = Get-ChildItem -Path ./tests -Filter '*.Tests.ps1' |
            Where-Object { $_.Name -notin @('Act.Pipeline.Tests.ps1', 'Workflow.Structure.Tests.ps1') }
          $result = Invoke-Pester -Path $files.FullName -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) test(s) failed."
          }

  validate-rotation:
    name: Validate secret rotation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run rotation check (healthy secrets, Markdown report)
        shell: pwsh
        run: |
          ./Invoke-SecretRotationCheck.ps1 `
            -ConfigPath ./fixtures/secrets.allok.json `
            -WarningDays ${env:WARNING_DAYS} `
            -Format Markdown

      - name: Run rotation check (mixed secrets, JSON report)
        id: mixed-check
        shell: pwsh
        continue-on-error: true
        run: |
          ./Invoke-SecretRotationCheck.ps1 `
            -ConfigPath ./fixtures/secrets.sample.json `
            -WarningDays ${env:WARNING_DAYS} `
            -Format Json

      - name: Assert expired secrets were detected
        shell: pwsh
        run: |
          if ($env:MIXED_OUTCOME -ne 'failure') {
            throw "Expected the mixed-secrets check to exit non-zero due to an expired secret, but it reported '$env:MIXED_OUTCOME'."
          }
          Write-Output "Mixed-secrets check correctly flagged expired/warning secrets (outcome: $env:MIXED_OUTCOME)."
        env:
          MIXED_OUTCOME: ${{ steps.mixed-check.outcome }}
