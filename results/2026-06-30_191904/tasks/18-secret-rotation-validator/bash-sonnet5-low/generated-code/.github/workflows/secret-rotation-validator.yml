name: Secret Rotation Validator

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly check for secrets nearing/past their rotation policy.
    - cron: '0 3 * * *'

permissions:
  contents: read

env:
  WARNING_DAYS: '14'

jobs:
  validate:
    name: Lint, test, and run the rotation validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (jq, bats, shellcheck)
        run: |
          set -e
          command -v jq >/dev/null || (sudo apt-get update && sudo apt-get install -y jq)
          command -v shellcheck >/dev/null || (sudo apt-get update && sudo apt-get install -y shellcheck)
          command -v bats >/dev/null || (sudo apt-get update && sudo apt-get install -y bats)

      - name: Shellcheck the script
        run: shellcheck scripts/secret-rotation-validator.sh

      - name: Run bats test suite
        run: bats tests/rotation.bats

      - name: Generate markdown rotation report
        run: |
          ./scripts/secret-rotation-validator.sh \
            --config fixtures/secrets_basic.json \
            --today 2026-07-01 \
            --warning-days "${WARNING_DAYS}" \
            --format markdown | tee "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

      - name: Generate JSON rotation report
        run: |
          ./scripts/secret-rotation-validator.sh \
            --config fixtures/secrets_basic.json \
            --today 2026-07-01 \
            --warning-days "${WARNING_DAYS}" \
            --format json
