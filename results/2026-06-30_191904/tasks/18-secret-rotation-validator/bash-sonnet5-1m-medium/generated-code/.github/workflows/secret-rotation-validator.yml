name: Secret Rotation Validator

on:
  push:
  pull_request:
  schedule:
    # Run every Monday at 06:00 UTC to catch upcoming/expired rotations.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      warning-days:
        description: 'Days before expiry to start warning'
        required: false
        default: '7'

env:
  WARNING_DAYS: ${{ inputs.warning-days || '7' }}
  REPORT_TODAY: '2026-07-01'

permissions:
  contents: read

jobs:
  validate:
    name: Validate secret rotation fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq and shellcheck
        run: |
          if ! command -v jq >/dev/null 2>&1 || ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq shellcheck
          fi

      - name: Lint script with shellcheck
        run: shellcheck scripts/secret_rotation_validator.sh

      - name: Syntax check
        run: bash -n scripts/secret_rotation_validator.sh

      - name: "Case: expired + warning + ok (markdown)"
        run: |
          echo "=== CASE: mixed-markdown ==="
          ./scripts/secret_rotation_validator.sh \
            --config fixtures/secrets_mixed.json \
            --today "$REPORT_TODAY" \
            --warning-days "$WARNING_DAYS" \
            --format markdown

      - name: "Case: expired + warning + ok (json)"
        run: |
          echo "=== CASE: mixed-json ==="
          ./scripts/secret_rotation_validator.sh \
            --config fixtures/secrets_mixed.json \
            --today "$REPORT_TODAY" \
            --warning-days "$WARNING_DAYS" \
            --format json

      - name: "Case: boundary days (expired-today, warning-at-threshold)"
        run: |
          echo "=== CASE: boundary-json ==="
          ./scripts/secret_rotation_validator.sh \
            --config fixtures/secrets_edge_boundary.json \
            --today "$REPORT_TODAY" \
            --warning-days "$WARNING_DAYS" \
            --format json

      - name: "Case: all secrets healthy"
        run: |
          echo "=== CASE: all-ok-json ==="
          ./scripts/secret_rotation_validator.sh \
            --config fixtures/secrets_all_ok.json \
            --today "$REPORT_TODAY" \
            --warning-days "$WARNING_DAYS" \
            --format json

      - name: "Case: invalid config is rejected"
        run: |
          echo "=== CASE: invalid-config ==="
          if ./scripts/secret_rotation_validator.sh \
            --config fixtures/secrets_invalid.json \
            --today "$REPORT_TODAY" \
            --format json; then
            echo "FAIL: expected non-zero exit for invalid config"
            exit 1
          else
            echo "invalid config correctly rejected with exit code $?"
          fi
