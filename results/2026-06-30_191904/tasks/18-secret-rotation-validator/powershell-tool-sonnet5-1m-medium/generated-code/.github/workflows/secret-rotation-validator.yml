name: Secret Rotation Validator

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      config-path:
        description: 'Path to the secrets config JSON to validate'
        required: false
        default: 'fixtures/sample-secrets.json'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  WARNING_DAYS: 14
  VALIDATION_NOW: '2026-07-01'
  SECRETS_CONFIG_PATH: fixtures/sample-secrets.json

jobs:
  unit-tests:
    name: Run Pester unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester test suite
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./tests -PassThru
          if ($result.FailedCount -gt 0) {
            Write-Error "$($result.FailedCount) Pester test(s) failed."
            exit 1
          }
          Write-Host "All $($result.PassedCount) Pester tests passed."

  validate-secrets:
    name: Validate secret rotation status
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret rotation validator
        shell: pwsh
        env:
          CONFIG_PATH: ${{ github.event.inputs.config-path || 'fixtures/sample-secrets.json' }}
        run: |
          ./Invoke-SecretRotationValidator.ps1 `
            -ConfigPath $env:CONFIG_PATH `
            -WarningDays ([int]$env:WARNING_DAYS) `
            -Now $env:VALIDATION_NOW `
            -Format Markdown `
            -OutputPath report.md `
            -FailOnExpired:$false

          Get-Content -Path report.md

          if ($env:GITHUB_STEP_SUMMARY) {
            Get-Content -Path report.md -Raw | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
