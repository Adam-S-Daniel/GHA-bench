name: Secret Rotation Validator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly nudge so stale secrets get flagged even without code changes.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      warning_days:
        description: 'Warning window in days before treating a secret as due soon'
        required: false
        default: '7'

permissions:
  contents: read

env:
  CONFIG_PATH: fixtures/secrets_config.json

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: python3 -m pytest tests/ -v

  validate:
    name: Validate secret rotation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Markdown rotation report
        run: |
          python3 secret_rotation_validator.py \
            --config "${CONFIG_PATH}" \
            --format markdown \
            --today 2026-07-01 \
            --warning-days "${{ github.event.inputs.warning_days || 7 }}" \
            | tee rotation-report.md

      - name: Publish job summary
        run: cat rotation-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate JSON rotation report
        run: |
          python3 secret_rotation_validator.py \
            --config "${CONFIG_PATH}" \
            --format json \
            --today 2026-07-01 \
            --warning-days "${{ github.event.inputs.warning_days || 7 }}" \
            > rotation-report.json
          cat rotation-report.json

      - name: Enforce zero-expired-secrets gate
        # Uses a fixture with no expired secrets so the job stays green;
        # --fail-on-expired is what makes this step exit 1 (and thus fail
        # the pipeline) the moment a real secret is overdue for rotation.
        run: |
          python3 secret_rotation_validator.py \
            --config fixtures/secrets_config_clean.json \
            --format json \
            --today 2026-07-01 \
            --fail-on-expired
