name: Secret Rotation Validator

# Checks the project's mock secret inventory (secrets-config.json) against
# each secret's rotation policy and reports anything expired or due soon.
#
# Triggers:
#   - push / pull_request: catch a stale secret before it merges.
#   - schedule: a weekly check independent of code changes, since secrets
#     age even when nobody touches the repo.
#   - workflow_dispatch: let an operator run an ad-hoc check with a custom
#     warning window.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      warning_days:
        description: 'Warning window in days before a secret is considered "expiring soon"'
        required: false
        default: '14'
        type: string

permissions:
  contents: read

env:
  WARNING_DAYS: ${{ inputs.warning_days || '14' }}
  # All secret metadata in this repo is mock data (see the task description),
  # so we pin the "current date" the validator evaluates against to keep
  # results reproducible across runs instead of drifting with wall-clock time.
  SIMULATED_TODAY: '2026-06-15'
  CONFIG_FILE: secrets-config.json

jobs:
  lint:
    name: Lint script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck
        run: shellcheck secret-rotation-validator.sh

      - name: Check script syntax
        run: bash -n secret-rotation-validator.sh

  test:
    name: Run tests and check rotation status
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      expired_count: ${{ steps.report.outputs.expired_count }}
      warning_count: ${{ steps.report.outputs.warning_count }}
      ok_count: ${{ steps.report.outputs.ok_count }}
      total_count: ${{ steps.report.outputs.total_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core and jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats jq

      - name: Run bats unit test suite
        run: |
          bats \
            tests/unit_dates.bats \
            tests/unit_status.bats \
            tests/unit_validate_config.bats \
            tests/unit_report_json.bats \
            tests/unit_report_markdown.bats \
            tests/cli_main.bats

      - name: Check production secret rotation status
        id: report
        run: |
          set -euo pipefail
          chmod +x secret-rotation-validator.sh
          ./secret-rotation-validator.sh \
            --config "$CONFIG_FILE" \
            --today "$SIMULATED_TODAY" \
            --warning-days "$WARNING_DAYS" \
            --format json \
            --output rotation-report.json
          cat rotation-report.json
          {
            echo "expired_count=$(jq -r '.summary.expired' rotation-report.json)"
            echo "warning_count=$(jq -r '.summary.warning' rotation-report.json)"
            echo "ok_count=$(jq -r '.summary.ok' rotation-report.json)"
            echo "total_count=$(jq -r '.summary.total' rotation-report.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish rotation report to job summary
        run: |
          ./secret-rotation-validator.sh \
            --config "$CONFIG_FILE" \
            --today "$SIMULATED_TODAY" \
            --warning-days "$WARNING_DAYS" \
            --format markdown \
            --no-fail-on-expired >> "$GITHUB_STEP_SUMMARY"

      - name: Generate demo rotation reports (fixture data, non-blocking)
        run: |
          echo "--- demo: fixtures/secrets-mixed.json ---"
          ./secret-rotation-validator.sh \
            --config fixtures/secrets-mixed.json \
            --today "$SIMULATED_TODAY" \
            --warning-days "$WARNING_DAYS" \
            --format json \
            --no-fail-on-expired
          echo "--- demo: fixtures/secrets-all-expired.json ---"
          ./secret-rotation-validator.sh \
            --config fixtures/secrets-all-expired.json \
            --today "$SIMULATED_TODAY" \
            --warning-days "$WARNING_DAYS" \
            --format json \
            --no-fail-on-expired

  notify:
    name: Notify on rotation status
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Report rotation summary
        env:
          EXPIRED_COUNT: ${{ needs.test.outputs.expired_count }}
          WARNING_COUNT: ${{ needs.test.outputs.warning_count }}
          OK_COUNT: ${{ needs.test.outputs.ok_count }}
        run: |
          echo "Rotation summary -> expired=$EXPIRED_COUNT warning=$WARNING_COUNT ok=$OK_COUNT"
          if [ "$EXPIRED_COUNT" -gt 0 ]; then
            echo "::warning::$EXPIRED_COUNT secret(s) are expired and require immediate rotation."
          else
            echo "All monitored secrets are within policy."
          fi
