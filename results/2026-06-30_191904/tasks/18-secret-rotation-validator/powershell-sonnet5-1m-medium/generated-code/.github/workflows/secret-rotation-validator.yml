name: Secret Rotation Validator

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      warning-days:
        description: 'Days before expiry to start warning'
        required: false
        default: '7'

permissions:
  contents: read

env:
  WARNING_DAYS: ${{ github.event.inputs['warning-days'] || '7' }}
  CONFIG_PATH: fixtures/sample-secrets.json

jobs:
  test:
    name: Run Pester test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./tests -CI -Output Detailed

  validate:
    name: Validate secret rotation status
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate markdown rotation report
        shell: pwsh
        run: |
          ./Invoke-Validator.ps1 -ConfigPath $env:CONFIG_PATH -WarningDays ([int]$env:WARNING_DAYS) -OutputFormat Markdown -CurrentDate '2026-03-01'

      - name: Generate JSON rotation report
        shell: pwsh
        run: |
          ./Invoke-Validator.ps1 -ConfigPath $env:CONFIG_PATH -WarningDays ([int]$env:WARNING_DAYS) -OutputFormat Json -CurrentDate '2026-03-01'

      - name: Enforce no expired secrets (gate)
        shell: pwsh
        run: |
          ./Invoke-Validator.ps1 -ConfigPath fixtures/all-ok-secrets.json -WarningDays ([int]$env:WARNING_DAYS) -OutputFormat Markdown -CurrentDate '2026-03-01' -FailOnExpired
