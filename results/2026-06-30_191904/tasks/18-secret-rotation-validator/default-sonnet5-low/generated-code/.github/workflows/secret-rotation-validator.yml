name: Secret Rotation Validator

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      warning_days:
        description: 'Days before expiry to start warning'
        required: false
        default: '14'

env:
  CONFIG_FILE: secrets-config.json
  WARNING_DAYS: ${{ github.event.inputs.warning_days || '14' }}

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest

      - name: Run test suite
        run: python3 -m pytest test_secret_rotation_validator.py -v

  validate:
    name: Validate secret rotation status
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure secrets config exists
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "No $CONFIG_FILE found, nothing to validate" >&2
            exit 1
          fi

      - name: Generate Markdown rotation report
        run: python3 secret_rotation_validator.py "$CONFIG_FILE" --warning-days "$WARNING_DAYS" --format markdown

      - name: Generate JSON rotation report
        run: python3 secret_rotation_validator.py "$CONFIG_FILE" --warning-days "$WARNING_DAYS" --format json

      - name: Check fail-on-expired exit code
        run: |
          set +e
          python3 secret_rotation_validator.py "$CONFIG_FILE" --warning-days "$WARNING_DAYS" --fail-on-expired --format json > /dev/null
          code=$?
          set -e
          echo "Exit code: $code"
