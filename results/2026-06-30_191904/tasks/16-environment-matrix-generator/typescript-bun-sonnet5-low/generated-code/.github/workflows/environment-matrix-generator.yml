name: Environment Matrix Generator

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  MATRIX_CONFIG_PATH: fixtures/sample-config.json

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun test

  generate-matrix:
    name: Generate build matrix
    needs: test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate matrix JSON
        id: generate
        run: |
          RESULT=$(bun run matrix-generator.ts "${MATRIX_CONFIG_PATH}")
          echo "Generated matrix:"
          echo "$RESULT"
          {
            echo "matrix<<EOF"
            echo "$RESULT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }}, node ${{ matrix.node }})
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix).matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show matrix entry
        run: echo "Running on os=${{ matrix.os }} node=${{ matrix.node }}"
