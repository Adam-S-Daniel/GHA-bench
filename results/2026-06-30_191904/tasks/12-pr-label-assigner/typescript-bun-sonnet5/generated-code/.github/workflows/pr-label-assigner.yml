name: PR Label Assigner

# push / pull_request cover the real-world triage use case (and let `act
# push` exercise the pipeline locally); workflow_dispatch allows an on-demand
# re-run against an arbitrary changed-files fixture; the weekly schedule is a
# safety net in case a triggering event was ever missed.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      files_path:
        description: "Path to a newline-delimited changed-files fixture"
        required: false
        default: "fixtures/changed-files.txt"
  schedule:
    - cron: "0 6 * * 1"

# Least-privilege: only reading the repo is required to compute labels.
# pull-requests: write is scoped in for the real "apply the labels" step,
# which a production version of this workflow would add via the GitHub API.
permissions:
  contents: read
  pull-requests: write

env:
  CONFIG_PATH: .github/labeler-config.json
  FILES_PATH: fixtures/changed-files.txt

jobs:
  assign-labels:
    name: Assign labels from changed files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run unit tests
        run: bun test src/

      - name: Compute labels from changed files
        id: labeler
        env:
          RESOLVED_FILES_PATH: ${{ github.event.inputs.files_path || env.FILES_PATH }}
        run: |
          set -euo pipefail
          echo "Using config: $CONFIG_PATH"
          echo "Using files:  $RESOLVED_FILES_PATH"
          bun run src/cli.ts --config "$CONFIG_PATH" --files "$RESOLVED_FILES_PATH" | tee cli-output.txt
          labels_line="$(grep '^LABELS=' cli-output.txt | tail -n1)"
          labels="${labels_line#LABELS=}"
          echo "labels=$labels" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        run: |
          {
            echo "## PR Label Assigner"
            echo ""
            echo "Computed labels: \`${{ steps.labeler.outputs.labels }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show final labels
        run: echo "Final labels => ${{ steps.labeler.outputs.labels }}"
