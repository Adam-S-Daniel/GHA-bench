name: PR Label Assigner

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      changed_files_path:
        description: 'Path to a JSON file listing changed files (for manual/testing runs)'
        required: false
        default: 'changed-files.json'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  LABEL_CONFIG_PATH: labels.config.json
  CHANGED_FILES_PATH: changed-files.json

jobs:
  assign-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure a changed-files fixture exists
        shell: pwsh
        run: |
          $path = "${{ github.event.inputs.changed_files_path || env.CHANGED_FILES_PATH }}"
          if (-not (Test-Path -LiteralPath $path)) {
            Write-Host "No changed-files fixture found at '$path'; using an empty list."
            '[]' | Set-Content -LiteralPath $path
          }
          "resolved_path=$path" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Compute labels
        id: labels
        shell: pwsh
        run: |
          ./Assign-Labels.ps1 -ChangedFilesPath "$env:resolved_path" -ConfigPath "$env:LABEL_CONFIG_PATH"

      - name: Show computed labels
        shell: pwsh
        env:
          COMPUTED_LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          Write-Host "Computed labels: $env:COMPUTED_LABELS"

      - name: Apply labels to the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = JSON.parse('${{ steps.labels.outputs.labels }}');
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels,
              });
            }
