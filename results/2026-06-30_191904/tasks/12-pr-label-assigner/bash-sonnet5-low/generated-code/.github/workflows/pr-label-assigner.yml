name: PR Label Assigner

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  RULES_FILE: rules.conf

jobs:
  test:
    name: Run label assigner test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bats-core and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Validate script syntax
        run: bash -n scripts/label_assigner.sh

      - name: Run shellcheck
        run: shellcheck scripts/label_assigner.sh

      - name: Run bats test suite
        run: bats tests/label_assigner.bats

  assign-labels:
    name: Assign labels to changed files
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute labels for mocked mixed change fixture
        id: labels
        run: |
          chmod +x scripts/label_assigner.sh
          RESULT=$(./scripts/label_assigner.sh --rules "$RULES_FILE" --files fixtures/mixed_change.txt --format json)
          echo "Computed labels: $RESULT"
          echo "labels=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Show assigned labels
        run: echo "Labels for this run - ${{ steps.labels.outputs.labels }}"
