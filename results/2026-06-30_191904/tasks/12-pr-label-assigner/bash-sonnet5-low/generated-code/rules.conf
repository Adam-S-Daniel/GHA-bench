# PR label assigner rule config.
# Format: priority|glob-pattern|label
# Lower priority number = higher precedence when labels are mutually exclusive
# (this script applies all matching labels, but priority controls ordering
# in the output and lets callers resolve conflicts if needed).
10|docs/**|documentation
10|**/*.md|documentation
20|src/api/**|api
30|**/*.test.*|tests
30|**/*_test.*|tests
30|test/**|tests
30|tests/**|tests
40|src/**|source
50|.github/workflows/**|ci
