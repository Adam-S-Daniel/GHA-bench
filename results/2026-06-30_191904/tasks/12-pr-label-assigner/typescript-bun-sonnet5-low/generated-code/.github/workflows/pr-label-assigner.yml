name: PR Label Assigner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      config_path:
        description: "Path to the label-rules config JSON to evaluate"
        required: false
        default: "fixtures/case1-docs.json"

permissions:
  contents: read
  pull-requests: write

env:
  CONFIG_PATH: ${{ inputs.config_path || 'fixtures/case1-docs.json' }}

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run bun test suite
        run: bun test labeler.test.ts

  assign-labels:
    name: Assign labels from changed files
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run label assigner script
        run: bun run app.ts "${CONFIG_PATH}"
