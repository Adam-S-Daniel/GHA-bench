name: PR Label Assigner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      changed-files-fixture:
        description: 'Fixture file (relative to fixtures/) listing mocked changed files'
        required: false
        default: 'changed-files-scenario.txt'

env:
  RULES_PATH: fixtures/label-rules.json
  CHANGED_FILES_FIXTURE: ${{ github.event.inputs.changed-files-fixture || 'changed-files-scenario.txt' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run Pester tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester test suite
        shell: pwsh
        run: |
          Invoke-Pester -Path ./tests -CI -Output Detailed

  assign-labels:
    name: Assign labels from mocked changed files
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute label set
        id: labels
        shell: pwsh
        run: |
          $changedFilesPath = Join-Path 'fixtures' $env:CHANGED_FILES_FIXTURE
          ./Invoke-LabelAssigner.ps1 -ChangedFilesPath $changedFilesPath -RulesPath $env:RULES_PATH

      - name: Show computed labels
        shell: pwsh
        run: |
          Write-Output "Computed labels: ${{ steps.labels.outputs.labels }}"
