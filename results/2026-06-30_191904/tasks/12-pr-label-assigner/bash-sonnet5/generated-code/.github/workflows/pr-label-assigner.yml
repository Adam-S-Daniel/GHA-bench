name: PR Label Assigner

# Computes the label set for a PR from its changed files using
# label-assigner.sh and a configurable rules file. Triggered on pushes and
# pull requests (the real-world use case) plus workflow_dispatch for manual
# / scripted runs (e.g. local testing with `act push`).
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      changed_files_path:
        description: "Path to the file listing changed paths, one per line"
        required: false
        default: "fixtures/changed-files.txt"
      rules_path:
        description: "Path to the label rules config"
        required: false
        default: "rules.conf"

permissions:
  contents: read
  pull-requests: write

env:
  # act push / a plain push event has no workflow_dispatch inputs, so these
  # fall back to the mocked fixture data committed in the repo.
  CHANGED_FILES_FILE: ${{ github.event.inputs.changed_files_path || 'fixtures/changed-files.txt' }}
  RULES_FILE: ${{ github.event.inputs.rules_path || 'rules.conf' }}

jobs:
  assign-labels:
    name: Assign PR Labels
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.labels.outputs.labels }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate rules and changed-files inputs exist
        run: |
          set -euo pipefail
          test -f "${RULES_FILE}" || { echo "::error::Rules file not found: ${RULES_FILE}"; exit 1; }
          test -f "${CHANGED_FILES_FILE}" || { echo "::error::Changed files list not found: ${CHANGED_FILES_FILE}"; exit 1; }

      - name: Compute labels
        id: labels
        run: |
          set -euo pipefail
          chmod +x ./label-assigner.sh
          LABELS_CSV="$(./label-assigner.sh --rules "${RULES_FILE}" --changed-files "${CHANGED_FILES_FILE}" --format csv)"
          echo "labels=${LABELS_CSV}" >> "$GITHUB_OUTPUT"
          echo "LABELS=${LABELS_CSV}"
          {
            echo "### PR Label Assigner Result"
            echo ""
            echo "Rules file: \`${RULES_FILE}\`"
            echo "Changed files: \`${CHANGED_FILES_FILE}\`"
            echo "Computed labels: \`${LABELS_CSV:-<none>}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Report Label Summary
    runs-on: ubuntu-latest
    needs: assign-labels
    steps:
      - name: Print final labels
        run: |
          echo "Final PR label set: ${{ needs.assign-labels.outputs.labels }}"
