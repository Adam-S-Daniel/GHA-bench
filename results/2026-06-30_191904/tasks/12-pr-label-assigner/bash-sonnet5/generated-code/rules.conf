# PR Label Assigner rule configuration.
#
# One rule per line, pipe-delimited:
#   priority|category|glob-pattern|label
#
# - priority: integer; higher wins when rules in the same category conflict.
# - category: rules sharing a category compete -- only the label(s) from the
#   highest-priority matching rule in that category are kept for a given
#   file. Use "-" for rules that should never suppress another rule (every
#   matching "-" rule always contributes its label).
# - glob-pattern: matched against the full relative file path. "**" matches
#   across directories (e.g. "docs/**"); a leading "**/" also matches zero
#   directories (e.g. "**/*.md" matches both "README.md" and "docs/x.md");
#   a plain "*" matches within a single path segment only.
# - label: the label applied when the pattern matches.
#
# Blank lines and lines starting with # are ignored.

100|docs|docs/**|documentation
100|docs|**/*.md|documentation
90|api|src/api/**|api
95|owner|src/legacy/critical/**|core-team
85|owner|src/legacy/**|legacy-team
80|tests|**/*.test.*|tests
80|tests|**/*_test.*|tests
70|source|src/**|code
60|ci|.github/**|ci
50|deps|package.json|dependencies
50|deps|**/requirements.txt|dependencies
