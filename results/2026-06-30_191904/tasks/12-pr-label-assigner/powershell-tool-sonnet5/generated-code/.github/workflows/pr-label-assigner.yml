name: PR Label Assigner

# push / schedule / workflow_dispatch exercise the tool end-to-end against a
# mocked changed-file fixture (this repo has no external PR to inspect in
# CI, so the fixture stands in for "files changed in the PR" per the task's
# testability requirement). pull_request is the real-world trigger: it
# reuses the same mocked-fixture path for the label computation but, unlike
# the other triggers, also applies the result to the live PR.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      changed_files_path:
        description: 'Path (relative to repo root) to a JSON array of changed file paths to label against'
        required: false
        default: 'changed-files.json'
        type: choice
        options:
          - changed-files.json
          - fixtures/case1-docs.json
          - fixtures/case2-api-and-tests.json
          - fixtures/case3-priority-conflict.json

permissions:
  contents: read
  pull-requests: write

env:
  RULES_PATH: label-rules.json

jobs:
  test:
    name: Run Pester test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed."
          }
          Write-Output "All $($result.PassedCount) Pester tests passed."

  assign-labels:
    name: Assign PR labels
    needs: test
    runs-on: ubuntu-latest
    env:
      CHANGED_FILES_PATH: ${{ github.event.inputs.changed_files_path || 'changed-files.json' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assign labels from changed files
        id: assign
        shell: pwsh
        run: |
          ./Assign-PrLabels.ps1 -ChangedFilesPath $env:CHANGED_FILES_PATH -RulesPath $env:RULES_PATH

      - name: Apply labels to the pull request
        if: github.event_name == 'pull_request' && steps.assign.outputs.labels != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABELS: ${{ steps.assign.outputs.labels }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --add-label "$LABELS"
