name: PR Label Assigner

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fixture:
        description: "Single fixture file to evaluate (optional; all fixtures run by default)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

env:
  RULES_FILE: rules.json

jobs:
  test-and-evaluate:
    name: Test and evaluate label rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests (red/green TDD suite)
        run: bun test

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Evaluate label rules against fixtures
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.fixture }}" ]; then
            fixtures="${{ github.event.inputs.fixture }}"
          else
            fixtures="fixtures/*.json"
          fi
          for f in $fixtures; do
            echo "=== Fixture: $f ==="
            bun run src/cli.ts "$f" "$RULES_FILE"
          done

  assign-labels:
    name: Assign labels to the pull request
    needs: test-and-evaluate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute changed files for this PR
        id: changed
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          git diff --name-only "origin/${{ github.event.pull_request.base.ref }}" "${{ github.sha }}" \
            | jq -R -s -c 'split("\n") | map(select(length > 0))' > changed-files.json
          cat changed-files.json

      - name: Compute labels
        id: labels
        run: |
          set -euo pipefail
          output=$(bun run src/cli.ts changed-files.json "$RULES_FILE")
          echo "$output"
          labels=$(echo "$output" | grep '^LABELS=' | sed 's/^LABELS=//')
          echo "labels=$labels" >> "$GITHUB_OUTPUT"

      - name: Apply labels via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const labels = JSON.parse('${{ steps.labels.outputs.labels }}');
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels,
              });
            }
