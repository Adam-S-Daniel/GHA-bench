# PR Label Assigner - rule configuration
# Format: priority,glob_pattern,label,group
#   priority : integer, higher number = higher priority
#   pattern  : glob pattern matched against each changed file path
#   label    : label to apply when pattern matches
#   group    : optional. Rules sharing a non-empty group are mutually
#              exclusive for a given file -- only the highest priority
#              matching rule in that group contributes its label.
#              Rules with an empty group are always additive.
100,docs/**,documentation,
90,src/api/**,api,
80,*.test.*,tests,
80,*.spec.*,tests,
70,*.md,documentation,
60,src/**,source,area
55,src/vendor/**,vendor,area
50,vendor/**,vendor,
