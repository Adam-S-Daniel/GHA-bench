name: PR Label Assigner

# Runs the bats test suite for the PR Label Assigner script, and then
# demonstrates the script itself against a mocked list of changed files.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RULES_FILE: fixtures/rules.conf

jobs:
  test:
    name: Run bats test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats shellcheck

      - name: Syntax check (bash -n)
        run: bash -n scripts/pr-label-assigner.sh

      - name: Lint (shellcheck)
        run: shellcheck scripts/pr-label-assigner.sh

      - name: Run bats tests
        run: bats tests/pr_label_assigner.bats

  assign-labels:
    name: Assign labels for mocked changed files
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Case basic: docs + api + tests + source labels"
        run: |
          echo "::group::case-basic"
          bash scripts/pr-label-assigner.sh \
            --files fixtures/changed_files_basic.txt \
            --rules "$RULES_FILE"
          echo "::endgroup::"

      - name: "Case basic: JSON output"
        run: |
          echo "::group::case-basic-json"
          bash scripts/pr-label-assigner.sh \
            --files fixtures/changed_files_basic.txt \
            --rules "$RULES_FILE" \
            --format json
          echo "::endgroup::"

      - name: "Case conflict: priority resolves group conflicts"
        run: |
          echo "::group::case-conflict"
          bash scripts/pr-label-assigner.sh \
            --files fixtures/changed_files_conflict.txt \
            --rules "$RULES_FILE"
          echo "::endgroup::"

      - name: "Case nomatch: no rules match any file"
        run: |
          echo "::group::case-nomatch"
          echo "labels-start"
          bash scripts/pr-label-assigner.sh \
            --files fixtures/changed_files_nomatch.txt \
            --rules "$RULES_FILE"
          echo "labels-end"
          echo "::endgroup::"

      - name: "Case empty: no changed files"
        run: |
          echo "::group::case-empty"
          echo "labels-start"
          bash scripts/pr-label-assigner.sh \
            --files fixtures/changed_files_empty.txt \
            --rules "$RULES_FILE"
          echo "labels-end"
          echo "::endgroup::"
