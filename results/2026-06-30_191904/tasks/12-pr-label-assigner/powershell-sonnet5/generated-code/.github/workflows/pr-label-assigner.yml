name: PR Label Assigner

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      fixture_path:
        description: 'Path to a changed-files fixture (one path per line) to label against'
        required: false
        default: 'changed-files.txt'

permissions:
  contents: read

env:
  RULES_PATH: rules.json
  CHANGED_FILES_FIXTURE: changed-files.txt

jobs:
  unit-tests:
    name: Run Pester unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pester 5 is available
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module -Name Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          # Scoped to the label-assignment logic tests. WorkflowStructure.Tests.ps1
          # validates the workflow file itself (YAML parse + actionlint) and needs
          # host-only tooling not present in this container; it is run locally as
          # part of workflow authoring/validation, not inside the CI job.
          Import-Module Pester -MinimumVersion 5.0 -Force
          $testFiles = @('./tests/PrLabelAssigner.Tests.ps1', './tests/InvokePrLabelAssigner.Tests.ps1')
          $result = Invoke-Pester -Path $testFiles -Output Detailed -PassThru
          Write-Host "Passed: $($result.PassedCount)  Failed: $($result.FailedCount)  Total: $($result.TotalCount)"
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed."
          }

  assign-labels:
    name: Compute and assign PR labels
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute labels from changed files
        id: labels
        shell: pwsh
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FIXTURE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.fixture_path || env.CHANGED_FILES_FIXTURE }}
        run: |
          ./Invoke-PrLabelAssigner.ps1 -RulesPath $env:RULES_PATH -FixturePath $env:FIXTURE_PATH -BaseRef $env:BASE_REF

      - name: Apply labels to the pull request
        if: github.event_name == 'pull_request' && steps.labels.outputs.labels != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELS_CSV: ${{ steps.labels.outputs.labels }}
        run: |
          $labels = @($env:LABELS_CSV -split ',' | Where-Object { $_ })
          foreach ($label in $labels) {
            gh label create $label --repo $env:GITHUB_REPOSITORY --description 'Auto-assigned by pr-label-assigner' --color 'ededed' --force
          }
          gh pr edit $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --add-label ($labels -join ',')
