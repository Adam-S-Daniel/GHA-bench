name: Artifact Cleanup Script

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no deletions performed)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      max_age_days:
        description: "Delete artifacts older than this many days"
        required: false
        default: "30"
        type: string
      keep_latest_n:
        description: "Keep this many of the most recent artifacts per workflow"
        required: false
        default: "3"
        type: string
      max_total_size_bytes:
        description: "Cap on combined retained artifact size, in bytes"
        required: false
        default: "209715200"
        type: string
      mock_data_fixture:
        description: "Named mock artifact fixture to run the plan against"
        required: false
        default: "baseline"
        type: string
  schedule:
    # Nightly cleanup run at 03:00 UTC.
    - cron: "0 3 * * *"

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

  cleanup:
    name: Run artifact cleanup plan
    needs: test
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '30' }}
      KEEP_LATEST_N: ${{ github.event.inputs.keep_latest_n || '3' }}
      MAX_TOTAL_SIZE_BYTES: ${{ github.event.inputs.max_total_size_bytes || '209715200' }}
      MOCK_DATA_FIXTURE: ${{ github.event.inputs.mock_data_fixture || 'baseline' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run cleanup plan
        run: bun run start
