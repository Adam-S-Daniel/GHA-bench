name: Artifact Cleanup Script

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no deletions performed)"
        required: false
        default: "true"
        type: string

permissions:
  contents: read

env:
  MAX_AGE_DAYS: "20"
  KEEP_LATEST_N_PER_WORKFLOW: "1"

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run unit tests
        run: python3 -m pytest tests/ -v

  cleanup-plan:
    name: Generate artifact cleanup plan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine dry-run flag
        id: dryrun
        env:
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "${DRY_RUN_INPUT}" = "false" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cleanup planner
        run: |
          python3 cli.py \
            --fixture fixtures/sample_artifacts.json \
            --now "2026-01-31T00:00:00+00:00" \
            --max-age-days "${MAX_AGE_DAYS}" \
            --keep-latest-n-per-workflow "${KEEP_LATEST_N_PER_WORKFLOW}" \
            ${{ steps.dryrun.outputs.flag }}
