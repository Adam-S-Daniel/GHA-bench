name: Artifact Cleanup Script

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no deletions)"
        required: false
        default: "true"
        type: string

permissions:
  contents: read
  actions: read

env:
  MAX_AGE_DAYS: "90"
  KEEP_LATEST_PER_WORKFLOW: "1"

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun test

  cleanup:
    name: Generate artifact cleanup plan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run cleanup plan (dry run)
        env:
          DRY_RUN: "${{ github.event.inputs.dry_run || 'true' }}"
        run: bun run src/index.ts
