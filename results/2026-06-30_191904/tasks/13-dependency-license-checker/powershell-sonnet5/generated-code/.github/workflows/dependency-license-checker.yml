name: Dependency License Checker

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  MANIFEST_PATH: package.json
  POLICY_PATH: license-policy.json
  LICENSE_DB_PATH: license-database.json

jobs:
  test:
    name: Run Pester test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester (if needed)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            Write-Error "Pester reported $($result.FailedCount) failing test(s)."
            exit 1
          }
          Write-Output "All $($result.PassedCount) Pester tests passed."

  compliance-report:
    name: Generate compliance report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dependency license compliance report
        shell: pwsh
        run: |
          ./Invoke-LicenseCheck.ps1 -ManifestPath $env:MANIFEST_PATH -PolicyPath $env:POLICY_PATH -LicenseDatabasePath $env:LICENSE_DB_PATH
