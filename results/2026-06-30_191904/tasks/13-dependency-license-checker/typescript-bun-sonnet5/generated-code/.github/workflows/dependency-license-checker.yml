name: Dependency License Checker

on:
  push:
  pull_request:
  schedule:
    # Weekly re-check, in case the allow/deny policy or lookup data drifts.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Path to the dependency manifest (defaults to fixtures/package.json or fixtures/requirements.txt)"
        required: false
        type: string
      config_path:
        description: "Path to the license allow/deny policy JSON (defaults to fixtures/license-policy.json)"
        required: false
        type: string
      lookup_path:
        description: "Path to the mock license lookup JSON (defaults to fixtures/license-data.json)"
        required: false
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      # Only the script's own unit tests run here. workflowStructure.test.ts
      # (needs actionlint) and actPipeline.test.ts (needs act + Docker-in-Docker)
      # are host-side meta-tests that validate this pipeline from the outside;
      # they don't belong inside the pipeline itself.
      - name: Run unit tests
        run: |
          bun test \
            tests/manifestParser.test.ts \
            tests/licenseLookup.test.ts \
            tests/classify.test.ts \
            tests/report.test.ts \
            tests/config.test.ts \
            tests/resolveManifest.test.ts \
            tests/cli.test.ts

  license-check:
    name: Generate compliance report
    runs-on: ubuntu-latest
    needs: test
    env:
      MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
      CONFIG_PATH: ${{ github.event.inputs.config_path }}
      LOOKUP_PATH: ${{ github.event.inputs.lookup_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Generate license compliance report
        run: |
          if [ -n "$MANIFEST_PATH" ] || [ -n "$CONFIG_PATH" ] || [ -n "$LOOKUP_PATH" ]; then
            args=()
            [ -n "$MANIFEST_PATH" ] && args+=(--manifest "$MANIFEST_PATH")
            [ -n "$CONFIG_PATH" ] && args+=(--config "$CONFIG_PATH")
            [ -n "$LOOKUP_PATH" ] && args+=(--lookup "$LOOKUP_PATH")
            bun run src/cli.ts "${args[@]}"
          else
            echo "== npm manifest scenario =="
            bun run src/cli.ts \
              --manifest fixtures/package.json \
              --config fixtures/license-policy.json \
              --lookup fixtures/license-data.json
            echo "== Python requirements.txt manifest scenario =="
            bun run src/cli.ts \
              --manifest fixtures/scenario-python/requirements.txt \
              --config fixtures/scenario-python/license-policy.json \
              --lookup fixtures/scenario-python/license-data.json
          fi
