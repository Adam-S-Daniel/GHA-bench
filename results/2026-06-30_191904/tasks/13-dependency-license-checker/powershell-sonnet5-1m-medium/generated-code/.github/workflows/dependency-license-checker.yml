name: Dependency License Checker

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  MANIFEST_PATH: fixtures/manifest.json
  CONFIG_PATH: fixtures/license-config.json
  DATABASE_PATH: fixtures/license-database.json

jobs:
  test:
    name: Unit tests (Pester)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pester is available
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./tests -CI -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed."
          }

  check-licenses:
    name: Generate compliance report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run dependency license check
        shell: pwsh
        run: |
          ./Invoke-LicenseCheck.ps1 `
            -ManifestPath $env:MANIFEST_PATH `
            -ConfigPath $env:CONFIG_PATH `
            -DatabasePath $env:DATABASE_PATH
