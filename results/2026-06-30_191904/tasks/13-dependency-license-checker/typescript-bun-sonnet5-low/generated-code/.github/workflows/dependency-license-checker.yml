name: Dependency License Checker

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  LICENSE_CONFIG_PATH: fixtures/license-config.json
  MANIFEST_PATH: fixtures/sample-package.json

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

  check-licenses:
    name: Check dependency licenses
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate license compliance report
        # continue-on-error: a denied-license finding is a report outcome, not a
        # pipeline error, so it must not fail the job -- only genuine script
        # errors (bad manifest/config) should do that.
        continue-on-error: true
        run: bun run cli.ts "$MANIFEST_PATH" "$LICENSE_CONFIG_PATH"
