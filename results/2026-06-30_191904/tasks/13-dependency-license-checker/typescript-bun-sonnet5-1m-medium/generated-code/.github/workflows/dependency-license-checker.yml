name: Dependency License Checker

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"
  MANIFEST_FILE: fixtures/current-manifest.json
  POLICY_FILE: fixtures/license-policy.json
  LICENSE_DB_FILE: fixtures/license-db.json

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bun test

  compliance-check:
    name: License compliance check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dependency license compliance report
        id: check
        run: |
          set +e
          bun run app.ts \
            --manifest "$MANIFEST_FILE" \
            --policy "$POLICY_FILE" \
            --license-db "$LICENSE_DB_FILE" \
            --format text | tee compliance-report.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::Dependency license compliance check found one or more denied licenses (exit code $EXIT_CODE)"
          fi
          exit 0

      - name: Publish report to job summary
        run: cat compliance-report.txt >> "$GITHUB_STEP_SUMMARY"
