name: Semantic Version Bumper

# Triggers: run the bump on every push (e.g. after a merge to main) and on
# pull requests as a dry-run check, plus allow manual/scheduled runs.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  VERSION_FILE: VERSION
  COMMITS_FILE: commits.txt
  CHANGELOG_FILE: CHANGELOG.md

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats-core
        run: npm install -g bats

      - name: Syntax check bump-version.sh
        run: bash -n bump-version.sh

      - name: Run bats unit tests
        run: bats test/version_bumper.bats

  bump:
    name: Bump version
    runs-on: ubuntu-latest
    needs: test
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show fixture inputs
        run: |
          echo "Version file (${VERSION_FILE}):"
          cat "${VERSION_FILE}"
          echo "Commits file (${COMMITS_FILE}):"
          cat "${COMMITS_FILE}"

      - name: Run semantic version bumper
        id: bump
        run: |
          set +e
          new_version=$(./bump-version.sh --version-file "${VERSION_FILE}" --commits-file "${COMMITS_FILE}" --changelog "${CHANGELOG_FILE}")
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Bumped to: $new_version"
            echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "No releasable commits found; version unchanged."
            current_version=$(cat "${VERSION_FILE}")
            echo "new_version=$current_version" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write job summary
        run: |
          {
            echo "### Semantic Version Bumper"
            echo ""
            echo "- New version: \`${{ steps.bump.outputs.new_version }}\`"
            echo "- Bumped: \`${{ steps.bump.outputs.bumped }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
