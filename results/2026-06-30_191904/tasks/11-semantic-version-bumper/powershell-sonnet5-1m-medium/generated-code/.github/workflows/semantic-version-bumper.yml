name: Semantic Version Bumper

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_date:
        description: 'Date to stamp the changelog entry with (YYYY-MM-DD)'
        required: false
        default: '2026-07-01'

permissions:
  contents: read

env:
  CHANGELOG_PATH: CHANGELOG.md
  VERSION_FILE_PATH: version.json
  COMMIT_LOG_PATH: commits.txt

jobs:
  test:
    name: Run Pester unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Pester test suite
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./tests -CI -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed."
          }

  bump-version:
    name: Bump semantic version
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release date
        id: release_date
        shell: pwsh
        run: |
          $releaseDate = "${{ github.event.inputs.release_date }}"
          if ([string]::IsNullOrWhiteSpace($releaseDate)) {
            $releaseDate = '2026-07-01'
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "date=$releaseDate"

      - name: Run semantic version bump
        shell: pwsh
        run: |
          ./scripts/Bump-Version.ps1 `
            -VersionFilePath $env:VERSION_FILE_PATH `
            -CommitLogPath $env:COMMIT_LOG_PATH `
            -ChangelogPath $env:CHANGELOG_PATH `
            -Date '${{ steps.release_date.outputs.date }}'

      - name: Show updated changelog
        shell: pwsh
        run: Get-Content -Path $env:CHANGELOG_PATH -Raw
