name: Test Results Aggregator

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  unit-tests:
    name: Run aggregator unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pytest

      - name: Run unit tests
        run: python3 -m pytest tests/ -v

  aggregate-results:
    name: Aggregate matrix test results
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run aggregator on fixture data
        id: aggregate
        continue-on-error: true
        run: |
          python3 aggregator.py \
            fixtures/junit/run1.xml \
            fixtures/junit/run2.xml \
            fixtures/json/run3.json \
            --output summary.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Print summary to log
        run: cat summary.md
