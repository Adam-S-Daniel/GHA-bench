name: Test Results Aggregator

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  RESULTS_DIR: test-results

jobs:
  aggregate:
    name: Aggregate Test Results
    runs-on: ubuntu-latest
    outputs:
      total: ${{ steps.aggregate.outputs.total }}
      passed: ${{ steps.aggregate.outputs.passed }}
      failed: ${{ steps.aggregate.outputs.failed }}
      skipped: ${{ steps.aggregate.outputs.skipped }}
      flaky: ${{ steps.aggregate.outputs.flaky }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        # workflow-structure.test.ts and act-harness.test.ts are excluded here: they
        # shell out to actionlint/act, which are host dev-tooling, not present in this
        # container. They are run locally/in dev to validate this workflow file itself.
        run: |
          bun test \
            tests/junit-parser.test.ts \
            tests/json-parser.test.ts \
            tests/aggregator.test.ts \
            tests/markdown.test.ts \
            tests/cli.test.ts

      - name: Aggregate results and write job summary
        id: aggregate
        run: |
          bun run src/aggregate.ts "$RESULTS_DIR" --summary-out "$GITHUB_STEP_SUMMARY" | tee /tmp/aggregate-output.txt
          {
            echo "total=$(awk -F': ' '/^Total Tests/{print $2}' /tmp/aggregate-output.txt)"
            echo "passed=$(awk -F': ' '/^Passed/{print $2}' /tmp/aggregate-output.txt)"
            echo "failed=$(awk -F': ' '/^Failed/{print $2}' /tmp/aggregate-output.txt)"
            echo "skipped=$(awk -F': ' '/^Skipped/{print $2}' /tmp/aggregate-output.txt)"
            echo "flaky=$(awk -F': ' '/^Flaky Tests/{print $2}' /tmp/aggregate-output.txt)"
          } >> "$GITHUB_OUTPUT"

  report:
    name: Report Aggregate Summary
    needs: aggregate
    runs-on: ubuntu-latest
    steps:
      - name: Print summary
        env:
          TOTAL: ${{ needs.aggregate.outputs.total }}
          PASSED: ${{ needs.aggregate.outputs.passed }}
          FAILED: ${{ needs.aggregate.outputs.failed }}
          SKIPPED: ${{ needs.aggregate.outputs.skipped }}
          FLAKY: ${{ needs.aggregate.outputs.flaky }}
        run: |
          echo "Aggregated $TOTAL tests: $PASSED passed, $FAILED failed, $SKIPPED skipped, $FLAKY flaky."
