name: Test Results Aggregator

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  RESULTS_PATH: fixtures/matrix

jobs:
  unit-tests:
    name: Run Pester unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./Tests/TestResultsAggregator.Tests.ps1 -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed"
          }

  aggregate:
    name: Aggregate test results
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aggregate fixture test results and write job summary
        id: aggregate
        shell: pwsh
        # This step reports on the (intentionally mixed pass/fail) fixture data
        # that simulates a matrix build, so it is allowed to "fail" the
        # aggregate exit code without failing the CI job -- it is a reporting
        # step, not the actual test execution.
        continue-on-error: true
        run: |
          ./TestResultsAggregator.ps1 -ResultsPath $env:RESULTS_PATH -OutputPath $env:GITHUB_STEP_SUMMARY

      - name: Report aggregation outcome
        shell: pwsh
        run: |
          Write-Host "Aggregation step outcome: ${{ steps.aggregate.outcome }}"
