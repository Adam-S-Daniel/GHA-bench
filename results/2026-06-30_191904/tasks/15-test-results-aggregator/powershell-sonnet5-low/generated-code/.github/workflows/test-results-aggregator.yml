name: Test Results Aggregator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  FIXTURES_PATH: fixtures

jobs:
  unit-tests:
    name: Run Pester unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          Invoke-Pester -Path tests/Aggregator.Tests.ps1 -Output Detailed -CI

  aggregate:
    name: Aggregate test results
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Aggregate test result fixtures
        shell: pwsh
        run: |
          ./Invoke-Aggregation.ps1 -FixturesPath $env:FIXTURES_PATH
