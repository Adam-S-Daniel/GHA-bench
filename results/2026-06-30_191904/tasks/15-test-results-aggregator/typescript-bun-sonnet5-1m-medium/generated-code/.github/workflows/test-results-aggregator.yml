name: Test Results Aggregator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  RESULTS_DIR: fixtures

jobs:
  aggregate:
    name: Aggregate test results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Aggregate test results and write job summary
        run: bun run src/aggregator.ts "$RESULTS_DIR"

  verify-summary:
    name: Verify aggregation ran
    needs: aggregate
    runs-on: ubuntu-latest
    steps:
      - name: Report success
        run: echo "Aggregation job completed successfully"
