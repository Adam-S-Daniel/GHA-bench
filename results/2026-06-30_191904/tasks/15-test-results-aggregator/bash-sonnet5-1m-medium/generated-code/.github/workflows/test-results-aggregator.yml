name: Test Results Aggregator

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: '1.7.7'

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (bats, actionlint)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats python3-yaml
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xzf - -C /usr/local/bin actionlint

      - name: Run unit tests
        run: bats tests/aggregator.bats tests/workflow-structure.bats

      - name: Lint this workflow
        run: actionlint .github/workflows/test-results-aggregator.yml

  aggregate:
    name: Aggregate matrix test results
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aggregate matrix fixtures
        run: |
          echo "=== AGGREGATOR OUTPUT START ==="
          bash test-results-aggregator.sh \
            fixtures/junit-ubuntu.xml \
            fixtures/junit-windows.xml \
            fixtures/results-macos.json
          echo "=== AGGREGATOR OUTPUT END ==="

      - name: Write job summary
        run: |
          bash test-results-aggregator.sh \
            fixtures/junit-ubuntu.xml \
            fixtures/junit-windows.xml \
            fixtures/results-macos.json >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
