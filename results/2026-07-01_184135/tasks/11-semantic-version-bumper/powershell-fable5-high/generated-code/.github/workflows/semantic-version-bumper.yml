# Semantic Version Bumper pipeline.
#
# 1. `test` job: runs the Pester unit test suite for the bumper module/CLI.
# 2. `bump` job (after tests pass): reads the current version from VERSION,
#    classifies the conventional commits in commit-log.txt, updates the
#    version file, prepends a CHANGELOG.md entry, and prints
#    "NEW_VERSION=<x.y.z>" so callers (and the act test harness) can
#    assert the exact result.
#
# Workflow-level tests: tests/workflow (structure + actionlint) and
# tests/integration (runs this workflow through `act push`).
name: Semantic Version Bumper

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Default inputs; the act test harness overwrites these files per case.
  VERSION_FILE: VERSION
  COMMIT_LOG_FILE: commit-log.txt
  CHANGELOG_FILE: CHANGELOG.md

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          # Only tests/unit here: workflow/integration tests need
          # actionlint + Docker, which the CI container doesn't have.
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/unit'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  bump:
    name: Bump version
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine and apply version bump
        id: bump
        shell: pwsh
        run: |
          $new = ./src/Invoke-VersionBump.ps1 `
            -VersionFile $env:VERSION_FILE `
            -CommitLogFile $env:COMMIT_LOG_FILE `
            -ChangelogFile $env:CHANGELOG_FILE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Exact, machine-checkable contract line for the act harness.
          Write-Output "NEW_VERSION=$new"
          "new-version=$new" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Show updated artifacts
        shell: pwsh
        run: |
          Write-Output "Version file ($env:VERSION_FILE) now contains:"
          Get-Content $env:VERSION_FILE
          if (Test-Path $env:CHANGELOG_FILE) {
            Write-Output '--- CHANGELOG.md ---'
            Get-Content $env:CHANGELOG_FILE
          } else {
            Write-Output 'No changelog generated (no release-worthy commits).'
          }
