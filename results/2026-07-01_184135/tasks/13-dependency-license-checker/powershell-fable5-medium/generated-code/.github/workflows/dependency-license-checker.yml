name: Dependency License Checker

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly compliance sweep (Mondays 06:00 UTC)
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  # Directory containing the manifest(s) to audit. Test harness repos commit
  # their fixture manifests here; override per-run if needed.
  MANIFEST_DIR: test-input
  CONFIG_PATH: config/license-config.json
  LICENSE_DB_PATH: fixtures/mock-licenses.json

jobs:
  unit-tests:
    name: Pester unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path tests/LicenseChecker.Tests.ps1 -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) {
            throw "Pester: $($result.FailedCount) test(s) failed."
          }
          Write-Host "PESTER|Passed=$($result.PassedCount)|Failed=$($result.FailedCount)"

  license-check:
    name: License compliance report
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate compliance report
        shell: pwsh
        run: |
          # Report-only mode: denied licenses are listed but do not fail the
          # build here; gating happens in a separate policy step if desired.
          ./scripts/Invoke-LicenseCheck.ps1 `
            -Path $env:MANIFEST_DIR `
            -ConfigPath $env:CONFIG_PATH `
            -LicenseDatabasePath $env:LICENSE_DB_PATH
