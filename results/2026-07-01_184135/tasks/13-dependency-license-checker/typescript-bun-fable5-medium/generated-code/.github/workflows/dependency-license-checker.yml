name: Dependency License Checker

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly compliance sweep (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  LICENSE_CONFIG: fixtures/license-config.json
  LICENSE_DB: fixtures/license-db.json

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

  compliance:
    name: License compliance report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate compliance report
        run: |
          shopt -s nullglob
          found=0
          for manifest in fixtures/manifests/*; do
            found=1
            echo "=== Checking $manifest ==="
            bun run src/cli.ts \
              --manifest "$manifest" \
              --config "$LICENSE_CONFIG" \
              --licenses "$LICENSE_DB"
          done
          if [ "$found" -eq 0 ]; then
            echo "No manifests found under fixtures/manifests" >&2
            exit 1
          fi
