# Test Results Aggregator pipeline.
#
# Job 1 (unit-tests): installs Bun + actionlint, runs the full bun test suite
#   (parsers, aggregation, markdown, workflow-structure tests).
# Job 2 (aggregate):  depends on job 1; runs the aggregator CLI over the test
#   result files (a `results/` directory when present — as produced by matrix
#   jobs / the act harness — falling back to the bundled fixtures/case1
#   samples) and publishes a markdown job summary.
name: Test Results Aggregator

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_INSTALL: /usr/local
  DEFAULT_RESULTS_DIR: fixtures/case1

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Install actionlint (needed by workflow-structure tests)
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- 1.7.7 /usr/local/bin

      - name: Run unit tests with bun test
        run: bun test

  aggregate:
    name: Aggregate test results
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Aggregate results and publish job summary
        run: |
          # Matrix jobs (or the act test harness) drop result files into
          # results/; fall back to the bundled sample fixtures otherwise.
          if [ -d results ]; then
            RESULTS_DIR=results
          else
            RESULTS_DIR="$DEFAULT_RESULTS_DIR"
          fi
          echo "Aggregating test results from: $RESULTS_DIR"
          bun run src/cli.ts "$RESULTS_DIR" --out summary.md

      - name: Show generated summary artifact
        run: cat summary.md
