# Test Results Aggregator pipeline
#
# Job 1 (bats-tests): installs test dependencies and runs the full bats
#   suite (unit tests for the aggregator + structure tests for this very
#   workflow, including an actionlint check).
# Job 2 (aggregate): depends on job 1; runs the aggregator over the
#   matrix result files in $RESULTS_DIR (falling back to the bundled
#   fixtures when a caller has not provided any) and publishes the
#   markdown summary to the job summary.
name: Test Results Aggregator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Directory containing the *.xml / *.json result files to aggregate.
  # CI callers (and the act test harness) drop per-run result files here.
  RESULTS_DIR: test-results

jobs:
  bats-tests:
    name: Bats test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies (bats, actionlint, PyYAML)
        run: |
          npm install -g bats
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          sudo mv ./actionlint /usr/local/bin/actionlint
          sudo apt-get update -q
          sudo apt-get install -y -q python3-yaml
          bats --version
          actionlint --version

      - name: Syntax-check scripts
        run: |
          bash -n aggregate-test-results.sh
          bash -n run_act_tests.sh

      - name: Run bats test suite
        run: bats tests/

  aggregate:
    name: Aggregate matrix results
    runs-on: ubuntu-latest
    needs: bats-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Aggregate test results
        run: |
          dir="$RESULTS_DIR"
          if [ ! -d "$dir" ]; then
            echo "No '$dir' directory in this checkout; using bundled fixtures." >&2
            dir="fixtures/matrix-flaky"
          fi
          ./aggregate-test-results.sh -o summary.md "$dir"

      - name: Publish job summary
        run: |
          echo "=== AGGREGATED SUMMARY START ==="
          cat summary.md
          echo "=== AGGREGATED SUMMARY END ==="
          # GITHUB_STEP_SUMMARY is set both on github.com and under act.
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
