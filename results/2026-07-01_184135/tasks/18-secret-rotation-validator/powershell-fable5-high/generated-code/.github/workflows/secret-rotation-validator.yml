name: Secret Rotation Validator

on:
  push:
  pull_request:
  schedule:
    # Weekday mornings: catch secrets drifting toward expiry.
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      warning-window-days:
        description: 'Warning window in days (-1 = use the config file value)'
        required: false
        default: '-1'

permissions:
  contents: read

env:
  # Config evaluated by the report job. The act test harness swaps this
  # file's contents per test case.
  CONFIG_PATH: fixtures/ci-case.json
  # Fixed evaluation date so CI output is deterministic and assertable.
  AS_OF_DATE: '2026-01-15'
  WARNING_WINDOW_DAYS: ${{ github.event.inputs.warning-window-days || '-1' }}

jobs:
  test:
    name: Pester tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Pester test suite
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  report:
    name: Rotation report
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate markdown rotation report
        shell: pwsh
        run: |
          ./Invoke-SecretRotationValidator.ps1 `
            -ConfigPath $env:CONFIG_PATH `
            -AsOfDate $env:AS_OF_DATE `
            -WarningWindowDays ([int]$env:WARNING_WINDOW_DAYS) `
            -Format Markdown

      - name: Generate JSON rotation report
        shell: pwsh
        run: |
          ./Invoke-SecretRotationValidator.ps1 `
            -ConfigPath $env:CONFIG_PATH `
            -AsOfDate $env:AS_OF_DATE `
            -WarningWindowDays ([int]$env:WARNING_WINDOW_DAYS) `
            -Format Json

      - name: Publish report to job summary
        shell: pwsh
        run: |
          # GITHUB_STEP_SUMMARY is set on real runners and in act; the guard
          # keeps the step safe anywhere it is not.
          if ($env:GITHUB_STEP_SUMMARY) {
            ./Invoke-SecretRotationValidator.ps1 `
              -ConfigPath $env:CONFIG_PATH `
              -AsOfDate $env:AS_OF_DATE `
              -WarningWindowDays ([int]$env:WARNING_WINDOW_DAYS) `
              -Format Markdown | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
