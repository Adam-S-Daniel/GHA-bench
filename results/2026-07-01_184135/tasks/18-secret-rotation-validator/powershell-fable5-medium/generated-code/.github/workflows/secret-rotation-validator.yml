# Secret Rotation Validator pipeline
#
# Runs the Pester unit tests, then generates the rotation report from the
# checked-in secrets config in both markdown and JSON formats. REFERENCE_DATE
# is pinned so report output is deterministic and assertable by the act-based
# test harness; drop the env var (or set it to '') for real wall-clock runs.
name: Secret Rotation Validator

on:
  push:
  pull_request:
  schedule:
    # Weekly rotation audit, Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      warning-window:
        description: Warning window in days
        required: false
        default: '14'

permissions:
  contents: read

env:
  # Overridable per environment (act: --var SECRETS_CONFIG=...) so test
  # harnesses can point the report at a different fixture without touching
  # the files the unit tests depend on.
  SECRETS_CONFIG: ${{ vars.SECRETS_CONFIG || 'fixtures/secrets.json' }}
  WARNING_WINDOW_DAYS: ${{ github.event.inputs.warning-window || '14' }}
  REFERENCE_DATE: '2026-07-01'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure Pester is available
        shell: pwsh
        run: |
          # Pre-installed on GitHub runners and in the act image; install only
          # if missing so the workflow also works on vanilla containers.
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Get-Module -ListAvailable -Name Pester | Select-Object Name, Version

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/SecretRotationValidator.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  report:
    name: Rotation report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate markdown report
        shell: pwsh
        run: |
          $md = ./SecretRotationValidator.ps1 `
            -ConfigPath $env:SECRETS_CONFIG `
            -WarningWindowDays ([int]$env:WARNING_WINDOW_DAYS) `
            -ReferenceDate $env:REFERENCE_DATE `
            -Format markdown | Out-String
          Write-Output $md
          # Publish to the job summary when the runner provides one.
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $md
          }

      - name: Generate JSON report and urgency summary
        shell: pwsh
        run: |
          $json = ./SecretRotationValidator.ps1 `
            -ConfigPath $env:SECRETS_CONFIG `
            -WarningWindowDays ([int]$env:WARNING_WINDOW_DAYS) `
            -ReferenceDate $env:REFERENCE_DATE `
            -Format json | Out-String
          Write-Output $json
          $report = $json | ConvertFrom-Json
          # Stable single-line summary that the act test harness asserts on.
          Write-Output "ROTATION-SUMMARY expired=$($report.summary.expired) warning=$($report.summary.warning) ok=$($report.summary.ok) total=$($report.summary.total)"
