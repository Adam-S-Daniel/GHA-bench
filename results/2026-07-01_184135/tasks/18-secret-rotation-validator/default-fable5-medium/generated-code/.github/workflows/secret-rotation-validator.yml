# CI pipeline for the secret rotation validator.
#
# Two jobs:
#   test   - runs the unit test suite (red/green TDD suite)
#   report - depends on test; runs the validator against the checked-in
#            fixture config and emits markdown + JSON reports plus a
#            machine-parseable SUMMARY line the act test harness asserts on.
#
# Uses only python3 stdlib, which is present on GitHub ubuntu runners and
# in the act container — no dependency install step is needed.
name: Secret Rotation Validator

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly rotation audit, Mondays 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  # The act test harness swaps this file per test case.
  CONFIG_FILE: fixtures/secrets.json
  WARN_DAYS: '14'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Python version
        run: python3 --version

      - name: Run unit tests
        run: python3 -m unittest -v test_secret_rotation_validator

  report:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate markdown report
        run: |
          python3 secret_rotation_validator.py \
            --config "$CONFIG_FILE" \
            --warn-days "$WARN_DAYS" \
            --format markdown

      - name: Generate JSON report
        run: |
          python3 secret_rotation_validator.py \
            --config "$CONFIG_FILE" \
            --warn-days "$WARN_DAYS" \
            --format json | tee rotation-report.json

      - name: Emit summary line
        run: |
          python3 - <<'EOF'
          import json
          with open("rotation-report.json", encoding="utf-8") as f:
              report = json.load(f)
          s = report["summary"]
          print(f"SUMMARY expired={s['expired']} warning={s['warning']} "
                f"ok={s['ok']} total={s['total']}")
          for group in ("expired", "warning"):
              for secret in report[group]:
                  print(f"NOTIFY [{group.upper()}] {secret['name']} "
                        f"(expires {secret['expiry_date']}, "
                        f"needed by: {', '.join(secret['required_by'])})")
          EOF
