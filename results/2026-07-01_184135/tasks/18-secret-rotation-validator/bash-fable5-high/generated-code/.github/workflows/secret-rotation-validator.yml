# Secret rotation validation pipeline.
#
# Two jobs:
#   test   - installs bats/pyyaml/actionlint and runs the full bats suite
#            (script behaviour tests + workflow structure tests).
#   report - depends on test; runs the validator against config/secrets.json,
#            publishes a markdown report to the step summary, and emits
#            NOTIFY[...] / SUMMARY lines grouped by urgency that downstream
#            tooling (and the act test harness) can assert on exactly.
#
# REFERENCE_DATE pins the clock so the report on the mock data is
# deterministic; WARN_DAYS is overridable from workflow_dispatch.
name: Secret Rotation Validator

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      warn_days:
        description: Warning window in days
        required: false
        default: '14'

permissions:
  contents: read

env:
  REFERENCE_DATE: '2026-07-01'
  WARN_DAYS: ${{ github.event.inputs.warn_days || '14' }}

jobs:
  test:
    name: Unit and workflow tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies (bats, pyyaml, actionlint)
        run: |
          npm install -g bats
          python3 -m pip install --quiet pyyaml \
            || python3 -m pip install --quiet --break-system-packages pyyaml
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          mkdir -p "$HOME/.local/bin"
          mv ./actionlint "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint the validator script
        run: bash -n ./secret-rotation-validator.sh

      - name: Run bats test suite
        run: bats tests

  report:
    name: Rotation report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate markdown rotation report
        run: |
          ./secret-rotation-validator.sh \
            --config config/secrets.json \
            --now "$REFERENCE_DATE" \
            --warn-days "$WARN_DAYS" \
            --format markdown | tee rotation-report.md
          cat rotation-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate JSON report and urgency notifications
        run: |
          ./secret-rotation-validator.sh \
            --config config/secrets.json \
            --now "$REFERENCE_DATE" \
            --warn-days "$WARN_DAYS" \
            --format json > rotation-report.json

          # Notifications grouped by urgency, one stable greppable line per
          # secret, most urgent group first.
          jq -r '
            (.secrets.expired[]
              | "NOTIFY[expired] \(.name) expires_on=\(.expires_on) days_left=\(.days_left) required_by=\(.required_by | join(","))"),
            (.secrets.warning[]
              | "NOTIFY[warning] \(.name) expires_on=\(.expires_on) days_left=\(.days_left) required_by=\(.required_by | join(","))"),
            (.secrets.ok[]
              | "NOTIFY[ok] \(.name) expires_on=\(.expires_on) days_left=\(.days_left) required_by=\(.required_by | join(","))")
          ' rotation-report.json

          jq -r '"SUMMARY expired=\(.summary.expired) warning=\(.summary.warning) ok=\(.summary.ok) total=\(.summary.total)"' \
            rotation-report.json
