# Secret Rotation Validator pipeline.
#
# Two jobs:
#   1. test      -- run the unit test suite (red/green TDD suite).
#   2. validate  -- depends on test; generates the rotation report from
#                   fixtures/secrets.json in both markdown and JSON, emits a
#                   machine-parseable summary line, and proves the CLI fails
#                   gracefully on a broken config.
#
# Test parameters (AS_OF / WARN_DAYS) come from fixtures/case.env so CI runs
# are deterministic; a real deployment would drop that file and let the
# script default to today's date. A workflow_dispatch input can override the
# warning window for ad-hoc runs.
name: Secret Rotation Validator

on:
  push:
  pull_request:
  schedule:
    # Every weekday at 06:00 UTC so expiring secrets are flagged early.
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      warn_days:
        description: 'Warning window in days (overrides fixtures/case.env)'
        required: false
        default: ''

# Read-only: the pipeline only reports; it never mutates the repository.
permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: python3 --version

      - name: Run unit tests
        run: python3 -m unittest tests.test_secret_rotation_validator -v

  validate:
    name: Rotation report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load case parameters
        # workflow_dispatch input (if any) wins over the checked-in defaults.
        env:
          DISPATCH_WARN_DAYS: ${{ inputs.warn_days || '' }}
        run: |
          if [ -f fixtures/case.env ]; then
            cat fixtures/case.env >> "$GITHUB_ENV"
          fi
          if [ -n "$DISPATCH_WARN_DAYS" ]; then
            echo "WARN_DAYS=$DISPATCH_WARN_DAYS" >> "$GITHUB_ENV"
          fi

      - name: Generate markdown report
        run: |
          ARGS=(--config fixtures/secrets.json --warn-days "${WARN_DAYS:-14}")
          if [ -n "${AS_OF:-}" ]; then ARGS+=(--as-of "$AS_OF"); fi
          echo "---BEGIN MARKDOWN REPORT---"
          python3 secret_rotation_validator.py "${ARGS[@]}" --format markdown
          echo "---END MARKDOWN REPORT---"

      - name: Generate JSON report
        run: |
          ARGS=(--config fixtures/secrets.json --warn-days "${WARN_DAYS:-14}")
          if [ -n "${AS_OF:-}" ]; then ARGS+=(--as-of "$AS_OF"); fi
          echo "---BEGIN JSON REPORT---"
          python3 secret_rotation_validator.py "${ARGS[@]}" --format json
          echo "---END JSON REPORT---"

      - name: Emit summary line
        # One grep-friendly line the act harness asserts exact values on.
        run: |
          ARGS=(--config fixtures/secrets.json --warn-days "${WARN_DAYS:-14}")
          if [ -n "${AS_OF:-}" ]; then ARGS+=(--as-of "$AS_OF"); fi
          python3 secret_rotation_validator.py "${ARGS[@]}" --format json \
            | python3 -c 'import json,sys; s = json.load(sys.stdin)["summary"]; print("ROTATION_SUMMARY: expired={expired} warning={warning} ok={ok}".format(**s))'

      - name: Verify graceful error handling
        # The CLI must reject a broken config with exit code 1 and a
        # meaningful message -- not a traceback.
        run: |
          set +e
          ERR=$(python3 secret_rotation_validator.py --config fixtures/invalid.json 2>&1 >/dev/null)
          CODE=$?
          set -e
          echo "exit code: $CODE"
          echo "stderr: $ERR"
          if [ "$CODE" -ne 1 ]; then
            echo "FAIL: expected exit code 1 for invalid config, got $CODE"
            exit 1
          fi
          if ! printf '%s' "$ERR" | grep -q "error: Invalid JSON"; then
            echo "FAIL: expected 'error: Invalid JSON' message"
            exit 1
          fi
          echo "ERROR_HANDLING_OK"
