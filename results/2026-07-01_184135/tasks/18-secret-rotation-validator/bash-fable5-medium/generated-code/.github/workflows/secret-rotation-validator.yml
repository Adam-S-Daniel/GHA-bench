# Secret Rotation Validator pipeline.
#
# Two jobs:
#   test   - lint the script and run the full bats suite
#   report - generate the rotation report from fixtures/secrets.json using
#            parameters from fixtures/params.env (NOW_DATE / WARN_DAYS /
#            FORMAT / EXPECT_ERROR), so the same workflow can be driven by
#            different fixture data in tests.
name: Secret Rotation Validator

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly Monday-morning rotation audit.
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  CONFIG_PATH: fixtures/secrets.json
  PARAMS_PATH: fixtures/params.env

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install bats
        run: npm install -g bats

      - name: Syntax-check script
        run: bash -n secret-rotation-validator.sh

      - name: Run bats test suite
        run: bats tests/secret_rotation_validator.bats

  report:
    name: Generate rotation report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load report parameters
        run: cat "$PARAMS_PATH" >> "$GITHUB_ENV"

      - name: Generate rotation report
        run: |
          set -uo pipefail
          if [ "${EXPECT_ERROR:-0}" = "1" ]; then
            # Negative-path case: the fixture config is intentionally broken
            # and the script must fail with a meaningful message.
            if output=$(bash secret-rotation-validator.sh \
                --config "$CONFIG_PATH" --now "$NOW_DATE" \
                --warning-days "$WARN_DAYS" --format "$FORMAT" 2>&1); then
              echo "Expected the validator to fail, but it succeeded" >&2
              exit 1
            fi
            echo "$output"
            echo "ERROR-PATH-OK"
          else
            bash secret-rotation-validator.sh \
              --config "$CONFIG_PATH" --now "$NOW_DATE" \
              --warning-days "$WARN_DAYS" --format "$FORMAT" | tee report.out
            # Compact single-line echo so callers can assert exact values.
            if [ "$FORMAT" = "json" ]; then
              echo "COMPACT-JSON: $(jq -c . report.out)"
            fi
            echo "REPORT-OK"
          fi
