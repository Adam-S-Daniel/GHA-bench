# Artifact cleanup pipeline: runs the unit-test suite, then generates a
# deletion plan from the checked-in fixture inventory + retention policy.
# The plan step emits a ::PLAN::{json}::ENDPLAN:: line that downstream
# tooling (and the act test harness) parses for exact values.
name: Artifact Cleanup

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily at 03:17 UTC — off the top of the hour to avoid the GH cron rush.
    - cron: '17 3 * * *'

permissions:
  contents: read

env:
  # Fixture inventory + policy the cleanup job runs against. The act test
  # harness swaps the contents of these files per test case.
  ARTIFACTS_FILE: fixtures/artifacts.json
  POLICY_FILE: fixtures/policy.json

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun test

  cleanup-plan:
    name: Generate deletion plan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate artifact deletion plan
        run: bun run src/cli.ts --artifacts "$ARTIFACTS_FILE" --config "$POLICY_FILE"
