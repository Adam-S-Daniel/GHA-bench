name: Artifact Cleanup Script

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly at 03:17 UTC — routine artifact retention sweep.
    - cron: '17 3 * * *'

permissions:
  contents: read

env:
  # Path to the cleanup parameters; the act test harness swaps this file
  # per test case without touching the workflow.
  CLEANUP_PARAMS: ci/params.json

jobs:
  pester-tests:
    name: Pester test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  cleanup-plan:
    name: Artifact cleanup plan
    runs-on: ubuntu-latest
    needs: pester-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate artifact cleanup plan
        shell: pwsh
        run: ./ci/run-cleanup.ps1 -ParamsPath $env:CLEANUP_PARAMS
