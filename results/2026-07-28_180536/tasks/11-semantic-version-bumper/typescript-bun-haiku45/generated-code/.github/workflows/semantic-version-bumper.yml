name: Semantic Version Bumper

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_file:
        description: 'Path to version file (package.json or VERSION)'
        required: false
        default: 'package.json'
      previous_tag:
        description: 'Previous version tag'
        required: false
        default: 'v1.0.0'

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test
        working-directory: .

  version-bump:
    name: Bump Semantic Version
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run version bumper
        id: bump
        shell: bash
        run: |
          VERSION_FILE="${{ inputs.version_file || 'package.json' }}"
          PREVIOUS_TAG="${{ inputs.previous_tag || 'v1.0.0' }}"

          OUTPUT=$(bun run src/index.ts \
            --version-file "$VERSION_FILE" \
            --previous-tag "$PREVIOUS_TAG")

          echo "$OUTPUT"

          # Extract version from output
          NEW_VERSION=$(echo "$OUTPUT" | grep "::VERSION::" | cut -d':' -f4)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Display results
        run: |
          echo "New version: ${{ steps.bump.outputs.version }}"
