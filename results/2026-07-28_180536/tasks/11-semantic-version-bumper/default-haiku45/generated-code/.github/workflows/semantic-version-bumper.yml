name: Semantic Version Bumper

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_file:
        description: 'Path to version file (package.json or VERSION)'
        required: false
        default: 'package.json'
      from_ref:
        description: 'Git ref to compare from (e.g., HEAD~10, v1.0.0)'
        required: false
        default: 'HEAD~10'

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --production=false

      - name: Run unit tests
        run: npm test

  bump-version:
    name: Bump Semantic Version
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --production=false

      - name: Run semantic version bump
        id: version-bump
        run: |
          node bin/bump-version.js package.json HEAD~5 > /tmp/bump-output.txt 2>&1
          cat /tmp/bump-output.txt
          # Extract new version from output
          NEW_VERSION=$(grep "New version:" /tmp/bump-output.txt | awk '{print $NF}')
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Show version info
        run: |
          echo "Version bump completed"
          if [ -n "${{ steps.version-bump.outputs.new_version }}" ]; then
            echo "New version: ${{ steps.version-bump.outputs.new_version }}"
          fi
