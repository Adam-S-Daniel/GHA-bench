# Dependabot for this repo.
#
# Previously this repo pinned third-party GitHub Actions to commit SHAs (per
# the account-wide SHA-pinning convention) but had no dependabot.yml at all,
# so those pins had no bump path — they'd sit until someone noticed. This
# onboards two ecosystems, each landed unattended by
# .github/workflows/dependabot-auto-merge.yml once CI is green (see that
# file for why this repo needs a scheduled sweep, not just native
# auto-merge, to actually land them):
#   - github-actions: the SHA-pinned third-party actions across
#     .github/workflows/*.yml.
#
# NO `pip` ECOSYSTEM, deliberately: the root pyproject.toml declares only
# `[tool.pytest.ini_options]` — there is no `[project]` table and no
# dependency list, so pip would have nothing to resolve or bump. CI installs
# its one dependency imperatively (`pip install pytest` in ci.yml), which
# Dependabot cannot see either. Adding the ecosystem today would be inert
# config that reads as policy. If this repo ever declares real dependencies
# in pyproject.toml, add a `pip` block with the same cooldown as below —
# that declaration is the fact this decision turns on.
#
# `results/**` IS NOT SOURCE, and the only entries that name it SUPPRESS:
#   it contains hundreds of GENERATED BENCHMARK ARTIFACTS — manifests written
#   by the benchmark's own task runs (verified 2026-10-04: 372 package.json,
#   117 bun.lock, 93 requirements*.txt, plus setup.py / pyproject.toml /
#   *.csproj / global.json, every one under results/*/tasks/*/*/generated-code/). They are
#   output data, not dependencies this repo builds against, and AGENTS.md
#   forbids patching them ("Never fix agent-generated code").
#
#   Leaving them unconfigured did NOT keep Dependabot away. Version updates
#   only scan what an `updates:` entry names, but SECURITY updates act on
#   every alert the dependency graph raises, configured or not — GHA-bench#92
#   and #93 were security-update PRs bumping lockfiles inside
#   results/2026-05-06_173435/. So the entries at the bottom of this
#   file cover `/results/**/*` for each ecosystem present there, and exist
#   only to say no:
#     - `open-pull-requests-limit: 0` stops VERSION updates for them
#       (security updates are exempt from this limit by GitHub's spec);
#     - `ignore: [{dependency-name: "*"}]` is what stops SECURITY updates —
#       `ignore` is one of the options GitHub applies to security updates
#       too, and a security update only reads an entry whose `directories`
#       match the manifest's location and that sets no `target-branch`.
#   Never raise that limit, narrow that ignore (a `versions:` or
#   `update-types:` key would let updates back through), or add a
#   `target-branch` to them. Alerts are still raised; only PRs are stopped.
#   tests/test_dependabot_config.py pins all of this. The scheduled sweep in
#   dependabot-auto-merge.yml also refuses any PR touching results/ or
#   workspaces/, as a backstop if one opens anyway.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # MINIMUM PACKAGE AGE ("cooldown") — how long a release must exist before
    # Dependabot will even OPEN the PR. Version updates ONLY: security
    # updates bypass cooldown by GitHub's spec, so an advisory still opens
    # (and auto-merges) immediately. GitHub's own default is an implicit
    # 3-day minimum age, so `default-days: 7` here is a deliberate RAISE, not
    # a floor from zero — it mechanises this account's standing 7-day
    # cooling-off convention for third-party action SHAs (see
    # cms-platform/AGENTS.md, "SHA-pin every workflow `uses:`"), matching
    # cms-platform's own .github/dependabot.yml.
    #
    # NO semver-major-days (and no semver-minor-days / semver-patch-days
    # either): GitHub's Dependabot options reference marks the
    # github-actions ecosystem as supporting `default-days` but NOT
    # per-SemVer-tier cooldown at all. Every actions bump, majors included,
    # waits only the flat 7 days above — there is no separate major-bump
    # wait to configure. Re-adding any `semver-*-days` key to a
    # github-actions block is a schema validation error ("...cooldown' is
    # not supported for the package ecosystem 'github-actions'") that takes
    # the WHOLE `updates[]` entry out of service, not a silently-ignored
    # key — and since this is the only entry here that updates anything
    # (the others below only suppress), that means no updates run at all. dependabot/dependabot-core#14628 is the open
    # upstream request to add the support; until it lands, this stays flat.
    cooldown:
      default-days: 7
      # cms-platform releases are this account's own code, gated by its own
      # required checks before a tag ever exists, so they don't need the
      # 7-day cooling-off above — that applies to third-party actions. The
      # scheduled-run-health thin caller names the platform version once
      # (`uses:@<tag>`; the reusable resolves its own script commit from the
      # job context instead of a second `platform_ref:` input), so this
      # exclude is what lets that one bump land the week the release ships
      # instead of sitting behind the third-party wait
      # (https://github.com/Adam-S-Daniel/cms-platform/issues/424).
      exclude: ["Adam-S-Daniel/cms-platform/*"]

  # --- SUPPRESSION ONLY: benchmark output under results/ (see header) ---
  # One entry per ecosystem with manifests under results/. Each matches every
  # directory below results/ and ignores every dependency, so neither version
  # nor security updates open a PR there. `schedule` is required by the
  # schema; with the limit at 0 its value only sets how often a no-op
  # version-update job runs.
  - package-ecosystem: npm
    directories:
      - "/results/**/*"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: bun
    directories:
      - "/results/**/*"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: pip
    directories:
      - "/results/**/*"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: nuget
    directories:
      - "/results/**/*"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: dotnet-sdk
    directories:
      - "/results/**/*"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
