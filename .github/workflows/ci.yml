name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Hand-trigger, so this lane can be re-verified without inventing a commit: with
  # only push/pull_request, confirming "does CI pass now?" after a fix requires
  # pushing something, and there is not always something to push. Safe to add an
  # event that can re-fire on a head SHA here because repo-settings' fleet.yml gives
  # Adam-S-Daniel/GHA-bench no override and it inherits `required_status_checks: []`
  # -- this job publishes no required context, so it cannot leave a cancelled run
  # shadowing a success and hard-blocking the merge (the 405 "... is cancelled" trap).
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Verify imports
        run: |
          python -c "from runner import main"
          python -c "from generate_results import generate_results_md"
          python -c "from test_quality import compute_structural_metrics"
          python -c "from llm_providers import get_provider"
          python -c "from version_docs import build_doc, main"
          python -c "from combine_results import combine"
