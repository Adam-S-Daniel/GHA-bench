name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Verify imports
        run: |
          python -c "from runner import main"
          python -c "from generate_results import generate_results_md"
          python -c "from test_quality import compute_structural_metrics"
          python -c "from llm_providers import get_provider"
          python -c "from version_docs import build_doc, main"
          python -c "from combine_results import combine"
